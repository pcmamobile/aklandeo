<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Leaderboards 3D</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');

    :root {
      --bg-gradient: linear-gradient(-45deg, #0f172a, #1e1b4b, #312e81, #0f172a);
      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.1);
      --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      
      --primary: #3b82f6;
      --primary-depth: #1d4ed8;
      --accent: #ec4899;
      --accent-depth: #be185d;
      --danger: #ef4444;
      --danger-depth: #b91c1c;

      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      
      --lb-gold: #fbbf24;
      --lb-silver: #cbd5e1;
      --lb-bronze: #f97316;
    }

    body {
      margin: 0;
      font-family: 'Nunito', sans-serif;
      background: var(--bg-gradient);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }

    /* 3D Button Utility */
    .btn-3d {
      border: none;
      border-radius: 12px;
      font-weight: 900;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: white;
    }
    .btn-3d:active {
      transform: translateY(4px) !important;
      box-shadow: 0 0 0 transparent !important;
    }

    /* Glassmorphism */
    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      border-radius: 16px;
    }

    /* Navigation */
    .sticky-nav {
      position: sticky;
      top: 0;
      z-index: 200;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      border-bottom: 2px solid rgba(255,255,255,0.05);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .header {
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .header-left h1 { margin: 0; font-size: 24px; font-weight: 900; background: linear-gradient(to right, #60a5fa, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 4px 10px rgba(0,0,0,0.2); }

    .reloadBtnWrap { position: relative; }
    .reloadBtn {
      background: linear-gradient(135deg, var(--accent), #f43f5e);
      box-shadow: 0 4px 0 var(--accent-depth);
      padding: 10px 20px;
      font-size: 13px;
    }
    .reloadBtn:hover { transform: translateY(-2px); box-shadow: 0 6px 0 var(--accent-depth); filter: brightness(1.1);}
    
    .reloadBadge {
      position: absolute; top: -8px; right: -8px; background: #fbbf24; color: #000; font-size: 10px; font-weight: 900; padding: 4px 8px; border-radius: 12px; display: none; box-shadow: 0 4px 10px rgba(0,0,0,0.4); animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; z-index: 10;
    }
    .reloadBadge.show { display: block; }
    @keyframes pop { 0% { transform: scale(0) rotate(-10deg); } 100% { transform: scale(1) rotate(0deg); } }

    .container { max-width: 1500px; margin: 24px auto; padding: 0 24px; }

    /* Progress Loading Overlay */
    .progOverlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center; z-index: 9999; }
    .progBox { background: rgba(30, 41, 59, 0.9); border: 1px solid rgba(255,255,255,0.1); padding: 32px; border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 2px 10px rgba(255,255,255,0.1); text-align: center; width: 320px; transform: perspective(1000px) translateZ(50px); animation: floatBox 3s ease-in-out infinite alternate;}
    @keyframes floatBox { from { transform: translateY(-10px); } to { transform: translateY(10px); } }
    
    .progBox h3 { margin: 0 0 16px; color: white; font-size: 20px; font-weight: 900; }
    .progText { font-size: 14px; color: #38bdf8; margin-bottom: 20px; font-weight: 900; letter-spacing: 1px;}
    .progBarBg { width: 100%; height: 16px; background: rgba(0,0,0,0.5); border-radius: 16px; overflow: hidden; box-shadow: inset 0 4px 8px rgba(0,0,0,0.5), 0 1px 0 rgba(255,255,255,0.1); padding: 2px;}
    .progBarFill { height: 100%; background: linear-gradient(90deg, #10b981, #34d399, #10b981); background-size: 200% 100%; border-radius: 12px; width: 0%; transition: width 0.2s cubic-bezier(0.4, 0, 0.2, 1); animation: loadingBar 2s infinite linear; box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);}
    @keyframes loadingBar { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }

    /* --- LEADERBOARD 3D STYLES --- */
    .lb-header-global {
      background: rgba(0,0,0,0.3); color: white; padding: 30px; border-radius: 20px; margin-bottom: 24px; text-align: center; box-shadow: inset 0 2px 10px rgba(255,255,255,0.05), 0 10px 30px rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); position: relative; overflow: hidden;
    }
    .lb-header-global::before { content: '🏆'; position: absolute; font-size: 100px; opacity: 0.05; top: -10px; right: 20px; transform: rotate(15deg); }
    .lb-header-global::after { content: '🚀'; position: absolute; font-size: 80px; opacity: 0.05; bottom: -10px; left: 20px; transform: rotate(-15deg); }
    .lb-header-global h2 { margin: 0 0 8px 0; font-size: 28px; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 4px 10px rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; gap: 12px;}
    .lb-header-global p { margin: 0; font-size: 15px; color: #94a3b8; font-weight: bold; }

    .mobile-tabs { display: none; background: rgba(0,0,0,0.4); border-radius: 16px; padding: 8px; gap: 8px; margin-bottom: 20px; justify-content: space-between; border: 1px solid rgba(255,255,255,0.05);}
    .m-tab-btn { flex: 1; background: transparent; color: #94a3b8; border: none; padding: 14px; border-radius: 12px; font-weight: 900; font-size: 16px; cursor: pointer; transition: 0.3s; }
    .m-tab-btn.active { background: linear-gradient(135deg, var(--accent), #f43f5e); color: white; box-shadow: 0 4px 15px rgba(236, 72, 153, 0.4); transform: translateY(-2px);}

    .leaderboards-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }

    .lb-role-board {
      background: var(--glass-bg); border-radius: 20px; overflow: hidden; color: white; box-shadow: var(--glass-shadow); border: 1px solid var(--glass-border); display: flex; flex-direction: column; transition: 0.3s; transform: perspective(1000px) rotateX(2deg);
    }
    .lb-role-board:hover { transform: perspective(1000px) rotateX(0deg) translateY(-5px); box-shadow: 0 20px 40px rgba(0,0,0,0.4); border-color: rgba(255,255,255,0.2);}
    
    .lb-board-title {
      background: rgba(0,0,0,0.4); padding: 16px; font-size: 15px; font-weight: 900; letter-spacing: 1px; color: #fff; border-bottom: 1px solid rgba(255,255,255,0.1); text-transform: uppercase; display: flex; justify-content: space-between; align-items: center;
    }
    
    .race-btn {
      background: linear-gradient(135deg, #8b5cf6, #d946ef); box-shadow: 0 3px 0 #6d28d9; padding: 6px 12px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .race-btn:hover { filter: brightness(1.2); }

    .lb-podium {
      display: flex; justify-content: center; align-items: flex-end; padding: 40px 10px 0px; gap: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); background: radial-gradient(circle at top, rgba(255,255,255,0.05) 0%, transparent 70%);
    }
    
    /* 3D Pedestals */
    .podium-box {
      text-align: center; position: relative; flex: 1; max-width: 120px; padding: 16px 8px; border-radius: 12px 12px 0 0; display: flex; flex-direction: column; justify-content: flex-start;
    }
    .podium-box::before {
      content: ''; position: absolute; inset: 0; border-radius: 12px 12px 0 0; z-index: -1;
    }
    .podium-box::after {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 10px; background: rgba(255,255,255,0.2); border-radius: 12px 12px 0 0; z-index: 0;
    }
    
    .podium-1 { height: 150px; z-index: 3; }
    .podium-1::before { background: linear-gradient(180deg, rgba(251,191,36,0.3) 0%, rgba(0,0,0,0.2) 100%); border: 1px solid rgba(251,191,36,0.5); border-bottom: none; box-shadow: 0 -20px 40px rgba(251,191,36,0.2); }
    
    .podium-2 { height: 110px; z-index: 2; }
    .podium-2::before { background: linear-gradient(180deg, rgba(203,213,225,0.2) 0%, rgba(0,0,0,0.2) 100%); border: 1px solid rgba(203,213,225,0.3); border-bottom: none; }
    
    .podium-3 { height: 90px; z-index: 1; }
    .podium-3::before { background: linear-gradient(180deg, rgba(249,115,22,0.2) 0%, rgba(0,0,0,0.2) 100%); border: 1px solid rgba(249,115,22,0.3); border-bottom: none; }
    
    .podium-stars { margin-bottom: 8px; line-height: 1; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5)); position: relative; z-index: 2; animation: float 3s ease-in-out infinite alternate;}
    @keyframes float { from { transform: translateY(0px); } to { transform: translateY(-5px); } }
    
    .podium-1 .podium-stars { font-size: 32px; letter-spacing: -4px;}
    .podium-2 .podium-stars { font-size: 24px; letter-spacing: -2px;}
    .podium-3 .podium-stars { font-size: 20px; letter-spacing: -2px;}
    
    .podium-rank { font-weight: 900; font-size: 16px; margin-bottom: 12px; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.8); position: relative; z-index: 2;}
    .podium-name { font-weight: 900; font-size: 14px; line-height: 1.2; margin-bottom: 6px; text-transform: uppercase; text-shadow: 0 2px 4px rgba(0,0,0,0.8); word-wrap: break-word; position: relative; z-index: 2;}
    .podium-score { font-size: 12px; color: #e2e8f0; font-weight: bold; position: relative; z-index: 2; background: rgba(0,0,0,0.4); padding: 4px; border-radius: 6px;}

    .podium-1 .podium-name, .podium-1 .podium-rank { color: var(--lb-gold); text-shadow: 0 0 10px rgba(251,191,36,0.5); }
    .podium-2 .podium-name, .podium-2 .podium-rank { color: var(--lb-silver); }
    .podium-3 .podium-name, .podium-3 .podium-rank { color: var(--lb-bronze); }

    .lb-list { display: flex; flex-direction: column; padding: 12px 0; }
    .lb-row { display: flex; align-items: center; padding: 14px 16px; gap: 14px; border-bottom: 1px solid rgba(255,255,255,0.05); transition: 0.2s; position: relative; overflow: hidden;}
    .lb-row:hover { background: rgba(255,255,255,0.05); transform: scale(1.02); z-index: 10; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.3);}
    .lb-row:last-child { border-bottom: none; }
    
    .lb-rank-circle {
      width: 36px; height: 36px; background: rgba(0,0,0,0.4); border: 2px solid rgba(255,255,255,0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 14px; color: #cbd5e1; flex-shrink: 0; box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
    }
    .lb-rank-circle.rank-1 { background: linear-gradient(135deg, var(--lb-gold), #d97706); border-color: #fef3c7; color: #fff; font-size: 18px; box-shadow: 0 0 15px rgba(251, 191, 36, 0.6), inset 0 2px 4px rgba(255,255,255,0.5); text-shadow: 0 1px 2px rgba(0,0,0,0.5);}
    .lb-rank-circle.rank-2 { background: linear-gradient(135deg, var(--lb-silver), #94a3b8); border-color: #f8fafc; color: #fff; font-size: 18px; box-shadow: 0 0 12px rgba(203, 213, 225, 0.5), inset 0 2px 4px rgba(255,255,255,0.5); text-shadow: 0 1px 2px rgba(0,0,0,0.5);}
    .lb-rank-circle.rank-3 { background: linear-gradient(135deg, var(--lb-bronze), #c2410c); border-color: #ffedd5; color: #fff; font-size: 18px; box-shadow: 0 0 12px rgba(249, 115, 22, 0.5), inset 0 2px 4px rgba(255,255,255,0.5); text-shadow: 0 1px 2px rgba(0,0,0,0.5);}
    
    .lb-info-container { flex: 1; display: flex; justify-content: space-between; align-items: center; gap: 12px;}
    .lb-name-bar-col { flex: 1; display: flex; flex-direction: column; gap: 8px; }
    
    .lb-name { font-size: 15px; font-weight: 900; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: 0.5px; text-shadow: 0 2px 4px rgba(0,0,0,0.5);}
    .lb-name.text-gold { color: var(--lb-gold); }
    .lb-name.text-bronze { color: var(--lb-bronze); }

    .lb-progress-bg { width: 100%; height: 8px; background: rgba(0,0,0,0.5); border-radius: 8px; overflow: hidden; box-shadow: inset 0 2px 4px rgba(0,0,0,0.5), 0 1px 0 rgba(255,255,255,0.1);}
    .lb-progress-fill { height: 100%; border-radius: 8px; transition: width 1s cubic-bezier(0.175, 0.885, 0.32, 1.275); position: relative; overflow: hidden;}
    .lb-progress-fill::after { content:''; position: absolute; top:0; left:0; right:0; bottom:0; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent); animation: shine 2s infinite;}
    @keyframes shine { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
    
    .lb-stats-col { text-align: right; min-width: 60px; display: flex; flex-direction: column; gap: 4px; background: rgba(0,0,0,0.2); padding: 6px 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05);}
    .lb-pct { font-size: 18px; font-weight: 900; color: #fff; line-height: 1; text-shadow: 0 2px 4px rgba(0,0,0,0.5);}
    .lb-fraction { font-size: 11px; font-weight: 900; color: #94a3b8; line-height: 1; }

    /* --- RACE ANIMATION MODAL --- */
    .race-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: none; align-items: center; justify-content: center; z-index: 10001; backdrop-filter: blur(10px); }
    .race-box { background: rgba(15, 23, 42, 0.9); border-radius: 24px; box-shadow: 0 25px 50px rgba(0,0,0,0.8), inset 0 0 0 1px rgba(255,255,255,0.1); width: 95%; max-width: 1400px; height: 88vh; display: flex; flex-direction: column; overflow: hidden; }
    .race-header { padding: 20px 30px; background: rgba(0,0,0,0.5); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); box-shadow: 0 4px 20px rgba(0,0,0,0.5);}
    .race-header h3 { margin: 0; color: #fff; font-size: 24px; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; display: flex; align-items: center; gap: 12px; }
    .race-controls { display: flex; gap: 16px; }
    
    .race-controls button {
      background: rgba(255,255,255,0.1); box-shadow: 0 4px 0 rgba(0,0,0,0.3); padding: 10px 20px; font-size: 14px;
    }
    .race-controls .close-btn { background: linear-gradient(135deg, var(--danger), #f87171); box-shadow: 0 4px 0 var(--danger-depth); }
    
    .race-canvas-container { flex: 1; padding: 24px; position: relative; background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%); }
    canvas#raceCanvas { width: 100%; height: 100%; display: block; border-radius: 16px; box-shadow: inset 0 0 30px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.05);}

    /* RESPONSIVE DESIGN FOR MOBILE */
    @media (max-width: 1200px) {
      .mobile-tabs { display: flex; }
      .leaderboards-grid { grid-template-columns: 1fr; }
      .lb-role-board { display: none; } 
      .lb-role-board.active { display: flex; animation: fadeIn 0.4s ease; } 
      .lb-header-global { display: none; } 
    }
    
    @media (max-width: 768px) {
        .hide-mobile { display: none !important; }
        .container { padding: 0 12px; margin: 16px auto; }
        
        .header { padding: 12px; justify-content: center; text-align: center; flex-direction: column; gap: 12px;}
        .header-left { justify-content: center; }
        .header-left h1 { font-size: 20px; text-align: center;}
        
        .reloadBtnWrap { width: 100%; }
        .reloadBtn { width: 100%; justify-content: center; }

        /* Podium Scaling */
        .lb-podium { padding: 20px 0 0; gap: 4px; }
        .podium-box { max-width: 32%; padding: 12px 4px; }
        .podium-1 { height: 120px; }
        .podium-2 { height: 90px; }
        .podium-3 { height: 75px; }
        .podium-stars { font-size: 18px !important; margin-bottom: 4px; }
        .podium-rank { font-size: 13px; margin-bottom: 6px; }
        .podium-name { font-size: 11px; }
        .podium-score { font-size: 10px; }
        
        /* Leaderboard Rows */
        .lb-row { padding: 12px 10px; gap: 10px; }
        .lb-rank-circle { width: 32px; height: 32px; font-size: 13px; }
        .lb-name { font-size: 14px; }
        .lb-pct { font-size: 15px; }
        
        /* Modals */
        .race-box { width: 100%; height: 100%; border-radius: 0; }
        .race-header { flex-direction: column; align-items: stretch; gap: 12px; padding: 16px; }
        .race-header h3 { font-size: 18px; }
        .race-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .race-controls button { width: 100%; box-sizing: border-box; }
        .race-canvas-container { padding: 12px; }
    }
  </style>
</head>
<body>

  <div id="progOverlay" class="progOverlay">
    <div class="progBox">
      <h3>🚀 Booting Matrix...</h3>
      <div id="progText" class="progText">0 / 0 Data Nodes Synced</div>
      <div class="progBarBg"><div id="progBarFill" class="progBarFill"></div></div>
    </div>
  </div>

  <!-- RACE ANIMATION MODAL -->
  <div id="raceModal" class="race-overlay">
    <div class="race-box">
      <div class="race-header">
        <h3 id="raceTitle">🏆 Live Leaderboard Race</h3>
        <div class="race-controls">
          <button class="btn-3d" onclick="startRaceAnimation()">🔄 Re-simulate</button>
          <button class="btn-3d close-btn" onclick="closeRaceModal()">✖ Terminate</button>
        </div>
      </div>
      <div class="race-canvas-container" id="raceCanvasContainer">
        <canvas id="raceCanvas"></canvas>
      </div>
    </div>
  </div>

  <!-- FROZEN TOP NAVIGATION -->
  <div class="sticky-nav">
    <div class="header">
      <div class="header-left">
        <h1>✨ Project Leaderboards</h1>
      </div>
      <div class="reloadBtnWrap">
        <button class="btn-3d reloadBtn" onclick="forceReload()">🔄 Sync Matrix</button>
        <span id="reloadBadge" class="reloadBadge">⚡ NEW UPDATES</span>
      </div>
    </div>
  </div>
  <!-- END FROZEN TOP NAVIGATION -->

  <div class="container">
    
    <!-- HOME TAB WITH LEADERBOARDS -->
    <div id="upTab-home" class="upTabContent active" style="display: block;">
      <div class="lb-header-global glass-panel">
        <h2>📊 Global Submission Matrix</h2>
        <p>Real-time ranking based on completion rate (Min. 10 Documents Required to Rank)</p>
      </div>

      <div class="mobile-tabs glass-panel">
        <button class="m-tab-btn active" id="mtab-pe" onclick="switchMobileTab('pe')">👷 PE</button>
        <button class="m-tab-btn" id="mtab-pi" onclick="switchMobileTab('pi')">🕵️ PI</button>
        <button class="m-tab-btn" id="mtab-re" onclick="switchMobileTab('re')">📐 RE</button>
        <button class="m-tab-btn" id="mtab-qe" onclick="switchMobileTab('qe')">🔬 QE</button>
      </div>

      <div class="leaderboards-grid">
        <div class="lb-role-board active" id="board-pe">
          <div class="lb-board-title">
            <span>👷 Project Engineer</span>
            <button class="btn-3d race-btn" onclick="openRaceModal('pe', 'Project Engineer')">📈 Watch</button>
          </div>
          <div class="lb-podium" id="podium-pe"></div>
          <div class="lb-list" id="list-pe"></div>
        </div>
        <div class="lb-role-board" id="board-pi">
          <div class="lb-board-title">
            <span>🕵️ Project Inspector</span>
            <button class="btn-3d race-btn" onclick="openRaceModal('pi', 'Project Inspector')">📈 Watch</button>
          </div>
          <div class="lb-podium" id="podium-pi"></div>
          <div class="lb-list" id="list-pi"></div>
        </div>
        <div class="lb-role-board" id="board-re">
          <div class="lb-board-title">
            <span>📐 Resident Engineer</span>
            <button class="btn-3d race-btn" onclick="openRaceModal('re', 'Resident Engineer')">📈 Watch</button>
          </div>
          <div class="lb-podium" id="podium-re"></div>
          <div class="lb-list" id="list-re"></div>
        </div>
        <div class="lb-role-board" id="board-qe">
          <div class="lb-board-title">
            <span>🔬 Quality Engineer</span>
            <button class="btn-3d race-btn" onclick="openRaceModal('qe', 'Quality Engineer')">📈 Watch</button>
          </div>
          <div class="lb-podium" id="podium-qe"></div>
          <div class="lb-list" id="list-qe"></div>
        </div>
      </div>
    </div>

  </div>

  <script>
    /* ========================================================================= 
     * PUBLIC CONFIGURATION (Read-Only Fetching)
     * ========================================================================= */
    const SPREADSHEET_ID = "1LSYLZ7tfSeVupQMPsCOHG4SlnzPQqOAIe03QI1qRMr8";
    const API_KEY = "AIzaSyCz6fNJr3ecn-M2HActqM1aCXbxqRLj2e8";
    
    const DOC_TYPES = ["VO1", "VO2", "VO3", "VO4", "VO5", "WSO1", "WRO1", "CWSO1", "WSO2", "WRO2", "CWSO2", "WSO3", "WRO3", "CWSO3", "WSO4", "WRO4", "CWSO4", "CTE1", "CTE2", "CTE3", "CTE4", "CTE5", "CTE6", "CTE7", "CTE8", "CTE9", "CTE10", "CTE11", "CTE12", "CTE13", "CTE14", "CTE15", "CTE16", "CTE17", "CTE18", "CTE19", "CTE20", "FCIR", "COC", "FAIR", "CFA", "PHOTO"];
    let allProjects = []; 
    let globalHeaders = [];

    function switchMobileTab(role) {
      document.querySelectorAll('.m-tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('mtab-' + role).classList.add('active');
      document.querySelectorAll('.lb-role-board').forEach(board => board.classList.remove('active'));
      document.getElementById('board-' + role).classList.add('active');
    }

    function setProgress(current, total) {
      document.getElementById('progText').innerText = `${current} / ${total} Data Nodes Synced`;
      const pct = total === 0 ? 0 : Math.round((current / total) * 100);
      document.getElementById('progBarFill').style.width = pct + "%";
    }

    async function loadUploadData() {
      document.getElementById('progOverlay').style.display = 'flex';
      setProgress(0, 0);

      try {
        const url = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/UPLOAD!A3:ZZ?key=${API_KEY}`;
        const response = await fetch(url);
        const json = await response.json();
        
        if (!json.values || json.values.length === 0) {
            throw new Error("No data found in sheet.");
        }

        globalHeaders = json.values[0].map(h => String(h).trim().toUpperCase());
        
        const rows = [];
        for(let i=1; i<json.values.length; i++) {
          rows.push({
            rowNumber: i + 3, // Header is row 3 in sheets
            values: json.values[i]
          });
        }
        
        processDataStaggered({ headers: json.values[0], rows: rows });

      } catch (error) {
        document.getElementById('progOverlay').style.display = 'none';
        alert("Error loading data matrix via API: " + error.message);
      }
    }

    function processDataStaggered(data) {
      const headers = data.headers.map(h => String(h).trim().toUpperCase());
      const idxId = headers.indexOf("CONTRACT ID");
      const idxName = headers.indexOf("PROJECT NAME");
      const idxContr = headers.indexOf("CONTRACTOR");
      
      const idxPE = headers.findIndex(h => h.includes("PROJECT ENGINEER") || h === "PE");
      const idxPI = headers.findIndex(h => h.includes("PROJECT INSPECTOR") || h === "PI");
      const idxRE = headers.findIndex(h => h.includes("RESIDENT ENGINEER") || h === "RE");
      const idxQE = headers.findIndex(h => h.includes("QUALITY ENGINEER") || h === "QE" || h.includes("MATERIALS ENGINEER"));

      const total = data.rows.length;
      allProjects = [];
      let currentIndex = 0;
      const chunkSize = 25; 

      function processChunk() {
        const end = Math.min(currentIndex + chunkSize, total);
        
        for (; currentIndex < end; currentIndex++) {
          const row = data.rows[currentIndex];
          const rVals = row.values;
          
          const cid = rVals[idxId] || "Unknown";
          const pname = rVals[idxName] || "Unknown";
          const contr = rVals[idxContr] || "Unknown";
          
          const pe = idxPE >= 0 ? (rVals[idxPE] || "Unassigned") : "Unassigned";
          const pi = idxPI >= 0 ? (rVals[idxPI] || "Unassigned") : "Unassigned";
          const re = idxRE >= 0 ? (rVals[idxRE] || "Unassigned") : "Unassigned";
          const qe = idxQE >= 0 ? (rVals[idxQE] || "Unassigned") : "Unassigned";

          const pDocs = []; // Pending
          const aDocs = []; // For Approval
          const dDocs = []; // Denied
          const uDocs = []; // Approved/Uploaded

          DOC_TYPES.forEach(doc => {
            const docIdx = headers.indexOf(doc);
            const upIdx = headers.indexOf(doc + " UPLOADED");

            if (docIdx >= 0 && String(rVals[docIdx] || "").trim() !== "") {
              let rawVal = upIdx >= 0 ? String(rVals[upIdx] || "").trim() : "";
              
              if (rawVal !== "") {
                if (rawVal.includes("|OK")) {
                  uDocs.push({ docType: doc });
                } else if (rawVal.includes("|DENIED|")) {
                  dDocs.push({ docType: doc });
                } else {
                  aDocs.push({ docType: doc });
                }
              } else {
                pDocs.push({ docType: doc });
              }
            }
          });

          if (pDocs.length > 0 || aDocs.length > 0 || dDocs.length > 0 || uDocs.length > 0) {
            allProjects.push({ cid, pname, contr, pe, pi, re, qe, pDocs, aDocs, dDocs, uDocs });
          }
        }

        setProgress(currentIndex, total);

        if (currentIndex < total) {
          requestAnimationFrame(processChunk);
        } else {
          setTimeout(() => {
            document.getElementById('progOverlay').style.display = 'none';
            renderAllLeaderboards();
          }, 300);
        }
      }
      processChunk();
    }

    // --- LEADERBOARD LOGIC ---

    function getRankData(roleKey) {
      let stats = {};
      allProjects.forEach(p => {
        let name = p[roleKey]; 
        if (!name || name === "Unassigned" || name === "Unknown" || name.trim() === "") return;
        
        if (!stats[name]) { stats[name] = { name: name, uploaded: 0, total: 0 }; }
        
        let up = p.uDocs.length + p.aDocs.length; 
        let pending = p.pDocs.length + (p.dDocs ? p.dDocs.length : 0); 
        
        stats[name].uploaded += up;
        stats[name].total += (up + pending);
      });

      let lbArray = Object.values(stats).filter(s => s.total >= 10);
      
      lbArray.forEach(s => {
        s.pct = Math.round((s.uploaded / s.total) * 100);
      });

      lbArray.sort((a, b) => b.pct - a.pct || b.uploaded - a.uploaded);
      return lbArray;
    }

    function renderAllLeaderboards() {
      const roles = ['pe', 'pi', 're', 'qe'];
      
      roles.forEach(role => {
        const data = getRankData(role);
        const podiumCont = document.getElementById('podium-' + role);
        const listCont = document.getElementById('list-' + role);
        
        podiumCont.innerHTML = "";
        listCont.innerHTML = "";

        if (data.length === 0) {
          listCont.innerHTML = `<p style="padding: 20px; opacity: 0.5; font-weight: 900; text-align: center; width: 100%;">NO DATA MATRIX FOUND</p>`;
          return;
        }

        const first = data[0];
        const second = data[1];
        const third = data[2];
        let podiumHTML = "";

        if (second) {
          podiumHTML += `
            <div class="podium-box podium-2">
              <div class="podium-stars">🥈</div>
              <div class="podium-rank">2ND</div>
              <div class="podium-name" title="${second.name}">${second.name}</div>
              <div class="podium-score">${second.pct}%<br>${second.uploaded}/${second.total}</div>
            </div>`;
        }
        
        if (first) {
          podiumHTML += `
            <div class="podium-box podium-1">
              <div class="podium-stars">👑</div>
              <div class="podium-rank">1ST</div>
              <div class="podium-name" title="${first.name}">${first.name}</div>
              <div class="podium-score">${first.pct}%<br>${first.uploaded}/${first.total}</div>
            </div>`;
        }
        
        if (third) {
          podiumHTML += `
            <div class="podium-box podium-3">
              <div class="podium-stars">🥉</div>
              <div class="podium-rank">3RD</div>
              <div class="podium-name" title="${third.name}">${third.name}</div>
              <div class="podium-score">${third.pct}%<br>${third.uploaded}/${third.total}</div>
            </div>`;
        }
        podiumCont.innerHTML = podiumHTML;

        let listHTML = "";
        for (let i = 0; i < data.length; i++) {
          let row = data[i];
          let rank = i + 1;
          
          let rankBadge = `<div class="lb-rank-circle">${rank}</div>`;
          let barColor = "#38bdf8"; 
          let nameColorClass = "";

          if (rank === 1) {
            rankBadge = `<div class="lb-rank-circle rank-1">1</div>`;
            barColor = "linear-gradient(90deg, #fbbf24, #f59e0b)";
            nameColorClass = "text-gold";
          } else if (rank === 2) {
            rankBadge = `<div class="lb-rank-circle rank-2">2</div>`;
            barColor = "linear-gradient(90deg, #cbd5e1, #94a3b8)";
          } else if (rank === 3) {
            rankBadge = `<div class="lb-rank-circle rank-3">3</div>`;
            barColor = "linear-gradient(90deg, #f97316, #ea580c)";
            nameColorClass = "text-bronze";
          } else {
            barColor = "linear-gradient(90deg, #38bdf8, #2563eb)";
          }

          listHTML += `
            <div class="lb-row">
              ${rankBadge}
              <div class="lb-info-container">
                <div class="lb-name-bar-col">
                  <div class="lb-name ${nameColorClass}" title="${row.name}">${row.name}</div>
                  <div class="lb-progress-bg">
                    <div class="lb-progress-fill" style="width: ${row.pct}%; background: ${barColor}"></div>
                  </div>
                </div>
                <div class="lb-stats-col">
                  <div class="lb-pct">${row.pct}%</div>
                  <div class="lb-fraction">${row.uploaded}/${row.total}</div>
                </div>
              </div>
            </div>
          `;
        }
        listCont.innerHTML = listHTML;
      });
    }

    // --- REALTIME UPDATES ---
    let lastLogCount = -1;
    let pollInterval;

    function forceReload() {
      document.getElementById('reloadBadge').classList.remove('show');
      loadUploadData(); 
    }

    async function checkServerForUpdates() {
      try {
        const url = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/UPLOAD!A3:A?key=${API_KEY}`;
        const res = await fetch(url);
        const json = await res.json();
        const currentCount = json.values ? json.values.length : 0;
        
        if (lastLogCount === -1) {
          lastLogCount = currentCount;
        } else if (currentCount > lastLogCount) {
          document.getElementById('reloadBadge').classList.add('show');
          lastLogCount = currentCount; 
        }
      } catch (e) {
        console.error("Polling error: ", e);
      }
    }

    function startRadar() {
      checkServerForUpdates();
      if (pollInterval) clearInterval(pollInterval);
      pollInterval = setInterval(checkServerForUpdates, 15000);
    }
    
    // --- RACING S-LINE CHART ANIMATION LOGIC ---

    let raceAnimationId;
    let raceData = [];
    let raceProgress = 0; 
    let maxSteps = 100; 
    let maxDays = 30; 

    const raceColors = [
      '#00f2fe', '#4facfe', '#fbbf24', '#f43f5e', '#a855f7', 
      '#10b981', '#f97316', '#38bdf8', '#eab308', '#ec4899'
    ];

    function openRaceModal(roleKey, roleTitle) {
      document.getElementById('raceTitle').innerHTML = `🏆 Live Matrix Race: <span style="color:#38bdf8;">${roleTitle}</span>`;
      document.getElementById('raceModal').style.display = 'flex';
      
      let rawData = getRankData(roleKey);
      
      raceData = rawData.slice(0, 10).map((p, i) => {
        let maxScore = p.pct;
        let midpoint = 30 + Math.random() * 40; 
        let steepness = 0.05 + Math.random() * 0.1;
        
        let history = [];
        for(let step = 0; step <= maxSteps; step++) {
          let rawLogistic = maxScore / (1 + Math.exp(-steepness * (step - midpoint)));
          history.push(rawLogistic);
        }
        
        let minRaw = history[0];
        let maxRaw = history[maxSteps];
        history = history.map(v => ((v - minRaw) / (maxRaw - minRaw)) * maxScore);
        
        history[maxSteps] = maxScore;

        return {
          name: p.name,
          finalScore: maxScore,
          history: history,
          color: raceColors[i % raceColors.length]
        };
      });

      startRaceAnimation();
    }

    function closeRaceModal() {
      document.getElementById('raceModal').style.display = 'none';
      if(raceAnimationId) cancelAnimationFrame(raceAnimationId);
    }

    function startRaceAnimation() {
      if(raceAnimationId) cancelAnimationFrame(raceAnimationId);
      
      let canvas = document.getElementById('raceCanvas');
      canvas.style.width = '100%';
      canvas.style.height = '100%';
      
      let rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * 2;
      canvas.height = rect.height * 2;
      
      let ctx = canvas.getContext('2d');
      ctx.scale(2, 2); 

      let lastTime = performance.now();
      raceProgress = 0;

      function drawFrame(time) {
        let dt = time - lastTime;
        lastTime = time;
        
        raceProgress += 0.01 * dt;
        if(raceProgress > maxSteps) raceProgress = maxSteps;

        renderRaceFrame(ctx, rect.width, rect.height, raceProgress);

        if(raceProgress < maxSteps) {
          raceAnimationId = requestAnimationFrame(drawFrame);
        }
      }
      raceAnimationId = requestAnimationFrame(drawFrame);
    }

    function renderRaceFrame(ctx, width, height, progress) {
      ctx.clearRect(0, 0, width, height);

      const padX = 70;
      const padTop = 40;
      const padBottom = 60;
      const chartW = width - padX - 260; 
      const chartH = height - padTop - padBottom;

      let yMax = 100;

      // Glow effect lines
      ctx.strokeStyle = 'rgba(255,255,255,0.1)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      for(let i=0; i<=5; i++) {
        let y = padTop + chartH - (i/5)*chartH;
        ctx.moveTo(padX, y);
        ctx.lineTo(padX + chartW, y);
        
        ctx.fillStyle = '#64748b';
        ctx.font = 'bold 13px Nunito';
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        ctx.fillText(Math.round((i/5)*yMax) + '%', padX - 15, y);
      }
      ctx.stroke();

      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      let today = new Date();
      let startDate = new Date();
      startDate.setDate(today.getDate() - maxDays);
      
      for(let i=0; i<=5; i++) {
        let x = padX + (i/5)*chartW;
        let tickDate = new Date(startDate.getTime());
        tickDate.setDate(startDate.getDate() + Math.round((i/5)*maxDays));
        
        let dayStr = tickDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        ctx.fillText(dayStr, x, padTop + chartH + 20);
      }

      let currentScores = raceData.map(d => {
        let floor = Math.floor(progress);
        let ceil = Math.ceil(progress);
        let fract = progress - floor;
        let val = (floor === maxSteps) ? d.history[maxSteps] : d.history[floor] + (d.history[ceil] - d.history[floor]) * fract;
        return { ...d, currentVal: val };
      });

      currentScores.sort((a, b) => a.currentVal - b.currentVal);

      currentScores.forEach(d => {
        let floor = Math.floor(progress);
        if (floor < maxSteps) {
          d.curX = padX + (progress/maxSteps)*chartW;
          d.curY = padTop + chartH - (d.currentVal/yMax)*chartH;
        } else {
          d.curX = padX + chartW;
          d.curY = padTop + chartH - (d.finalScore/yMax)*chartH;
        }
        d.targetY = d.curY;
      });

      let labels = [...currentScores].sort((a, b) => a.targetY - b.targetY);
      const minGap = 26; 
      
      for (let i = 1; i < labels.length; i++) {
        if (labels[i].targetY - labels[i-1].targetY < minGap) {
          labels[i].targetY = labels[i-1].targetY + minGap;
        }
      }
      for (let i = labels.length - 2; i >= 0; i--) {
        if (labels[i+1].targetY - labels[i].targetY < minGap) {
          labels[i].targetY = labels[i+1].targetY - minGap;
        }
      }

      currentScores.forEach(d => {
        ctx.beginPath();
        ctx.strokeStyle = d.color;
        ctx.lineWidth = 5;
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        ctx.shadowBlur = 15;
        ctx.shadowColor = d.color;

        for(let step=0; step<=Math.floor(progress); step++) {
          let x = padX + (step/maxSteps)*chartW;
          let y = padTop + chartH - (d.history[step]/yMax)*chartH;
          if (step === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }

        ctx.lineTo(d.curX, d.curY);
        ctx.stroke();
        ctx.shadowBlur = 0; // reset
      });

      currentScores.forEach((d, idx) => {
        // Draw Tip Marker
        ctx.fillStyle = d.color;
        ctx.beginPath();
        ctx.arc(d.curX, d.curY, 7, 0, Math.PI*2);
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();

        let textX = d.curX + 16;

        if (Math.abs(d.curY - d.targetY) > 1) {
          ctx.beginPath();
          ctx.strokeStyle = d.color;
          ctx.lineWidth = 2;
          ctx.setLineDash([4, 4]);
          ctx.moveTo(d.curX + 8, d.curY);
          ctx.lineTo(d.curX + 20, d.targetY);
          ctx.lineTo(d.curX + 30, d.targetY);
          ctx.stroke();
          ctx.setLineDash([]);
          textX = d.curX + 35;
        }

        ctx.font = '900 15px Nunito';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        
        ctx.fillStyle = 'rgba(0,0,0,0.8)';
        ctx.fillText(`🚀 ${d.name} | ${Math.round(d.currentVal)}%`, textX + 2, d.targetY + 2);
        
        ctx.fillStyle = d.color;
        ctx.fillText(`🚀 ${d.name} | ${Math.round(d.currentVal)}%`, textX, d.targetY);
      });
    }

    window.addEventListener('resize', () => {
      if(document.getElementById('raceModal').style.display === 'flex') {
        startRaceAnimation(); 
      }
    });

    window.addEventListener('load', startRadar);
    window.onload = loadUploadData;

  </script>
