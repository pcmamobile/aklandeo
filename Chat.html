<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Pastel 3D Messenger Pro (No Delay)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  
  <!-- JWT Generation Library for Direct Google Sheets Access -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsrsasign/10.5.27/jsrsasign-all-min.js"></script>

  <style>
    /* Mobile Viewport Fix */
    html, body {
      height: 100%;
      height: 100dvh;
      width: 100%;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }
    
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    
    /* Default High Performance / Animations */
    .bg-animated-pastel { background: linear-gradient(-45deg, #ff9a9e, #fecfef, #a1c4fd, #c2e9fb); background-size: 400% 400%; }
    .perf-high .bg-animated-pastel { animation: gradientBG 15s ease infinite; }
    @keyframes gradientBG { 0% {background-position: 0% 50%} 50% {background-position: 100% 50%} 100% {background-position: 0% 50%} }
    
    .btn-3d { transition: all 0.1s ease; cursor: pointer; position: relative; }
    .perf-high .btn-3d:active, .perf-medium .btn-3d:active { transform: translateY(2px); box-shadow: none !important; }
    
    .glass { border-bottom: 1px solid rgba(255,255,255,0.5); }
    .perf-high .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); }
    .perf-medium .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(4px); }
    .perf-low .glass { background: #f8fafc; backdrop-filter: none; }
    
    .reaction-badge { border-width: 1px; cursor: pointer; }
    .perf-high .reaction-badge, .perf-medium .reaction-badge { transition: all 0.2s; }
    .perf-high .reaction-badge:hover, .perf-medium .reaction-badge:hover { transform: scale(1.1) rotate(3deg); }
    
    .perf-high .animate-float { animation: float 3s ease-in-out infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-5px); } }
    
    .emoji-btn { width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; border-radius: 12px; transition: 0.1s; }
    .emoji-btn:active { transform: scale(0.9); background: #f3f4f6; }

    .swipeable-message {
        will-change: transform;
        position: relative;
    }
    
    textarea::-webkit-scrollbar {
        width: 0px;
        background: transparent;
    }

    /* LOW PERFORMANCE OVERRIDES */
    .perf-low * { box-shadow: none !important; transition: none !important; animation: none !important; }
    .perf-low .bg-animated-pastel { background: #fdf2f8 !important; }

    /* Custom Image Lightbox */
    .lightbox-scroll-area {
        width: 100%;
        height: 100%;
        overflow: auto;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    #lightboxImg {
        transition: transform 0.2s ease-out;
        transform-origin: center center;
    }

    /* 🔥 FLOATING CHAT BOX FIX FOR MOBILE OVERLAP 🔥 */
    .chat-box-floating {
        position: fixed !important;
        bottom: 15vh !important; /* Forces it high up off the bottom */
        left: 10px !important;
        right: 10px !important;
        border-radius: 24px !important;
        box-shadow: 0 15px 40px rgba(0,0,0,0.4) !important;
        z-index: 9999 !important;
        padding-bottom: 15px !important;
        border: 3px solid #ff9a9e !important;
        background: rgba(255, 255, 255, 0.98) !important;
        width: auto !important;
    }
  </style>
</head>
<body id="mainBody" class="perf-high bg-animated-pastel font-sans h-[100dvh] w-full flex flex-col overflow-hidden text-gray-800 selection:bg-pink-200">

  <div id="authView" class="hidden flex-1 flex items-center justify-center p-4 absolute inset-0 z-50 bg-black/10 backdrop-blur-sm">

      </div>

        </button>
        <!-- Close -->
        <button onclick="closeApp()" class="btn-3d p-1.5 sm:p-2 bg-gray-50 text-gray-500 rounded-lg border border-gray-200 shadow-sm hover:bg-gray-200 hover:text-gray-800 transition-colors" title="Close App">
            <i class="ph-bold ph-x text-lg sm:text-xl"></i>

      </div>
    </header>

    <div id="messagesContainer" class="flex-1 overflow-y-auto p-2 sm:p-4 bg-white/30 backdrop-blur-sm overflow-x-hidden"></div>

        <button onclick="submitMessage()" class="btn-3d px-3 sm:px-4 py-2 sm:py-2.5 bg-pink-500 text-white rounded-xl shadow-[0_3px_0_0_#db2777] hover:bg-pink-600 flex items-center justify-center min-w-[45px] mb-0.5" id="sendBtn">

    class GoogleSheetsAPI {
        static _oauthToken = null;
        static _tokenExp = 0;

        static async getAuthToken() {
            if (this._oauthToken && this._tokenExp > Date.now()) return this._oauthToken;
            const header = { alg: "RS256", typ: "JWT" };
            const now = Math.floor(Date.now() / 1000);
            const claim = {
                iss: API_CONFIG.SERVICE_ACCOUNT.client_email,
                scope: "https://www.googleapis.com/auth/spreadsheets",
                aud: "https://oauth2.googleapis.com/token",
                exp: now + 3600, iat: now
            };

            const sHeader = JSON.stringify(header);
            const sClaim = JSON.stringify(claim);
            const sJWS = KJUR.jws.JWS.sign("RS256", sHeader, sClaim, API_CONFIG.SERVICE_ACCOUNT.private_key);

            const params = new URLSearchParams();
            params.append("grant_type", "urn:ietf:params:oauth:grant-type:jwt-bearer");
            params.append("assertion", sJWS);

            const res = await fetch("https://oauth2.googleapis.com/token", {
                method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: params.toString()
            });
            const data = await res.json();
            if (data.access_token) {
                this._oauthToken = data.access_token;
                this._tokenExp = Date.now() + (data.expires_in * 1000) - 60000;
                return data.access_token;
            } else { throw new Error("Google Token Error"); }
        }
    }

    async function fetchMessages(force = false) {
      try {
        const token = await GoogleSheetsAPI.getAuthToken();
        const res = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${API_CONFIG.SPREADSHEET_ID}/values:batchGet?ranges=${SHEET_MSGS}!A2:G&ranges=${SHEET_PROFS}!A2:G`, {
            headers: { Authorization: `Bearer ${token}` }
        });
        const data = await res.json();
        if(!data.valueRanges) return;
        
        const profRows = data.valueRanges[1].values || [];
        let parsedProfiles = {};
        profRows.forEach((row, idx) => {
            const n = row[0]; if(!n) return;
            parsedProfiles[n] = {
                color: row[1] || 'pink', picUrl: row[2] || '',
                lastActive: Number(row[3]) || 0, lastLogin: Number(row[4]) || 0,
                isOnline: row[5] === 'TRUE' || row[5] === 'true',
                rowIndex: idx + 2
            };
        });
        
        const msgRows = data.valueRanges[0].values || [];
        let parsedMsgs = [];
        msgRows.forEach((row, idx) => {
            const time = Number(row[1]) || 0; if(!time) return;
            parsedMsgs.push({
                tempId: row[0], time: time, name: row[2] || '', type: row[3] || 'text',
                content: row[4] || '', reactions: row[5] ? JSON.parse(row[5]) : {},
                imageIds: row[6] || '',  
                status: 'sent', rowIndex: idx + 2
            });
        });

        let newMsgsStr = JSON.stringify(parsedMsgs);
        let newProfsStr = JSON.stringify(parsedProfiles);

        globalUserProfiles = parsedProfiles;
        updateOnlineCount();
        
        if (!$('onlineModal').classList.contains('hidden')) refreshOnlineModalSilent();

        if (newMsgsStr !== lastMessagesStr || newProfsStr !== lastProfilesStr || force) {
            fetchedMessages = parsedMsgs;
            lastMessagesStr = newMsgsStr; lastProfilesStr = newProfsStr;
            if (displayLimit === 30 && autoScrollEnabled) renderMessagesHTML(false, 0, true);
            else renderMessagesHTML();
        }
      } catch (err) { console.error("Fetch Error:", err); }
    }

      i.value = ''; i.style.height = '40px'; autoScrollEnabled = true;
      const btn = $('sendBtn'); btn.disabled = true;

          cancelReply();
      }

      let isEdit = !!editingMsgTime;

          renderMessagesHTML(false, 0, true);

          let editedMsg = fetchedMessages.find(m => m.time === editingMsgTime);

      }

              await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${API_CONFIG.SPREADSHEET_ID}/values/${SHEET_MSGS}!A:G:append?valueInputOption=USER_ENTERED`, {
                  method: 'POST', headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },

    async function uploadImageToDrive(base64Data, filename) {
        try {
            const token = await getHumanDriveToken();
            if (!token) return null;

            const metadata = { name: filename, parents: [API_CONFIG.DRIVE_FOLDER_ID] };
            const boundary = "314159265358979323846";
            const delimiter = "\r\n--" + boundary + "\r\n";
            const close_delim = "\r\n--" + boundary + "--";
            
            const base64DataStr = base64Data.split(',')[1];
            const contentType = base64Data.split(',')[0].split(':')[1].split(';')[0];
            
            const multipartRequestBody =
                delimiter +
                'Content-Type: application/json; charset=UTF-8\r\n\r\n' +
                JSON.stringify(metadata) +
                delimiter +
                'Content-Type: ' + contentType + '\r\n' +
                'Content-Transfer-Encoding: base64\r\n\r\n' +
                base64DataStr +
                close_delim;
                
            const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': `multipart/related; boundary=${boundary}`
                },
                body: multipartRequestBody
            });
            const data = await res.json();
            
            if (data.error) {
                alert("🔴 GOOGLE DRIVE UPLOAD FAILED 🔴\n\n" + data.error.message);
                return null;
            }

            if (data.id) {
                const permRes = await fetch(`https://www.googleapis.com/drive/v3/files/${data.id}/permissions`, {
                    method: 'POST', headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ role: 'reader', type: 'anyone' })
                });
                return data.id;
            }
            return null;
        } catch (e) { 
            alert("Network Error during Google Drive Upload: " + e.message); 
            return null; 
        }
    }

    async function handleChatFileUpload(e) {
      const files = Array.from(e.target.files); 
      if (!files.length) return;
      e.target.value = '';

      const pc = $('uploadProgressContainer'), pb = $('uploadProgressBar'), pt = $('uploadPercentText');
      pc.classList.remove('hidden'); pb.style.width = "5%"; pt.innerText = "Paghahanda..."; autoScrollEnabled = true;

      const imageFiles = files.filter(f => f.type.startsWith('image/'));
      const otherFiles = files.filter(f => !f.type.startsWith('image/'));

      if (imageFiles.length > 0) {
          let uploadedIds = [];
          
          const readAndCompress = (file) => new Promise((resolve) => {
              const r = new FileReader();
              r.onload = ev => {
                  const img = new Image();
                  img.onload = () => {
                      const canvas = document.createElement('canvas'); const MAX = 1200;
                      let w = img.width, h = img.height;
                      if (w>h) { if(w>MAX) {h*=MAX/w; w=MAX;} } else { if(h>MAX) {w*=MAX/h; h=MAX;} }
                      canvas.width = w; canvas.height = h; canvas.getContext('2d').drawImage(img, 0,0, w, h);
                      resolve(canvas.toDataURL('image/jpeg', 0.8));
                  };
                  img.src = ev.target.result;
              };
              r.readAsDataURL(file);
          });

          for (let i = 0; i < imageFiles.length; i++) {
              pt.innerText = `Ina-upload ang larawan ${i+1}/${imageFiles.length}...`;
              let b64 = await readAndCompress(imageFiles[i]);
              
              let fileId = await uploadImageToDrive(b64, imageFiles[i].name);
              
              if (!fileId) {
                  pc.classList.add('hidden');
                  return; 
              }

              uploadedIds.push(fileId);
              pb.style.width = `${10 + ((i+1)/imageFiles.length)*80}%`;
          }

          if (uploadedIds.length > 0) {
              await executeChatUpload("📸 [Nakapaloob na mga Larawan]", 'image', uploadedIds.join('|'));
          }
      }

      if (otherFiles.length > 0) {
          for (let i = 0; i < otherFiles.length; i++) {
              const r = new FileReader();
              r.onload = ev => {
                  executeChatUpload(ev.target.result, ['video','audio'].includes(otherFiles[i].type.split('/')[0]) ? otherFiles[i].type.split('/')[0] : 'file');
              };
              r.readAsDataURL(otherFiles[i]);
          }
      }
    }

    function getUserStatus(profileData) {
        if (!profileData) return { text: "Offline", color: "text-gray-400", dot: "bg-gray-400" };
        const now = Date.now();
        if (profileData.isCurrentUser || profileData.isOnline) {
            let durationText = "Online";
            if (profileData.lastLogin && profileData.lastLogin > 0) {
                const onlineMins = Math.floor((now - profileData.lastLogin) / 60000);
                if (onlineMins < 60) durationText = `Online (${onlineMins}m)`;
                else { const hrs = Math.floor(onlineMins / 60); const mins = onlineMins % 60; durationText = `Online (${hrs}h ${mins}m)`; }
            }
            return { text: durationText, color: "text-green-500", dot: "bg-green-500" + (profileData.isCurrentUser ? " animate-pulse" : "") };
        } else {
            const lastActive = profileData.lastActive;
            if (lastActive && lastActive > 0) {
                const diffMins = Math.floor((now - lastActive) / 60000);
                if (diffMins < 1) return { text: "Kaa-offline lang", color: "text-gray-400", dot: "bg-gray-400" };
                if (diffMins < 60) return { text: `Offline (${diffMins}m)`, color: "text-gray-400", dot: "bg-gray-400" };
                const diffHours = Math.floor(diffMins / 60);
                if (diffHours < 24) return { text: `Offline (${diffHours}h)`, color: "text-gray-400", dot: "bg-gray-400" };
                return { text: `Offline (${Math.floor(diffHours/24)}d)`, color: "text-gray-400", dot: "bg-gray-400" };
            }
            return { text: "Offline", color: "text-gray-400", dot: "bg-gray-400" };
        }
    }

        }
    }

    function openProfileModal() { $('profileModal').classList.remove('hidden'); }
    function updateOnlineCount() {
        let count = 1; 
        Object.keys(globalUserProfiles).forEach(u => { if(u !== userName && globalUserProfiles[u].isOnline) count++; });
        if ($('onlineCount')) $('onlineCount').innerText = count;
    }
    
    function openSeenByModal(readersStr) {
        const readers = JSON.parse(decodeURIComponent(readersStr)); const list = $('seenByList'); list.innerHTML = '';
        readers.forEach(r => {
            const div = document.createElement('div'); div.className = "flex items-center p-2.5 bg-gray-50 rounded-xl space-x-3 border border-gray-100";
            const picSrc = r.picUrl ? `<img src="${r.picUrl}" class="w-10 h-10 rounded-full object-cover border border-gray-200 cursor-pointer hover:scale-105 transition-transform" onclick="openLightbox('${r.picUrl}')">` : `<div class="w-10 h-10 rounded-full bg-gray-200 border border-gray-200 flex items-center justify-center"><i class="ph-fill ph-user text-xl text-gray-400"></i></div>`;
            div.innerHTML = `${picSrc}<span class="text-sm font-bold text-gray-700">${r.name}</span>`; list.appendChild(div);
        });
        $('seenByModal').classList.remove('hidden');
    }
    function closeSeenByModal() { $('seenByModal').classList.add('hidden'); }

    function refreshOnlineModalSilent() {
        const list = $('onlineUsersList'); list.innerHTML = '';
        let currentUserLogin = 0; if (globalUserProfiles[userName]) currentUserLogin = globalUserProfiles[userName].lastLogin;
        let allUsers = [{name: userName, pic: userPicUrl, color: userColor, isOnline: true, isCurrentUser: true, lastLogin: currentUserLogin}];
        Object.keys(globalUserProfiles).forEach(u => {
            if(u !== userName) allUsers.push({ name: u, pic: globalUserProfiles[u].picUrl, color: globalUserProfiles[u].color, isOnline: globalUserProfiles[u].isOnline, lastActive: globalUserProfiles[u].lastActive, lastLogin: globalUserProfiles[u].lastLogin });
        });
        allUsers.sort((a, b) => { if (a.isOnline === b.isOnline) return (b.lastActive || 0) - (a.lastActive || 0); return a.isOnline ? -1 : 1; });
        allUsers.forEach(u => {
            const status = getUserStatus(u); const div = document.createElement('div'); div.className = "flex items-center p-2.5 bg-gray-50 rounded-xl space-x-3 border border-gray-100";
            const picSrc = u.pic ? `<img src="${u.pic}" class="w-10 h-10 rounded-full object-cover border border-gray-200 cursor-pointer hover:scale-105 transition-transform" onclick="openLightbox('${u.pic}')">` : `<div class="w-10 h-10 rounded-full bg-gray-200 border border-gray-200 flex items-center justify-center"><i class="ph-fill ph-user text-xl text-gray-400"></i></div>`;
            div.innerHTML = `${picSrc} <div class="flex flex-col flex-1"><span class="text-sm font-bold text-gray-700">${u.name} ${u.isCurrentUser ? '<span class="text-pink-500">(Ikaw)</span>' : ''}</span><span class="text-[10px] font-bold ${status.color}">${status.text}</span></div><span class="w-2.5 h-2.5 ${status.dot} rounded-full ml-auto shadow-sm"></span>`;
            list.appendChild(div);
        });
    }
    
    async function forceRefreshOnline() {
        const btn = $('refreshStatusBtn');
        if (btn) { const icon = btn.querySelector('i'); if (icon) icon.classList.add('animate-spin'); btn.classList.add('opacity-50'); }
        await fetchMessages(true); refreshOnlineModalSilent();
        if (btn) { const icon = btn.querySelector('i'); if (icon) icon.classList.remove('animate-spin'); btn.classList.remove('opacity-50'); }
    }
    function openOnlineModal() { refreshOnlineModalSilent(); $('onlineModal').classList.remove('hidden'); forceRefreshOnline(); }
    function closeOnlineModal() { $('onlineModal').classList.add('hidden'); }

    function renderMessagesHTML(isLazyLoad = false, oldScrollHeight = 0, forceBottom = false) {
      const c = $('messagesContainer'); const prevScroll = c.scrollTop;
      const visibleMsgs = fetchedMessages.slice(-displayLimit);
      
      let seenMap = {};
      Object.keys(globalUserProfiles).forEach(uName => {
          if (uName === userName) return;
          let uData = globalUserProfiles[uName]; let effectiveLastActive = uData.isOnline ? Date.now() : (uData.lastActive || 0);
          let lastSeenMsg = null;
          for (let i = visibleMsgs.length - 1; i >= 0; i--) {
              let msg = visibleMsgs[i];
              if (msg.content !== '🗑️ Deleted' && msg.status !== 'sending' && msg.time <= effectiveLastActive) { lastSeenMsg = msg; break; }
          }
          if (lastSeenMsg && lastSeenMsg.name !== uName) {
              if (!seenMap[lastSeenMsg.time]) seenMap[lastSeenMsg.time] = [];
              seenMap[lastSeenMsg.time].push({ name: uName, picUrl: uData.picUrl });
          }
      });

      let groups = [];
      visibleMsgs.forEach(msg => {
          if (groups.length > 0 && groups[groups.length - 1].name === msg.name) groups[groups.length - 1].msgs.push(msg);
          else groups.push({ name: msg.name, isMe: msg.name === userName, msgs: [msg] });
      });

      let html = '';
      groups.forEach(group => {
          const align = group.isMe ? 'items-end' : 'items-start';
          html += `<div class="flex flex-col w-full ${align} mb-4">`;
          
          let profileObj = group.isMe ? { color: userColor, picUrl: userPicUrl } : (globalUserProfiles[group.name] || { color: 'pink', picUrl: '' });
          let themeToUse = group.isMe ? (THEMES[userColor] || THEMES['pink']) : (THEMES[profileObj.color] || OTHER_THEME);

          if (!group.isMe) {
              const picSrc = profileObj.picUrl ? `<img src="${profileObj.picUrl}" class="profile-pic-chat w-7 h-7 rounded-full object-cover mr-2 border border-gray-200 shadow-sm cursor-pointer" onclick="openLightbox('${profileObj.picUrl}')">` : `<div class="profile-pic-chat w-7 h-7 rounded-full bg-gray-200 border border-gray-200 flex items-center justify-center mr-2 shadow-sm"><i class="ph-fill ph-user text-xs text-gray-400"></i></div>`;
              html += `<div class="flex items-center mb-1 ml-1">${picSrc} <span class="block text-[13px] font-black uppercase tracking-wider drop-shadow-sm ${themeToUse.textCol}">${group.name}</span></div>`;
          } else {
              const myPicSrc = userPicUrl ? `<img src="${userPicUrl}" class="profile-pic-chat w-7 h-7 rounded-full object-cover ml-2 border border-gray-200 shadow-sm cursor-pointer" onclick="openLightbox('${userPicUrl}')">` : `<div class="profile-pic-chat w-7 h-7 rounded-full bg-gray-200 border border-gray-200 flex items-center justify-center ml-2 shadow-sm"><i class="ph-fill ph-user text-xs text-gray-400"></i></div>`;
              html += `<div class="flex items-center mb-1 mr-1 justify-end"><span class="block text-[13px] font-black uppercase tracking-wider drop-shadow-sm ${themeToUse.textCol}">${userName}</span>${myPicSrc}</div>`;
          }

          html += `<div class="flex flex-col gap-1.5 p-2 sm:p-3 rounded-3xl ${themeToUse.outer} max-w-[95%] sm:max-w-[85%] border shadow-sm">`;

          group.msgs.forEach((msg, idx) => {
              let contentHtml = ''; const isDeleted = msg.content === '🗑️ Deleted';
              
              let rawContentForReply = msg.content;
              if (msg.type === 'image') rawContentForReply = "📸 Nagpadala ng larawan";
              else if (msg.type === 'video') rawContentForReply = "🎥 Nagpadala ng video";
              else if (msg.type === 'audio') rawContentForReply = "🎵 Nagpadala ng audio";
              else if (msg.type === 'file') rawContentForReply = "📁 Nagpadala ng file";
              const safeTxt = String(rawContentForReply).replace(/'/g, "\\'").replace(/"/g, "&quot;");

              if (isDeleted) { 
                  contentHtml = `<div class="italic text-gray-500 font-bold text-sm flex items-center bg-white/50 p-1.5 px-3 rounded-xl"><i class="ph-bold ph-trash mr-1.5 text-base"></i> Ang mensaheng ito ay binura.</div>`; 
              
              } else if (msg.type === 'image') { 
                  if (msg.imageIds) {
                      const ids = msg.imageIds.split('|').filter(id => id);
                      let imgGrid = `<div class="grid ${ids.length > 1 ? 'grid-cols-2 gap-1.5' : 'grid-cols-1'}">`;
                      ids.forEach(id => {
                          const thumbUrl = `https://drive.google.com/thumbnail?id=${id}&sz=s800`;
                          const fullUrl = `https://drive.google.com/thumbnail?id=${id}&sz=s2000`; 
                          
                          imgGrid += `<img src="${thumbUrl}" class="chat-image rounded-xl w-full h-auto cursor-pointer shadow-sm border border-white/20 object-cover" style="min-height:100px; max-height: 250px;" onclick="openLightbox('${fullUrl}')">`;
                      });
                      imgGrid += '</div>';
                      contentHtml = imgGrid;
                  } else {
                      contentHtml = `<img src="${msg.content}" class="chat-image rounded-xl w-full h-auto cursor-pointer shadow-sm border border-white/20 object-cover" style="min-width:200px;" onclick="openLightbox('${msg.content}')">`;
                  }
              }
              else if (msg.type === 'video') contentHtml = `<div class="rounded-xl overflow-hidden bg-black/20 shadow-sm w-full max-w-[200px] sm:max-w-[250px] border border-white/20"><video controls class="w-full h-auto" onplay="autoScrollEnabled=false" onpause="autoScrollEnabled=true"><source src="${msg.content.replace('view','download')}"></video></div>`;
              else if (msg.type === 'audio') contentHtml = `<div class="bg-white/20 p-2 rounded-xl border border-white/30 w-full max-w-[200px] sm:max-w-[250px]"><div class="flex items-center mb-1 px-1 text-[10px] font-bold uppercase"><i class="ph-fill ph-music-notes mr-1"></i> Audio</div><audio controls class="w-full h-8" src="${msg.content}"></audio></div>`;
              else if (msg.type === 'file') contentHtml = `<a href="${msg.content}" target="_blank" class="flex items-center space-x-2 bg-white/20 p-2 rounded-xl hover:bg-white/30 w-fit"><i class="ph-bold ph-file-zip text-2xl"></i><span class="font-bold text-xs underline">Download</span></a>`;
              else { 
                  let txt = String(msg.content || "").replace(/</g, "&lt;").replace(/>/g, "&gt;"); 
                  if (txt.includes("[Reply kay")) { txt = txt.replace(/\[Reply kay (.*?): "(.*?)"\]\n?/g, `<div class="bg-black/10 p-2 rounded-xl text-[11px] font-bold mb-2 opacity-80 border-l-4 border-white flex flex-col"><span class="text-[9px] uppercase tracking-wider opacity-70 mb-0.5 flex items-center"><i class="ph-fill ph-reply mr-1"></i> Nag-reply kay $1</span><span class="truncate">$2</span></div>`); }
                  ALL_UNIQUE_EMOJIS.forEach(emoji => {
                      if (txt.includes(emoji)) { txt = txt.split(emoji).join(`<img src="${getAnimatedEmojiUrl(emoji)}" class="inline-block w-7 h-7 align-middle mx-0.5 drop-shadow-sm select-none" alt="${emoji}" onerror="this.outerHTML='<span class=\\'text-2xl align-middle mx-0.5\\'>${emoji}</span>'">`); }
                  });
                  contentHtml = `<div class="whitespace-pre-wrap break-words font-medium text-sm sm:text-[15px] leading-snug">${txt}</div>`; 
              }

              let reactHtml = '';
              if (!isDeleted && msg.reactions && Object.keys(msg.reactions).length > 0) {
                  reactHtml = `<div class="flex flex-wrap gap-1.5 mt-1 -mb-2 relative z-10 ${group.isMe ? 'justify-end pr-2' : 'justify-start pl-2'}">`;
                  for (const [emoji, users] of Object.entries(msg.reactions)) {
                      const iReact = users.includes(userName), safeReactsStr = encodeURIComponent(JSON.stringify(msg.reactions));
                      const badgeClass = iReact ? (group.isMe ? 'bg-white/40 border-white text-white' : 'bg-pink-100 border-pink-300 text-pink-600') : (group.isMe ? 'bg-white/10 border-white/30 text-white' : 'bg-gray-50 border-gray-200 text-gray-500');
                      reactHtml += `<button onclick="showReactionDetails('${safeReactsStr}', '${msg.time}')" class="reaction-badge ${badgeClass} px-2 py-1 rounded-full text-xs font-bold flex items-center shadow-sm hover:scale-110 active:scale-95 transition-transform"><img src="${getAnimatedEmojiUrl(emoji)}" class="w-5 h-5 mr-1 drop-shadow-sm select-none" alt="${emoji}"><span class="text-xs font-black">${users.length}</span></button>`;
                  }
                  reactHtml += `</div>`;
              }

              const innerAlign = group.isMe ? 'self-end' : 'self-start';
              
              let seenHtml = ''; let readers = seenMap[msg.time];
              if (readers && readers.length > 0) {
                  let safeReadersStr = encodeURIComponent(JSON.stringify(readers));
                  seenHtml = `<div class="flex ${group.isMe ? 'justify-end' : 'justify-start'} w-full mt-0.5 px-1"><div onclick="openSeenByModal('${safeReadersStr}')" class="flex items-center -space-x-1.5 opacity-90 hover:opacity-100 transition-opacity cursor-pointer">`;
                  let displayReaders = readers.slice(0, 5); let extraCount = readers.length - 5;
                  if (extraCount > 0) seenHtml += `<div class="w-3.5 h-3.5 rounded-full bg-gray-100 border border-white flex items-center justify-center text-[6px] font-black text-gray-600 shadow-sm z-0">+${extraCount}</div>`;
                  displayReaders.forEach((r, i) => { 
                      let zIndex = 10 - i; 
                      let pSrc = r.picUrl ? `<img src="${r.picUrl}" class="w-3.5 h-3.5 rounded-full object-cover border border-white shadow-sm" style="z-index: ${zIndex}">` : `<div class="w-3.5 h-3.5 rounded-full bg-gray-300 border border-white flex items-center justify-center shadow-sm" style="z-index: ${zIndex}"><i class="ph-fill ph-user text-[7px] text-white"></i></div>`;
                      seenHtml += pSrc;
                  });
                  seenHtml += `</div></div>`;
              }

              html += `
                <div class="relative group flex flex-col ${innerAlign} max-w-full swipeable-message" data-name="${group.name}" data-content="${safeTxt}">
                  <div class="px-3 py-2 rounded-2xl ${isDeleted ? 'bg-transparent border border-white/20' : themeToUse.inner} flex flex-col relative z-10">${contentHtml}</div>
                  <div class="flex justify-between items-end mt-0.5 mb-0.5 px-1 relative z-0">
                      ${reactHtml}
                      <div class="text-[9px] font-bold tracking-tighter ${themeToUse.textCol} ml-auto mt-0.5 opacity-70 flex items-center">
                          ${new Date(msg.time).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}
                          ${group.isMe ? (msg.status === 'sending' ? '<i class="ph-bold ph-spinner animate-spin text-[10px] ml-1 opacity-70"></i>' : '<i class="ph-bold ph-check-circle text-[10px] text-green-500 ml-1"></i>') : ''}
                      </div>
                  </div>
                  ${seenHtml}
                  ${!isDeleted ? `<div class="absolute -top-2.5 ${group.isMe ? '-left-6' : '-right-6'} hidden group-hover:flex space-x-1 z-20"><button onclick="openReact('${msg.time}')" class="w-7 h-7 rounded-full flex bg-white shadow-sm border border-gray-100 text-pink-500 hover:scale-110 transition items-center justify-center"><i class="ph-bold ph-heart text-sm"></i></button><button onclick="replyTo('${group.name}', '${safeTxt}')" class="w-7 h-7 rounded-full flex bg-white shadow-sm border border-gray-100 text-blue-500 hover:scale-110 transition items-center justify-center"><i class="ph-bold ph-arrow-u-up-left text-sm"></i></button>${group.isMe && msg.type === 'text' ? `<button onclick="copyToEdit('${safeTxt}', '${msg.time}')" class="w-7 h-7 rounded-full flex bg-white shadow-sm border border-gray-100 text-green-500 hover:scale-110 transition items-center justify-center"><i class="ph-bold ph-pencil-simple text-sm"></i></button>` : ''}${group.isMe ? `<button onclick="deleteMessage('${msg.time}')" class="w-7 h-7 rounded-full flex bg-white shadow-sm border border-gray-100 text-red-500 hover:scale-110 transition items-center justify-center"><i class="ph-bold ph-trash text-sm"></i></button>` : ''}</div>` : ''}
                </div>
              `;
          });
          html += `</div></div>`; 
      });

      c.innerHTML = html;
      if (isLazyLoad) c.scrollTop = c.scrollHeight - oldScrollHeight;
      else if (forceBottom || autoScrollEnabled) setTimeout(() => { c.scrollTop = c.scrollHeight; }, 50);
      else c.scrollTop = prevScroll;
    }

    function openReact(t) { selectedMsgTime = Number(t); $('reactionPopup').classList.remove('hidden'); }
    function closeReact() { $('reactionPopup').classList.add('hidden'); }
    function toggleEmojis() { $('emojiPicker').classList.toggle('hidden'); }
    
    function copyToEdit(txt, time) { 
        cancelReply(); editingMsgTime = Number(time); $('messageInput').value = txt.replace(/\[Reply kay .*?\]\n/, ''); 
        $('messageInput').dispatchEvent(new Event('input')); $('messageInput').focus(); $('editingIndicator').classList.remove('hidden'); $('messageInput').classList.add('ring-2', 'ring-yellow-400', 'bg-yellow-50');
    }
    function cancelEdit() { 
        editingMsgTime = null; $('messageInput').value = ''; $('messageInput').dispatchEvent(new Event('input')); 
        $('editingIndicator').classList.add('hidden'); $('messageInput').classList.remove('ring-2', 'ring-yellow-400', 'bg-yellow-50'); 
    }
    function replyTo(n, txt) { 
        cancelEdit(); replyingToData = { name: n, content: txt.length > 50 ? txt.substring(0, 50) + "..." : txt };
        $('replyPreviewName').innerText = n; $('replyPreviewText').innerText = replyingToData.content;
        $('replyingIndicator').classList.remove('hidden'); $('messageInput').focus(); 
    }
    function cancelReply() { replyingToData = null; $('replyingIndicator').classList.add('hidden'); }

    function showReactionDetails(rStr, msgTime) {
      const reacts = JSON.parse(decodeURIComponent(rStr)), list = $('reactionDetailsList'); list.innerHTML = '';
      for (const [emoji, users] of Object.entries(reacts)) {
          const div = document.createElement('div'); div.className = "bg-gray-50 p-4 rounded-xl flex items-center space-x-4";
          div.innerHTML = `<img src="${getAnimatedEmojiUrl(emoji)}" class="w-12 h-12 drop-shadow-md select-none" alt="${emoji}"><div class="flex-1"><span class="text-xs font-bold text-gray-700">${users.join(', ')}</span></div>`;
          list.appendChild(div);
      }
      const btn = document.createElement('button'); btn.className = "w-full mt-3 bg-pink-100 text-pink-500 font-bold py-3 rounded-xl hover:bg-pink-200 transition shadow-sm";
      btn.innerHTML = "<i class='ph-bold ph-heart mr-1'></i> Mag-React din"; btn.onclick = () => { closeReactionDetails(); openReact(msgTime); };
      list.appendChild(btn); $('reactionDetailsModal').classList.remove('hidden');
    }
    function closeReactionDetails() { $('reactionDetailsModal').classList.add('hidden'); }

    async function toggleRecording() {
      const btn = $('micBtn');
      if (!isRecording) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true }); mediaRecorder = new MediaRecorder(stream); audioChunks = [];
          mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
          mediaRecorder.onstop = () => {
            const mime = mediaRecorder.mimeType || 'audio/webm'; const ext = mime.includes('mp4') ? 'mp4' : (mime.includes('ogg') ? 'ogg' : 'webm');
            const blob = new Blob(audioChunks, { type: mime }); const r = new FileReader(); 
            r.onload = e => executeChatUpload(e.target.result, 'audio'); r.readAsDataURL(blob);
            stream.getTracks().forEach(track => track.stop());
          };
          mediaRecorder.start(); isRecording = true; 
          btn.classList.replace('bg-gray-50','bg-red-500'); btn.classList.replace('text-gray-500','text-white'); btn.classList.add('animate-pulse');
        } catch(e) { alert("Mic required or not supported!"); }
      } else {
        mediaRecorder.stop(); isRecording = false; 
        btn.classList.replace('bg-red-500','bg-gray-50'); btn.classList.replace('text-white','text-gray-500'); btn.classList.remove('animate-pulse');
      }
    }

    function handleProfilePicUpload(e) {
      const file = e.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
          const img = new Image();
          img.onload = async () => {
              const canvas = document.createElement('canvas'); const MAX_SIZE = 400;
              let width = img.width, height = img.height;
              if (width > height) { if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; } } 
              else { if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; } }
              canvas.width = width; canvas.height = height; canvas.getContext('2d').drawImage(img, 0, 0, width, height);
              const b64 = canvas.toDataURL('image/jpeg', 0.8);
              $('picUploadProgress').classList.remove('hidden'); $('picUploadBar').style.width = '50%';
              
              if(globalUserProfiles[userName] && globalUserProfiles[userName].rowIndex) {
                  try {
                      const token = await GoogleSheetsAPI.getAuthToken();
                      await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${API_CONFIG.SPREADSHEET_ID}/values/${SHEET_PROFS}!C${globalUserProfiles[userName].rowIndex}?valueInputOption=USER_ENTERED`, {
                          method: 'PUT', headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
                          body: JSON.stringify({ values: [[b64]] })
                      });
                      userPicUrl = b64; localStorage.setItem('myProfilePic', userPicUrl); updateHeaderProfile();
                  } catch(e) {}
              }
              $('picUploadBar').style.width = '100%';
              setTimeout(() => { $('picUploadProgress').classList.add('hidden'); $('profileModal').classList.add('hidden'); }, 1000);
          };
          img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }

    init();
  </script>
