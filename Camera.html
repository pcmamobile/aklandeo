<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USB Phone Camera Viewer</title>
    <style>
        :root {
            --bg-color: #f3f4f6;
            --text-color: #1f2937;
            --card-bg: #ffffff;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --danger: #ef4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 24px;
            text-align: center;
        }

        .controls {
            display: flex;
            gap: 10px;
            width: 100%;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        select {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #d1d5db;
            font-size: 16px;
            flex-grow: 1;
            max-width: 400px;
            outline: none;
        }

        select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
        }

        .video-container {
            width: 100%;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 16 / 9;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none; /* Hidden until stream starts */
        }

        .placeholder-text {
            color: #9ca3af;
            font-size: 18px;
            position: absolute;
        }

        #errorMessage {
            margin-top: 20px;
            padding: 15px;
            background-color: #fee2e2;
            color: #b91c1c;
            border-radius: 8px;
            width: 100%;
            text-align: center;
            display: none;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>USB Camera Viewer</h1>
        
        <div class="controls">
            <select id="cameraSelect">
                <option value="">Loading cameras...</option>
            </select>
            <button id="startBtn">Start Camera</button>
        </div>

        <div class="video-container">
            <div class="placeholder-text" id="placeholder">Camera is off</div>
            <video id="videoElement" autoplay playsinline></video>
        </div>

        <div id="errorMessage"></div>
    </div>

    <script>
        const videoElement = document.getElementById('videoElement');
        const cameraSelect = document.getElementById('cameraSelect');
        const startBtn = document.getElementById('startBtn');
        const errorMessage = document.getElementById('errorMessage');
        const placeholder = document.getElementById('placeholder');
        
        let currentStream = null;

        // Function to show errors in the UI instead of annoying alerts
        function showError(msg) {
            errorMessage.textContent = msg;
            errorMessage.style.display = 'block';
            setTimeout(() => { errorMessage.style.display = 'none'; }, 5000);
        }

        // Fetch all available cameras
        async function getCameras() {
            try {
                // We must ask for generic permission FIRST, otherwise the browser 
                // hides the actual names of the cameras for privacy reasons.
                await navigator.mediaDevices.getUserMedia({ video: true });
                
                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoDevices = devices.filter(device => device.kind === 'videoinput');

                cameraSelect.innerHTML = ''; // Clear loading text

                if (videoDevices.length === 0) {
                    cameraSelect.innerHTML = '<option value="">No cameras found</option>';
                    startBtn.disabled = true;
                    return;
                }

                // Add each camera to the dropdown
                videoDevices.forEach((device, index) => {
                    const option = document.createElement('option');
                    option.value = device.deviceId;
                    // If device has no label, give it a default name
                    option.text = device.label || `Camera ${index + 1}`;
                    cameraSelect.appendChild(option);
                });

            } catch (error) {
                console.error('Error fetching cameras:', error);
                cameraSelect.innerHTML = '<option value="">Permission denied</option>';
                showError('Camera permission is required to list devices.');
                startBtn.disabled = true;
            }
        }

        // Start the selected camera
        async function startCamera() {
            const selectedDeviceId = cameraSelect.value;
            
            if (!selectedDeviceId) {
                showError("Please select a camera first.");
                return;
            }

            // Stop any existing stream before starting a new one
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        deviceId: { exact: selectedDeviceId },
                        width: { ideal: 1920 }, // Try to get HD quality
                        height: { ideal: 1080 }
                    }
                });

                currentStream = stream;
                videoElement.srcObject = stream;
                
                // Show video, hide placeholder
                videoElement.style.display = 'block';
                placeholder.style.display = 'none';
                
                startBtn.textContent = "Restart Camera";

            } catch (error) {
                console.error('Error starting camera:', error);
                showError("Could not start this camera. It might be in use by another app.");
            }
        }

        // Event Listeners
        startBtn.addEventListener('click', startCamera);

        // Load cameras when the page loads
        window.addEventListener('load', getCameras);
    </script>
</body>
</html>
