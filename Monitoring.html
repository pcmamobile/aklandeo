        .btn-3d {
            background: #20202d;
            box-shadow: 6px 6px 12px #121219, -6px -6px 12px #2e2e41;
            border: 1px solid rgba(255,255,255,0.05);

            border-radius: 16px;

        .btn-3d:active {

            transform: scale(0.98);

        .btn-3d.active-tab {

            color: #00f3ff;

            border-radius: 12px;
            width: 42px;
            height: 42px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 800;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.1s;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        .td-clickable:active {
            transform: translateY(5px);
            box-shadow: 0 0px 0 #8a002f, 0 3px 5px rgba(0,0,0,0.5);
        }

        .sticky-col {
            position: sticky;
            left: 0;
            background: #20202d;
            z-index: 10;
            box-shadow: 4px 0 8px rgba(0,0,0,0.3);

        .modal-content-3d {

        class GoogleSheetsAPI {
            static _oauthToken = null;
            static _tokenExp = 0;

            static async getAuthToken() {
                if (this._oauthToken && this._tokenExp > Date.now()) return this._oauthToken;
                const header = { alg: "RS256", typ: "JWT" };
                const now = Math.floor(Date.now() / 1000);
                const claim = {
                    iss: API_CONFIG.SERVICE_ACCOUNT.client_email,
                    scope: "https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/drive",
                    aud: "https://oauth2.googleapis.com/token",
                    exp: now + 3600,
                    iat: now
                };

                const sHeader = JSON.stringify(header);
                const sClaim = JSON.stringify(claim);
                const sJWS = KJUR.jws.JWS.sign("RS256", sHeader, sClaim, API_CONFIG.SERVICE_ACCOUNT.private_key);

                const res = await fetch("https://oauth2.googleapis.com/token", {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: `grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer&assertion=${sJWS}`
                });
                
                const data = await res.json();
                if (data.access_token) {
                    this._oauthToken = data.access_token;
                    this._tokenExp = Date.now() + (data.expires_in * 1000) - 60000;
                    return data.access_token;
                } else {
                    throw new Error("Failed to get Google Token");
                }
            }
        }

        // Global State & Categories mapping
        window.appData = {
            'ALL': { PE: {}, PI: {}, RE: {}, QE: {} },
            'PLANNING': { PE: {}, PI: {}, RE: {}, QE: {} },
            'PROCUREMENT': { PE: {}, PI: {}, RE: {}, QE: {} },

            'COMPLETION': { PE: {}, PI: {}, RE: {}, QE: {} },
            'ACCEPTANCE': { PE: {}, PI: {}, RE: {}, QE: {} }
        };
        let currentRole = 'PE';
        let currentDocType = 'ALL'; 
        window.globalHeaders = [];
        window.globalContractSearch = [];

        document.addEventListener('DOMContentLoaded', () => {
            fetchData();
        });

        async function fetchData() {
            try {
                document.getElementById('loader-text').innerText = "Authenticating & Downloading Sheet Data...";
                const token = await GoogleSheetsAPI.getAuthToken();
                
                const response = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${API_CONFIG.SPREADSHEET_ID}/values/UPLOAD!A3:ZZ`, {
                    headers: { Authorization: `Bearer ${token}` }
                });
                
                if (!response.ok) throw new Error("Failed to fetch data from Google Sheets.");
                
                const data = await response.json();
                
                if (!data.values || data.values.length === 0) {
                    showError("Not enough data found in the spreadsheet (requires at least a header on Row 3).");
                    return;
                }

                const headersArray = data.values[0]; 
                window.globalHeaders = headersArray; 
                const rowsArray = [];

                for (let i = 1; i < data.values.length; i++) {
                    const rowVals = data.values[i];
                    while (rowVals.length < headersArray.length) {
                        rowVals.push('');
                    }
                    const isBlank = rowVals.every(v => String(v || "").trim() === "");
                    if (isBlank) continue;

                    rowsArray.push({
                        rowNumber: i + 3,
                        values: rowVals
                    });
                }

                processData(headersArray, rowsArray);
                
            } catch (error) {
                showError("Network Error: " + error.message);
                console.error(error);
            }
        }

        function showError(msg) {
            document.getElementById('loader-text').innerHTML = `<span class="text-red-400 font-bold"><i class="fa-solid fa-triangle-exclamation"></i> ${msg}</span>`;
            document.querySelector('.loading-pulse')?.classList.remove('loading-pulse');
            document.querySelector('.fa-cube')?.classList.replace('fa-cube', 'fa-skull-crossbones');
            document.querySelector('.fa-skull-crossbones')?.classList.add('text-red-500');
        }

        function processData(headersArray, rowsArray) {
            const headers = headersArray.map(h => (h || '').toString().trim().toUpperCase());
            
            const findCol = (aliases) => {
                let cleanAliases = aliases.map(a => a.trim().toUpperCase());
                let idx = headers.findIndex(h => cleanAliases.includes(h));
                if (idx !== -1) return idx;
                
                let noSpaceAliases = cleanAliases.map(a => a.replace(/\s+/g, ''));
                return headers.findIndex(h => noSpaceAliases.includes(h.replace(/\s+/g, '')));
            };

            const cols = {
                PE: findCol(['PE', 'PROJECT ENGINEER']),
                PI: findCol(['PI', 'PROJECT INSPECTOR']),
                RE: findCol(['RE', 'RESIDENT ENGINEER']),
                QE: findCol(['QE', 'QUANTITY ENGINEER', 'QUALITY ENGINEER']), 
                RE_QE: findCol(['RE & QE', 'RE/QE', 'RE / QE']), 
                YEAR: findCol(['YEAR']),
                CONTRACT: findCol(['CONTRACT ID', 'CONTRACT_ID', 'CONTRACT'])
            };

            window.rowCache = {}; 
            window.globalContractSearch = []; 

            const docCategories = {
                'PLANNING': ['POW', 'DUPA', 'QUANTITY CALCULATION', 'ORIGINAL PLAN'],
                'PROCUREMENT': ['BOQ', 'DETAILED ESTIMATE', 'NOTICE OF AWARD', 'CONTRACT AGREEMENT'],
                'CONSTRUCTION': [
                    'NTP', 'PDM', 'BAR-CHART', 'PRE-CON NOTICE & MINUTES OF MEETING', 'SI', 'AS-STAKED PLAN', 'REVISED PLAN',
                    ...Array.from({length: 5}, (_, i) => `VO${i+1}`),
                    ...Array.from({length: 4}, (_, i) => `WSO${i+1}`),
                    ...Array.from({length: 4}, (_, i) => `CWSO${i+1}`),
                    ...Array.from({length: 4}, (_, i) => `WRO${i+1}`),
                    ...Array.from({length: 20}, (_, i) => `CTE${i+1}`),
                    'DO 193, SERIES OF 2016', 'OTHER RELATED DOCUMENT'
                ],
                'PCMA': ['ACTUAL', 'PCMA', 'REMARKS', 'UPDATE VARIATION ORDER', 'UPDATE SUSPENSION ORDER', 'UPDATE RESUMPTION ORDER', "UPDATE CTE'S"],
                'GEOTAGGING': ['GEOTAGGED MOB', 'GEOTAGGED ON-GOING', 'GEOTAGGED COMPLETED'],
                'PCMAMOBILE': ['MOBILIZATION', 'ON-GOING', 'COMPLETED'],
                'COMPLETION': ['AS-BUILT PLAN', '95% PUNCHLIST', 'FCIR', 'COC', 'TURN-OVER'],
                'ACCEPTANCE': ['PUNCHLIST AFTER 1 YEAR DEFECTS LIABILITY', 'RECTIFICATION', 'NOTIFICATION LETTER', 'FAIR', 'CERTIFICATE OF ACCEPTANCE', 'WARRANTY BOND']
            };

            const docsToTrack = [];
            
            Object.keys(docCategories).forEach(cat => {
                docCategories[cat].forEach(docName => {
                    const docVariants = [
                        docName, 
                        docName.replace(/-/g, ''), 
                        docName.replace('PUNCHLIST', 'PUNCH LIST'),
                        docName.replace('PUNCH LIST', 'PUNCHLIST')
                    ];
                    const upVariants = [
                        `${docName} UPLOADED`, 
                        `${docName} UP`, 
                        `${docName.replace('PUNCHLIST', 'PUNCH LIST')} UPLOADED`,
                        `${docName.replace('PUNCHLIST', 'PUNCH LIST')} UP`
                    ];
                    
                    docsToTrack.push({
                        type: cat,
                        name: docName,
                        doc: findCol(docVariants),
                        up: findCol(upVariants)
                    });
                });
            });

            const yearsTracked = ['2023', '2024', '2025', '2026'];

            for(let i = 0; i < rowsArray.length; i++) {
                const rowObj = rowsArray[i];
                const row = rowObj.values;
                const rowNumber = rowObj.rowNumber;

                if(cols.YEAR === -1 || !row[cols.YEAR]) continue;

                let rowYear = (row[cols.YEAR] || '').toString().trim();
                if(!yearsTracked.includes(rowYear)) continue;

                let missingDocsMap = {
                    'ALL': [], 'PLANNING': [], 'PROCUREMENT': [], 'CONSTRUCTION': [],
                    'PCMA': [], 'GEOTAGGING': [], 'PCMAMOBILE': [], 'COMPLETION': [], 'ACCEPTANCE': []
                };
                let statsMap = {
                    'ALL':          { total: 0, uploaded: 0 },
                    'PLANNING':     { total: 0, uploaded: 0 },
                    'PROCUREMENT':  { total: 0, uploaded: 0 },
                    'CONSTRUCTION': { total: 0, uploaded: 0 },
                    'PCMA':         { total: 0, uploaded: 0 },
                    'GEOTAGGING':   { total: 0, uploaded: 0 },
                    'PCMAMOBILE':   { total: 0, uploaded: 0 },
                    'COMPLETION':   { total: 0, uploaded: 0 },
                    'ACCEPTANCE':   { total: 0, uploaded: 0 }
                };
                
                docsToTrack.forEach(v => {
                    if(v.doc !== -1) {
                        let hasDoc = row[v.doc] && row[v.doc].toString().trim() !== '';
                        let isUploaded = v.up !== -1 && row[v.up] && row[v.up].toString().trim() !== '';
                        if(hasDoc) {
                            statsMap[v.type].total++;
                            statsMap['ALL'].total++;
                            if(isUploaded) {
                                statsMap[v.type].uploaded++;
                                statsMap['ALL'].uploaded++;
                            } else {
                                missingDocsMap[v.type].push(v.name);
                                missingDocsMap['ALL'].push(v.name);
                            }
                        }
                    }
                });

                const contractId = cols.CONTRACT !== -1 && row[cols.CONTRACT] ? row[cols.CONTRACT].toString().trim() : 'Unknown';

                window.rowCache[rowNumber] = {
                    contractId: contractId,
                    pcmaData: []
                };

                let missingSum = 0;
                Object.keys(missingDocsMap).forEach(k => {
                    if(k !== 'ALL') missingSum += missingDocsMap[k].length;
                });
                
                if (missingSum > 0 && contractId !== 'Unknown') {
                    window.globalContractSearch.push({
                        contractId: contractId,
                        rowNumber: rowNumber,
                        year: rowYear,
                        missing: missingDocsMap
                    });
                }

                const assignToRole = (roleKey, rawNames) => {
                    if(!rawNames || typeof rawNames !== 'string' || rawNames.trim() === '') return;
                    const names = rawNames.split(/\s+and\s+|[\/&,]/i).map(n => n.trim()).filter(n => n !== '');
                    const uniqueNames = [...new Set(names)];
                    
                    uniqueNames.forEach(name => {
                        Object.keys(statsMap).forEach(catType => {
                            if(!window.appData[catType][roleKey][name]) {
                                window.appData[catType][roleKey][name] = { 
                                    '2023':[], '2024':[], '2025':[], '2026':[], 
                                    totalDocs: 0, uploadedDocs: 0 
                                };
                            }
                            
                            window.appData[catType][roleKey][name].totalDocs += statsMap[catType].total;
                            window.appData[catType][roleKey][name].uploadedDocs += statsMap[catType].uploaded;
                            
                            if(missingDocsMap[catType].length > 0) {
                                window.appData[catType][roleKey][name][rowYear].push({ 
                                    contractId: contractId, 
                                    rowNumber: rowNumber,
                                    missingDocs: missingDocsMap[catType] 
                                });
                            }
                        });
                    });
                };

                if(cols.PE !== -1) assignToRole('PE', row[cols.PE]);
                if(cols.PI !== -1) assignToRole('PI', row[cols.PI]);
                if(cols.RE !== -1) assignToRole('RE', row[cols.RE]);
                if(cols.QE !== -1) assignToRole('QE', row[cols.QE]);
                
                if(cols.RE_QE !== -1) {
                    assignToRole('RE', row[cols.RE_QE]);
                    assignToRole('QE', row[cols.RE_QE]);
                }
            }

            document.getElementById('loader').classList.add('hidden');
            renderTable();
        }

            // Scenario 1: PCMA Mobile
            if (['MOBILIZATION', 'ON-GOING', 'COMPLETED'].includes(docUp)) {
                modalTitle.innerHTML = `<i class="fa-solid fa-mobile-screen-button text-neon-blue"></i> PCMA Mobile Upload`;
                modalBody.innerHTML = `
                    <div class="text-center text-gray-300 py-6">
                        <i class="fa-solid fa-arrow-up-right-from-square text-5xl text-neon-pink mb-4 block"></i>
                        <p class="text-xl font-bold mb-2 text-white">Upload your Photos in the PCMA Mobile</p>
                        <p class="text-sm text-gray-500 mb-8">pcmamobile.github.io/aklandeo</p>
                        <a href="https://pcmamobile.github.io/aklandeo" target="_blank" onclick="closeUploadModal()" class="inline-block w-full py-4 rounded-xl font-black bg-neon-blue text-black hover:bg-[#00d0e0] shadow-[0_0_15px_rgba(0,243,255,0.4)] transition-colors">
                            Open PCMA Mobile
                        </a>
                    </div>
                `;
                modalFooter.innerHTML = `<button onclick="closeUploadModal()" class="w-full py-3 rounded-xl font-bold text-gray-400 hover:text-white transition-colors border border-gray-700">Close Panel</button>`;
            }
            // Scenario 2: Survey123
            else if (['GEOTAGGED MOB', 'GEOTAGGED ON-GOING', 'GEOTAGGED COMPLETED'].includes(docUp)) {
                modalTitle.innerHTML = `<i class="fa-solid fa-map-location-dot text-neon-green"></i> Survey123 Upload`;
                modalBody.innerHTML = `
                    <div class="text-center text-gray-300 py-6">
                        <i class="fa-solid fa-satellite-dish text-5xl text-neon-green mb-4 block"></i>
                        <p class="text-xl font-bold mb-4 text-white">Upload your Photos in Survey123 App</p>
                        <div class="bg-[#20202d] p-4 rounded-xl border border-gray-700 text-sm text-gray-400 mt-4 leading-relaxed">
                            Update <strong class="text-neon-orange font-black">Engr. Carl Joseph Oquendo</strong> to record your uploaded Geotagged Photos.
                        </div>
                    </div>
                `;
                modalFooter.innerHTML = `<button onclick="closeUploadModal()" class="w-full py-3 rounded-xl font-bold text-gray-400 hover:text-white transition-colors border border-gray-700">Acknowledge</button>`;
            }
            // Scenario 3: PCMA Update
            else if (['ACTUAL', 'PCMA', 'REMARKS', 'UPDATE VARIATION ORDER', 'UPDATE SUSPENSION ORDER', 'UPDATE RESUMPTION ORDER', "UPDATE CTE'S"].includes(docUp)) {
                modalTitle.innerHTML = `<i class="fa-solid fa-chart-line text-neon-orange"></i> Update PCMA`;
                modalBody.innerHTML = `
                    <div class="text-center text-gray-300 py-6">
                        <i class="fa-solid fa-chart-pie text-5xl text-neon-orange mb-4 block"></i>
                        <p class="text-xl font-bold mb-4 text-white">Update PCMA Accomplishment</p>
                        <div class="bg-[#20202d] p-4 rounded-xl border border-gray-700 text-sm text-gray-400 mt-4 leading-relaxed">
                            Update your Actual and PCMA Accomplishment and Give it to <strong class="text-neon-orange font-black">Roxanne or Jade</strong> to encode in the Dashboard.
                        </div>
                    </div>
                `;
                modalFooter.innerHTML = `<button onclick="closeUploadModal()" class="w-full py-3 rounded-xl font-bold text-gray-400 hover:text-white transition-colors border border-gray-700">Acknowledge</button>`;
            }
            // Scenario 4: Standard File Upload
            else {
                modalTitle.innerHTML = `<i class="fa-solid fa-cloud-arrow-up text-neon-blue"></i> Upload Document`;
                modalBody.innerHTML = `
                    <div class="bg-[#20202d] p-4 rounded-xl border border-gray-700 mb-4">
                        <div class="text-xs text-gray-400 uppercase tracking-wide mb-1">Contract ID</div>
                        <div class="text-xl font-black text-neon-blue" id="up-contract">${contractId}</div>
                    </div>
                    <div class="bg-[#20202d] p-4 rounded-xl border border-gray-700 mb-4">
                        <div class="text-xs text-gray-400 uppercase tracking-wide mb-1">File Required</div>
                        <div class="text-xl font-black text-neon-orange" id="up-doc">${docName}</div>
                    </div>
                    
                    <div class="mb-4">
                        <label class="text-xs text-gray-400 uppercase tracking-wide mb-1 block">Uploader Name</label>
                        <input type="text" id="up-name" placeholder="Enter your name" class="w-full bg-[#121219] border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-neon-blue transition-colors">
                    </div>
                    
                    <div>
                        <label class="text-xs text-gray-400 uppercase tracking-wide mb-1 block">Select File (PDF, Image, etc)</label>
                        <input type="file" id="up-file" class="w-full bg-[#121219] border border-gray-700 rounded-lg p-3 text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-bold file:bg-neon-blue file:text-black hover:file:bg-[#00d0e0] transition-colors cursor-pointer">
                    </div>

                    <div id="up-status" class="hidden mt-4 rounded-lg p-3 text-sm font-bold border"></div>
                `;
                modalFooter.innerHTML = `
                    <button onclick="closeUploadModal()" class="flex-1 py-3 rounded-xl font-bold text-gray-400 hover:text-white transition-colors border border-gray-700" id="btn-cancel-upload">Cancel</button>
                    <button onclick="executeUpload()" class="flex-1 py-3 rounded-xl font-bold bg-neon-blue text-black hover:bg-[#00d0e0] shadow-[0_0_15px_rgba(0,243,255,0.4)] transition-colors flex items-center justify-center gap-2" id="btn-execute-upload">
                        <i class="fa-solid fa-upload"></i> Upload to Drive
                    </button>
                `;
            }

            document.getElementById('upload-modal').classList.remove('hidden');
            document.getElementById('upload-modal').classList.add('flex');
            setTimeout(() => { 
                document.getElementById('upload-modal-box').classList.remove('scale-95'); 
                document.getElementById('upload-modal-box').classList.add('scale-100'); 
            }, 10);
        }

        function closeUploadModal() {
            document.getElementById('upload-modal-box').classList.remove('scale-100');
            document.getElementById('upload-modal-box').classList.add('scale-95');
            setTimeout(() => { 
                document.getElementById('upload-modal').classList.add('hidden'); 
                document.getElementById('upload-modal').classList.remove('flex'); 
            }, 200);
        }

        function setUploadStatus(msg, type) {
            const el = document.getElementById('up-status');
            el.classList.remove('hidden', 'text-neon-blue', 'border-neon-blue', 'text-neon-green', 'border-neon-green', 'text-neon-pink', 'border-neon-pink', 'bg-[#00f3ff]/10', 'bg-[#00ff88]/10', 'bg-[#ff0055]/10');
            if(type === 'loading') el.classList.add('text-neon-blue', 'border-neon-blue', 'bg-[#00f3ff]/10');
            else if(type === 'success') el.classList.add('text-neon-green', 'border-neon-green', 'bg-[#00ff88]/10');
            else if(type === 'error') el.classList.add('text-neon-pink', 'border-neon-pink', 'bg-[#ff0055]/10');
            el.innerHTML = msg;
        }

        async function executeUpload() {
            if(!currentUploadContext) return;

            const { contractId, docName, rowNumber } = currentUploadContext;
            const uploaderName = document.getElementById('up-name').value.trim();
            const fileInput = document.getElementById('up-file');
            
            if(!uploaderName) {
                setUploadStatus('<i class="fa-solid fa-triangle-exclamation"></i> Please enter uploader name.', 'error');
                return;
            }
            if(!fileInput.files || fileInput.files.length === 0) {
                setUploadStatus('<i class="fa-solid fa-triangle-exclamation"></i> Please select a file.', 'error');
                return;
            }

            const file = fileInput.files[0];
            const newFilename = `${contractId} - ${docName}`;

            document.getElementById('btn-execute-upload').disabled = true;
            document.getElementById('btn-cancel-upload').disabled = true;
            document.getElementById('btn-close-upload').disabled = true;

            setUploadStatus('<i class="fa-solid fa-spinner fa-spin"></i> Reading file...', 'loading');

            try {
                const b64 = await getBase64(file);
                
                setUploadStatus('<i class="fa-solid fa-spinner fa-spin"></i> Sending securely to backend...', 'loading');
                
                await apiCall({
                    action: 'uploadFile',
                    contractId: contractId,
                    docName: docName,
                    uploaderName: uploaderName,
                    rowNumber: rowNumber,
                    filename: newFilename,
                    mimeType: file.type,
                    base64Data: b64.split(',')[1]
                });

                setUploadStatus('<i class="fa-solid fa-circle-check"></i> Upload Successful! Refreshing Data...', 'success');
                
                setTimeout(() => {
                    closeUploadModal();
                    closeModal();
                    document.getElementById('loader').classList.remove('hidden');
                    fetchData(); 
                }, 1500);

            } catch (err) {
                setUploadStatus(`<i class="fa-solid fa-circle-xmark"></i> Error: ${err.message}`, 'error');
            } finally {
                document.getElementById('btn-execute-upload').disabled = false;
                document.getElementById('btn-cancel-upload').disabled = false;
                document.getElementById('btn-close-upload').disabled = false;
            }
        }

        function getBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        async function apiCall(body) {
            const token = await GoogleSheetsAPI.getAuthToken();
            const url = `https://script.google.com/macros/s/AKfycbyFpZgA6b7v6U-nZ_NfH4Xb1T59/exec`; 
            const res = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ ...body, token: token })
            });
            const data = await res.json();
            if (data.status !== 'success') throw new Error(data.message || 'API error');
            return data;
        }

		/* ========================================================================= 
         * SAFE NAVIGATION LOGIC
         * ========================================================================= */
        function handleAppBack() {
            try {
                // Try to use the parent iframe routing if it exists
                if (window.parent && window.parent.PCMA && typeof window.parent.PCMA.goBack === 'function') {
                    window.parent.PCMA.goBack();
                    return;
                }
            } catch (e) {
                // Ignore cross-origin frame blocks on local file:// execution
            }
            
            // Fallback: Break out of the iframe to the TOP window to prevent nested iframe glitches
            try {
                window.top.location.href = 'index.html';
            } catch (e) {
                window.location.href = 'index.html';
            }
        }


    </script>
