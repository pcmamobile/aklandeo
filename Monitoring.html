        class GoogleSheetsAPI {
            static _oauthToken = null;
            static _tokenExp = 0;

            static async getAuthToken() {
                if (this._oauthToken && this._tokenExp > Date.now()) return this._oauthToken;
                const header = { alg: "RS256", typ: "JWT" };
                const now = Math.floor(Date.now() / 1000);
                const claim = {
                    iss: API_CONFIG.SERVICE_ACCOUNT.client_email,
                    scope: "https://www.googleapis.com/auth/spreadsheets",
                    aud: "https://oauth2.googleapis.com/token",
                    exp: now + 3600,

                const sJWS = KJUR.jws.JWS.sign("RS256", sHeader, sClaim, API_CONFIG.SERVICE_ACCOUNT.private_key);
                const params = new URLSearchParams();
                params.append("grant_type", "urn:ietf:params:oauth:grant-type:jwt-bearer");
                params.append("assertion", sJWS);

                const res = await fetch("https://oauth2.googleapis.com/token", {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: params.toString()
                });
                
                const data = await res.json();
                if (data.access_token) {
                    this._oauthToken = data.access_token;
                    this._tokenExp = Date.now() + (data.expires_in * 1000) - 60000;
                    return data.access_token;
                } else {
                    throw new Error("Failed to get Google Token");

                    });
                    values.push(rowValues);
                    colorGrid.push(rowColors);

                    const headers = dataOthers.values[2].map(h => String(h || '').toUpperCase().trim());
                    const cIdx = headers.findIndex(h => h === 'CONTRACT ID' || h.includes('CONTRACT'));
                    const bIdx = headers.findIndex(h => h === 'BILLING');
                    
                    if (cIdx !== -1) othersSheetMeta.contractColIdx = cIdx;
                    if (bIdx !== -1) othersSheetMeta.billingColIdx = bIdx;
                    
                    for (let i = 3; i < dataOthers.values.length; i++) {
                        const row = dataOthers.values[i];
                        const cid = String(row[othersSheetMeta.contractColIdx] || '').trim();
                        if (cid) {
                            othersSheetMeta.map[cid] = i + 1; 
                            const billVal = String(row[othersSheetMeta.billingColIdx] || '').trim().toUpperCase();
                            if (billVal === 'X') {
                                excludedBillingContracts.add(cid);
                            }
                        }
                    }
                    othersSheetMeta.nextRow = dataOthers.values.length + 1;
                } else if (dataOthers.values && dataOthers.values.length > 0) {
                    othersSheetMeta.nextRow = dataOthers.values.length + 1;
                }

                const headers = dataSWA.values[0];
                const contractColIndex = findContractHeaderCol(headers);
                const loginColIndex = headers.findIndex(h => String(h || '').toUpperCase().trim() === 'LOGIN');

                const cleanHeaders = headers.map(h => String(h || '').toUpperCase().trim());
                globalPcmaColIdx = cleanHeaders.findIndex(h => h === 'PCMA');
                const monthlyColIdx = cleanHeaders.findIndex(h => h.replace(/\s/g, '') === 'MONTHLY(%)' || h === 'MONTHLY');
                globalRemarksColIdx = cleanHeaders.findIndex(h => h === 'REMARKS');

                if (weeklySelectedMonthOffset === -1) {
                    weeklySelectedMonthOffset = CURRENT_MONTH_OFFSET;
                }

                monitoringData = []; 
                billingDataGlobal = []; 
                monthlyDataGlobal = [];
                
                acceptanceCocSummary = {};
                acceptanceCfaSummary = {};
                acceptanceCocData = [];
                acceptanceCfaData = [];

                const targetYears = [2026, 2025, 2024];
                homeSummary = {};
                
                targetYears.forEach(y => {
                    homeSummary[y] = {
                        'GAA': { total: 0, ongoing: 0, completed: 0, nys: 0, terminated: 0 },
                        'DepEd': { total: 0, ongoing: 0, completed: 0, nys: 0, terminated: 0 },
                        'Maint': { total: 0, ongoing: 0, completed: 0, nys: 0, terminated: 0 },
                        'DA': { total: 0, ongoing: 0, completed: 0, nys: 0, terminated: 0 },
                        'DAR': { total: 0, ongoing: 0, completed: 0, nys: 0, terminated: 0 },
                        'SF': { total: 0, ongoing: 0, completed: 0, nys: 0, terminated: 0 }
                    };
                });

                Object.values(pdoLookup).forEach(pdoInfo => {
                    const y = parseInt(pdoInfo.year);
                    if (targetYears.includes(y)) {
                        let fCategory = 'GAA';
                        const fStr = (pdoInfo.fund || '').toUpperCase();
                        if (fStr.includes('DEPED')) fCategory = 'DepEd';
                        else if (fStr.includes('MAINT')) fCategory = 'Maint';
                        else if (fStr.includes('DAR')) fCategory = 'DAR';
                        else if (fStr === 'DA' || fStr.includes('DA ') || fStr.startsWith('DA-')) fCategory = 'DA';
                        else if (fStr.includes('SF') || fStr.includes('SPECIAL')) fCategory = 'SF';
                        
                        const sStr = (pdoInfo.status || '').toUpperCase();
                        
                        homeSummary[y][fCategory].total++;
                        
                        if (sStr.includes('TERMINATED')) {
                            homeSummary[y][fCategory].terminated++;
                        } else if (sStr.includes('COMPLETED')) {
                            homeSummary[y][fCategory].completed++;
                        } else if (sStr === 'NYS' || sStr.includes('NOT YET STARTED') || sStr.includes('NOT STARTED')) {
                            homeSummary[y][fCategory].nys++;
                        } else {
                            homeSummary[y][fCategory].ongoing++; 
                        }
                    }
                });

                for (let i = 1; i < dataSWA.values.length; i++) {
                    const row = dataSWA.values[i];
                    while (row.length < headers.length) row.push('');
                    
                    const contractId = row[contractColIndex] ? String(row[contractColIndex]).trim() : '';
                    if (!contractId) continue;

                    const pdoInfo = pdoLookup[contractId] || {};
                    const peName = pdoInfo.pe || 'Unassigned';
                    const projectName = pdoInfo.projectName || 'Unknown Project';
                    const location = pdoInfo.location || 'Unknown Location';
                    const contractor = pdoInfo.contractor || 'Unknown Contractor';
                    const ntp = pdoInfo.ntp || '-';
                    const expiry = pdoInfo.expiry || '-';
                    const contractAmount = voLookup[contractId] ? voLookup[contractId].amount : 0;

                    const is2026 = contractId.toUpperCase().includes('26GA');
                    const hasLogin = loginColIndex !== -1 && row[loginColIndex] && String(row[loginColIndex]).trim() !== '';

                    const actualPercent = calculateActualPercent(row, headers, contractId, itemsLookup, voLookup, pdoLookup);
                    const schedulePercent = calculateSchedulePercent(row, headers, contractId, pdoLookup);
                    const slippage = actualPercent - schedulePercent;
                    
                    const weeklyHistory = {};
                    if (is2026 && hasLogin) {
                        for (let mOffset = 0; mOffset <= CURRENT_MONTH_OFFSET; mOffset++) {
                            weeklyHistory[mOffset] = calculateWeeklyUpdates(row, headers, contractId, pdoLookup, mOffset);
                        }
                    }

                    monitoringData.push({ 
                        contractId, pe: peName, actual: actualPercent, schedule: schedulePercent, slippage, 
                        weeklyHistory, is2026, hasLogin,
                        projectName, location, contractor, ntp, expiry, contractAmount
                    });

                    const pcmaRaw = globalPcmaColIdx !== -1 && row[globalPcmaColIdx] ? String(row[globalPcmaColIdx]).trim() : '';
                    const monthlyRaw = monthlyColIdx !== -1 && row[monthlyColIdx] ? String(row[monthlyColIdx]).trim() : '';
                    const remarksRaw = globalRemarksColIdx !== -1 && row[globalRemarksColIdx] ? String(row[globalRemarksColIdx]).trim() : '';

                    monthlyDataGlobal.push({
                        contractId: contractId,
                        sheetRowIdx: i + 3,
                        pcmaRaw: pcmaRaw,
                        monthlyRaw: monthlyRaw, 
                        remarksRaw: remarksRaw, 
                        ntp: ntp, 
                        year: pdoInfo.year || 'Unknown',
                        pe: peName,
                        status: pdoInfo.status || 'Unknown',
                        projectName: projectName,
                        location: location,
                        contractor: contractor
                    });
                }

                const bValues = billingSheet.values;
                const bColors = billingSheet.colorGrid;

                if (bValues.length >= 3) {
                    const billHeader = bValues[2]; 
                    const billContractColIndex = findContractHeaderCol(billHeader);
                    
                    for (let r = 3; r < bValues.length; r++) {
                        const row = bValues[r] || [];
                        const colors = bColors[r] || [];
                        const contractId = row[billContractColIndex] ? String(row[billContractColIndex]).trim() : '';
                        if (!contractId) continue;

                        const pdoInfo = pdoLookup[contractId] || {};
                        const peName = pdoInfo.pe || 'Unknown PE';
                        const projectName = pdoInfo.projectName || 'Unknown Project';
                        const location = pdoInfo.location || 'Unknown Location';
                        const contractor = pdoInfo.contractor || 'Unknown Contractor';
                        const ntp = pdoInfo.ntp || '-';
                        const expiry = pdoInfo.expiry || '-';
                        const contractAmount = voLookup[contractId] ? voLookup[contractId].amount : 0;
                        
                        const fundAndProject = ((pdoInfo.fund || '') + ' ' + (pdoInfo.projectName || '')).toUpperCase();
                        const isDar = fundAndProject.includes('DAR');
                        const isMaint = fundAndProject.includes('MAINT');
                        
                        let fCategory = '';
                        if (fundAndProject.includes('DEPED')) fCategory = 'DepEd';
                        else if (fundAndProject.includes('MAINT')) fCategory = 'Maint';
                        else if (fundAndProject.includes('DAR')) fCategory = 'DAR';
                        else if (fundAndProject.includes('DA ') || fundAndProject.startsWith('DA-')) fCategory = 'DA';
                        else if (fundAndProject.includes('SF') || fundAndProject.includes('SPECIAL')) fCategory = 'SF';

                        const yearPrefix = contractId.substring(0, 2);
                        const projectYear = parseInt("20" + yearPrefix) || _today.getFullYear();

                        billHeader.forEach((title, colIndex) => {
                            if (!title) return;
                            const match = /^(\d{4})\s+([A-Za-z]+)$/.exec(String(title).trim());
                            if (!match) return;
                            
                            const year = match[1], monthName = match[2];
                            const amountText = String(row[colIndex] || "").trim();
                            
                            let remarksColIndex = -1;
                            const remarksHeader = year + " " + monthName + " Remarks";
                            for (let j = 0; j < billHeader.length; j++) {
                                if (String(billHeader[j]||'').toUpperCase().trim() === remarksHeader.toUpperCase()) { remarksColIndex = j; break; }
                            }
                            if (remarksColIndex < 0) {
                                const shortMonth = monthName.slice(0, 3).toLowerCase();
                                for (let j = 0; j < billHeader.length; j++) {
                                    const h = String(billHeader[j] || "").toLowerCase();
                                    if (h.includes(year.toLowerCase()) && h.includes(shortMonth) && h.includes("remarks")) { remarksColIndex = j; break; }
                                }
                            }

                            const remarksText = remarksColIndex >= 0 ? String(row[remarksColIndex] || "").trim() : "";
                            if (!amountText && !remarksText) return;

                            const color = colors[colIndex] || null;
                            let isRed = false;
                            if (color && (color.red || 0) >= 0.7 && (color.green || 0) <= 0.3 && (color.blue || 0) <= 0.3) isRed = true;

                            const parsedAmount = parseFloat(amountText.replace(/[^0-9.-]+/g, "")) || 0;
                            if (parsedAmount > 0) {
                                let cleanedRemarks = '-';
                                if (remarksText) {
                                    const remarkParts = remarksText.split('|').map(p => p.trim()).filter(p => p !== '');
                                    if (remarkParts.length > 0) cleanedRemarks = remarkParts[remarkParts.length - 1]; 
                                }

                                billingDataGlobal.push({
                                    contractId: contractId, contractor: contractor, pe: peName,
                                    fundCategory: fCategory, 
                                    isDar: isDar, isMaint: isMaint, projectYear: projectYear,
                                    amount: parsedAmount, remarks: cleanedRemarks,
                                    projectName, location, ntp, expiry, contractAmount,
                                    isPaid: isRed, billingYear: parseInt(year), billingMonthName: monthName
                                });
                            }
                        });
                    }
                }

                const dateLookup = {};
                if (dataDATE.values && dataDATE.values.length > 0) {
                    const headersDATE = dataDATE.values[0].map(h => String(h || '').toUpperCase().trim());
                    const colContractId = headersDATE.findIndex(h => h.includes('CONTRACTID') || h === 'CONTRACT' || h.includes('CONTRACT ID') || h.includes('CONTRACT'));
                    const colCOC = headersDATE.findIndex(h => h.includes('DATE OF COC'));
                    const colPunchlist = headersDATE.findIndex(h => h.includes('REMARKS YES/NO'));
                    const colCFA = headersDATE.findIndex(h => h.includes('DATE OF CA'));
                    const colCompletion = headersDATE.findIndex(h => h.includes('DATE OF COMPLETION') || h === 'COMPLETION');

                    for (let i = 1; i < dataDATE.values.length; i++) {
                        const row = dataDATE.values[i];
                        const contractId = colContractId !== -1 && row[colContractId] ? String(row[colContractId]).trim() : '';
                        if (!contractId) continue;
                        dateLookup[contractId] = {
                            coc: colCOC !== -1 && row[colCOC] ? String(row[colCOC]).trim() : '',
                            ca: colCFA !== -1 && row[colCFA] ? String(row[colCFA]).trim() : '',
                            punchlist: colPunchlist !== -1 && row[colPunchlist] ? String(row[colPunchlist]).trim() : '',
                            completion: colCompletion !== -1 && row[colCompletion] ? String(row[colCompletion]).trim() : ''
                        };
                    }
                }

                // Calculate ACCEPTANCE Summaries (COC and CFA)
                Object.keys(pdoLookup).forEach(contractId => {
                    const pdo = pdoLookup[contractId];
                    const year = parseInt(pdo.year);
                    if (isNaN(year)) return;

                    const fundStr = (pdo.fund || '').toUpperCase();
                    if (fundStr.includes('MAINT')) return;

                    if (!acceptanceCocSummary[year]) acceptanceCocSummary[year] = { total: 0, completed: 0, withCoc: 0, woCoc: 0 };
                    if (!acceptanceCfaSummary[year]) acceptanceCfaSummary[year] = { total: 0, coc: 0, withCfa: 0, woCfa: 0 };

                    acceptanceCocSummary[year].total++;
                    acceptanceCfaSummary[year].total++;
                    
                    const statusStr = (pdo.status || '').toUpperCase();
                    const dInfo = dateLookup[contractId] || {};
                    
                    const hasCOC = dInfo.coc && dInfo.coc !== '-' && !dInfo.coc.toLowerCase().includes('n/a');
                    const hasCA = dInfo.ca && dInfo.ca !== '-' && !dInfo.ca.toLowerCase().includes('n/a');
                    
                    // Summarize COC logic (only for Completed)
                    if (statusStr.includes('COMPLETED')) {
                        acceptanceCocSummary[year].completed++;
                        if (hasCOC) acceptanceCocSummary[year].withCoc++;
                        else acceptanceCocSummary[year].woCoc++; 
                    }

                    // Summarize CFA logic (only for projects with COC)
                    if (hasCOC) {
                        acceptanceCfaSummary[year].coc++;
                        if (hasCA) acceptanceCfaSummary[year].withCfa++;
                        else acceptanceCfaSummary[year].woCfa++;
                    }
                });

                const todayMs = new Date(_today.getFullYear(), _today.getMonth(), _today.getDate()).getTime();

                // Calculate Detailed Table Data (COC and CFA)
                Object.keys(dateLookup).forEach(contractId => {
                    const dInfo = dateLookup[contractId];
                    const pdoInfo = pdoLookup[contractId] || {};
                    const fundStr = (pdoInfo.fund || '').toUpperCase();
                    
                    if (fundStr.includes('MAINT')) return;

                    const statusStr = pdoInfo.status || '';

                    let hasCompletionDate = dInfo.completion && dInfo.completion !== '-' && !dInfo.completion.toLowerCase().includes('n/a');
                    let hasCOC = dInfo.coc && dInfo.coc !== '-' && !dInfo.coc.toLowerCase().includes('n/a');
                    let hasCA = dInfo.ca && dInfo.ca !== '-' && !dInfo.ca.toLowerCase().includes('n/a');

					// Push to COC Tab (Show only projects without COC)
                    if (statusStr.toUpperCase().includes('COMPLETED') && !hasCOC) {
                        let displayCompletion = '-';
                        let displayCOC = '-';
                        let daysLapsed = '-';
                        
                        if (hasCompletionDate) {
                            let compDate = new Date(dInfo.completion);
                            if (!isNaN(compDate.getTime())) {
                                const compMs = new Date(compDate.getFullYear(), compDate.getMonth(), compDate.getDate()).getTime();
                                daysLapsed = Math.round((todayMs - compMs) / 86400000);
                                displayCompletion = `${compDate.getMonth() + 1}/${compDate.getDate()}/${compDate.getFullYear()}`;
                            }
                        }

                        if (hasCOC) {
                            let cocDate = new Date(dInfo.coc);
                            if (!isNaN(cocDate.getTime())) {
                                displayCOC = `${cocDate.getMonth() + 1}/${cocDate.getDate()}/${cocDate.getFullYear()}`;
                            }
                        }

                        acceptanceCocData.push({
                            contractId,
                            status: statusStr,
                            completedDate: displayCompletion,
                            coc: displayCOC,
                            lapsed: daysLapsed,
                            year: String(pdoInfo.year || ''),
                            pe: pdoInfo.pe || 'Unassigned',
                            projectName: pdoInfo.projectName || '',
                            location: pdoInfo.location || '',
                            contractor: pdoInfo.contractor || '',
                            contractAmount: voLookup[contractId] ? voLookup[contractId].amount : 0,
                            ntp: pdoInfo.ntp || '-',
                            expiry: pdoInfo.expiry || '-'
                        });
                    }

                    // Push to CFA Tab (Projects with COC but no CA)
                    if (hasCOC && !hasCA) {
                        let displayCOC = '-';
                        let daysRemaining = '-';
                        
                        let cocDate = new Date(dInfo.coc);
                        if (!isNaN(cocDate.getTime())) {
                            let targetDate = new Date(cocDate);
                            targetDate.setFullYear(targetDate.getFullYear() + 1);
                            const targetMs = new Date(targetDate.getFullYear(), targetDate.getMonth(), targetDate.getDate()).getTime();
                            daysRemaining = Math.round((targetMs - todayMs) / 86400000);
                            displayCOC = `${cocDate.getMonth() + 1}/${cocDate.getDate()}/${cocDate.getFullYear()}`;
                        }

                        let punchlistRaw = (dInfo.punchlist || '').trim();
                        let punchlistClean = '-';
                        if (punchlistRaw.match(/^yes/i)) punchlistClean = 'Yes';
                        else if (punchlistRaw.match(/^no/i)) punchlistClean = 'No';

                        acceptanceCfaData.push({
                            contractId,
                            coc: displayCOC,
                            punchlist: punchlistClean,
                            cfa: '-',
                            days: daysRemaining,
                            year: String(pdoInfo.year || ''),
                            pe: pdoInfo.pe || 'Unassigned',
                            projectName: pdoInfo.projectName || '',
                            location: pdoInfo.location || '',
                            contractor: pdoInfo.contractor || '',
                            contractAmount: voLookup[contractId] ? voLookup[contractId].amount : 0,
                            ntp: pdoInfo.ntp || '-',
                            expiry: pdoInfo.expiry || '-'
                        });
                    }
                });

                // Calculate Document UPLOAD matrix
                const docsLookup = {};
                if (dataUPLOAD.values && dataUPLOAD.values.length > 0) {
                    let headerRowIndex = dataUPLOAD.values.findIndex(row => row.some(cell => String(cell || '').trim().toUpperCase() === 'CONTRACT ID'));
                    if (headerRowIndex !== -1) {
                        const upHeaders = dataUPLOAD.values[headerRowIndex].map(h => String(h || '').toUpperCase().trim());
                        const idCol = upHeaders.indexOf('CONTRACT ID');

                        for (let i = headerRowIndex + 1; i < dataUPLOAD.values.length; i++) {
                            const row = dataUPLOAD.values[i];
                            const cId = row[idCol] ? String(row[idCol]).trim() : '';
                            if (!cId) continue;

                            docsLookup[cId] = {};
                            upHeaders.forEach((h, idx) => {
                                if (h.endsWith(' UPLOADED')) {
                                    const baseName = h.replace(' UPLOADED', '').trim();
                                    const baseIdx = upHeaders.indexOf(baseName);
                                    if (baseIdx !== -1) {
                                        const baseVal = row[baseIdx] ? String(row[baseIdx]).trim() : '';
                                        const uploadVal = row[idx] ? String(row[idx]).trim() : '';
                                        docsLookup[cId][baseName] = { required: baseVal !== '', uploaded: uploadVal !== '' };
                                    }
                                }
                            });
                        }
                    }
                }
                
                // Merge docs into monthlyDataGlobal (our main database object)
                monthlyDataGlobal.forEach(item => {
                    item.docs = docsLookup[item.contractId] || {};
                });

                isDataFetched = true; 
                document.getElementById('loader').classList.add('hidden');
                switchMainView(mainView); 

            } catch (err) {
                console.error(err);
                alert("Failed to load data. Please refresh.");
            }
        }

        // ====================================================================
        // BACKGROUND SAVE & UNDO 
        // ====================================================================
        function colIndexToLetter(index) {
            let letter = '';
            while (index >= 0) {
                letter = String.fromCharCode((index % 26) + 65) + letter;
                index = Math.floor(index / 26) - 1;
            }
            return letter;
        }

        function renderUndoButtonState() {
            const btn = document.getElementById('undo-btn');
            if (btn) {
                if (editHistory.length > 0) {
                    btn.disabled = false;
                    btn.className = "bg-rose-500 hover:bg-rose-600 text-white font-black text-center py-1.5 px-4 text-sm md:text-base outline-none shadow-md rounded-md transition-all active:scale-95 flex justify-center items-center gap-2";
                } else {
                    btn.disabled = true;
                    btn.className = "bg-gray-300 opacity-50 cursor-not-allowed text-white font-black text-center py-1.5 px-4 text-sm md:text-base outline-none shadow-sm rounded-md transition-all flex justify-center items-center gap-2";
                }
            }
        }

        async function undoLastEdit() {
            if (editHistory.length === 0) return;
            const lastEdit = editHistory.pop();
            
            const item = monthlyDataGlobal.find(x => x.contractId === lastEdit.contractId);
            if (!item) return;

            let colIdx = lastEdit.field === 'pcma' ? globalPcmaColIdx : globalRemarksColIdx;

            if (lastEdit.field === 'pcma') item.pcmaRaw = lastEdit.oldRawData;
            if (lastEdit.field === 'remarks') item.remarksRaw = lastEdit.oldRawData;

            renderView();

            try {
                const token = await GoogleSheetsAPI.getAuthToken();
                const cellA1 = `SWA!${colIndexToLetter(colIdx)}${lastEdit.sheetRowIdx}`;
                const url = `https://sheets.googleapis.com/v4/spreadsheets/${API_CONFIG.SPREADSHEET_ID}/values/${cellA1}?valueInputOption=USER_ENTERED`;
                
                await fetch(url, {
                    method: 'PUT',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ range: cellA1, majorDimension: "ROWS", values: [[lastEdit.oldRawData]] })
                });
            } catch (e) {
                console.error("Undo save error", e);
                alert("Undo failed to sync with Google Sheets. Please check your connection.");
            }
        }

        async function updateSheetData(contractId, field, newValue, monthDiff) {
            const item = monthlyDataGlobal.find(x => x.contractId === contractId);
            if (!item) return;

            let colIdx = field === 'pcma' ? globalPcmaColIdx : globalRemarksColIdx;
            let oldRawData = field === 'pcma' ? item.pcmaRaw : item.remarksRaw;
            
            if (colIdx === -1) { alert(`Column for ${field.toUpperCase()} not found in SWA Sheet.`); return; }

            let parts = (oldRawData || '').split('|').map(p => p.trim());
            while (parts.length <= monthDiff) { parts.push(''); }
            parts[monthDiff] = newValue.trim();
            const newRawData = parts.join('|');

            if (oldRawData === newRawData) return;

            editHistory.push({ contractId, field, monthDiff, oldRawData, newRawData, sheetRowIdx: item.sheetRowIdx });

            if (field === 'pcma') item.pcmaRaw = newRawData;
            if (field === 'remarks') item.remarksRaw = newRawData;

            renderUndoButtonState(); 

            const inputEl = document.getElementById(`input-${field}-${contractId}-${monthDiff}`);
            if (inputEl) {
                inputEl.classList.add('bg-green-100');
                if(inputEl.tagName === 'TEXTAREA') {
                    inputEl.style.height = 'auto';
                    inputEl.style.height = inputEl.scrollHeight + 'px';
                }
            }

            try {
                const token = await GoogleSheetsAPI.getAuthToken();
                const cellA1 = `SWA!${colIndexToLetter(colIdx)}${item.sheetRowIdx}`;
                const url = `https://sheets.googleapis.com/v4/spreadsheets/${API_CONFIG.SPREADSHEET_ID}/values/${cellA1}?valueInputOption=USER_ENTERED`;
                
                const response = await fetch(url, {
                    method: 'PUT',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ range: cellA1, majorDimension: "ROWS", values: [[newRawData]] })
                });

                if (response.ok) {
                    if (inputEl) setTimeout(() => inputEl.classList.remove('bg-green-100'), 1000);
                } else {
                    if (inputEl) { inputEl.classList.remove('bg-green-100'); inputEl.classList.add('bg-red-100'); }
                }
            } catch (e) {
                console.error("Save error", e);
                if (inputEl) { inputEl.classList.remove('bg-green-100'); inputEl.classList.add('bg-red-100'); }
            }
        }

        window.toggleBillingExclusion = async function(contractId, checkboxEl) {
            const isChecked = checkboxEl.checked;
            const isExcluded = !isChecked; 
            const val = isExcluded ? 'X' : '';

            if (isExcluded) excludedBillingContracts.add(contractId);
            else excludedBillingContracts.delete(contractId);
            
            renderView(); 

            let targetRow = othersSheetMeta.map[contractId];
            let isNewRow = false;
            
            if (!targetRow) {
                targetRow = othersSheetMeta.nextRow++;
                othersSheetMeta.map[contractId] = targetRow;
                isNewRow = true;
            }

            try {
                const token = await GoogleSheetsAPI.getAuthToken();
                let url, body;

                if (isNewRow) {
                    const maxCol = Math.max(othersSheetMeta.contractColIdx, othersSheetMeta.billingColIdx);
                    const rowData = new Array(maxCol + 1).fill('');
                    rowData[othersSheetMeta.contractColIdx] = contractId;
                    rowData[othersSheetMeta.billingColIdx] = val;
                    
                    const cellA1 = `Others!A${targetRow}`;
                    url = `https://sheets.googleapis.com/v4/spreadsheets/${API_CONFIG.SPREADSHEET_ID}/values/${cellA1}?valueInputOption=USER_ENTERED`;
                    body = JSON.stringify({ range: cellA1, majorDimension: "ROWS", values: [rowData] });
                } else {
                    const colLetter = colIndexToLetter(othersSheetMeta.billingColIdx);
                    const cellA1 = `Others!${colLetter}${targetRow}`;
                    url = `https://sheets.googleapis.com/v4/spreadsheets/${API_CONFIG.SPREADSHEET_ID}/values/${cellA1}?valueInputOption=USER_ENTERED`;
                    body = JSON.stringify({ range: cellA1, majorDimension: "ROWS", values: [[val]] });
                }

                const res = await fetch(url, {
                    method: 'PUT',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                    body: body
                });

                if (!res.ok) {

        function cleanActualVal(val) {
            if (!val) return '-';
            const num = parseFloat(String(val).replace(/[^0-9.-]/g, ''));
            if (isNaN(num) || num === 0) return '-';
            if (String(val).includes('%')) return val;
            return num.toFixed(2) + '%'; 
        }

        function formatCurrency(num) {
            if (num === null || num === undefined || isNaN(num)) return '';
            return new Intl.NumberFormat('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(num);
        }
        
        function formatDateReadable(dStr) {
            if (!dStr || dStr === '-') return '-';
            let d = new Date(dStr);
            if (!isNaN(d.getTime())) return d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
            return dStr;
        }

        function calculateActualPercent(row, headers, contractId, itemsLookup, voLookup, pdoLookup) {
            const contractVo = voLookup[contractId] || { amount: 0 };
            const contractAmount = contractVo.amount;
            if (contractAmount <= 0) return 0;
            const contractColIndex = findContractHeaderCol(headers);
            const ntpOffset = pdoLookup[contractId] ? parseNtpToOffset(pdoLookup[contractId].ntp) : 0;
            const monthDiff = CURRENT_MONTH_OFFSET - ntpOffset;
            let totalToDateAmount = 0;
            for (let c = 0; c < row.length; c++) {
                if (c === contractColIndex) continue;
                const colHeader = String(headers[c] || '').trim().toUpperCase();
                if (colHeader === 'REMARKS' || colHeader === 'BARCHART' || colHeader === 'SUSPENSION') continue;
                const cellVal = String(row[c] || '').trim();
                if (colHeader.startsWith('ITEM') && cellVal !== "" && cellVal.includes('|')) {
                    const parts = cellVal.split('|').map(p => p.trim());
                    if (parts.length < 7) continue;
                    const itemNo = parts[0] || '';
                    const costArr = (parts[2] || '0').split(',').map(p => { const parsed = parseFloat(String(p).replace(/[^0-9.-]+/g, "")); return isNaN(parsed) ? 0 : parsed; });
                    let unitCost = costArr[0] || 0;
                    for(let i=1; i<costArr.length; i++) if (costArr[i] !== '') unitCost = costArr[i];
                    if (unitCost === 0 && costArr[0] === 0) unitCost = itemsLookup[itemNo] ? itemsLookup[itemNo].unitCost : 0;
                    let previous = 0, thisPeriod = 0;
                    if (monthDiff >= 0) {
                        for (let x = 7; x < 7 + monthDiff; x++) previous += parseAccomplishmentVal(parts[x]);
                        thisPeriod = parseAccomplishmentVal(parts[7 + monthDiff]);
                    }
                    totalToDateAmount += ((previous + thisPeriod) * unitCost);
                }
            }
            return (totalToDateAmount / contractAmount) * 100;
        }

        function calculateSchedulePercent(row, headers, contractId, pdoLookup) {
            const barchartColIdx = headers.findIndex(h => String(h || '').toUpperCase().trim() === 'BARCHART');
            if (barchartColIdx === -1) return 0;
            const ntpStr = pdoLookup[contractId] ? pdoLookup[contractId].ntp : '';
            let ntpDate = new Date(ntpStr);
            let ntpOffset = 0;
            if (isNaN(ntpDate.getTime())) {
                ntpOffset = parseNtpToOffset(ntpStr);
                const y = START_YEAR + Math.floor(ntpOffset / 12);
                const m = ntpOffset % 12;
                ntpDate = new Date(y, m, 1);
            } else { ntpOffset = (ntpDate.getFullYear() - START_YEAR) * 12 + ntpDate.getMonth(); }
            if (CURRENT_MONTH_OFFSET < ntpOffset) return 0;
            const barchartParts = String(row[barchartColIdx] || '').split('|').map(p => p.trim());
            const suspColIdx = headers.findIndex(h => String(h || '').toUpperCase().trim() === 'SUSPENSION');
            let suspensions = [];
            if (suspColIdx !== -1) {
                const suspStr = String(row[suspColIdx] || '');
                if (suspStr) {
                    suspensions = suspStr.split(',').map(s => {
                        const p = s.split('|');
                        return { suspend: p[0] ? new Date(p[0]) : null, resume: p[1] ? new Date(p[1]) : null };
                    }).filter(s => s.suspend && !isNaN(s.suspend.getTime()));
                }
            }
            let evalDate = new Date(); 
            let totalSuspendedMs = 0;
            suspensions.forEach(s => {
                const start = s.suspend > ntpDate ? s.suspend : ntpDate;
                let end = evalDate;
                if (s.resume && s.resume < evalDate) end = s.resume;
                if (start < end && start <= evalDate) totalSuspendedMs += (end.getTime() - start.getTime());
            });
            const effectiveDate = new Date(evalDate.getTime() - totalSuspendedMs);
            const effectiveMonthOffset = (effectiveDate.getFullYear() - START_YEAR) * 12 + effectiveDate.getMonth();
            let totalScheduled = 0;
            for (let i = ntpOffset; i <= effectiveMonthOffset; i++) {
                const monthDiff = i - ntpOffset;
                const monthPerc = parseFloat(barchartParts[monthDiff]) || 0;
                if (i < effectiveMonthOffset) { totalScheduled += monthPerc; 
                } else if (i === effectiveMonthOffset) {
                    const year = START_YEAR + Math.floor(i / 12);
                    const month = i % 12;
                    const daysInMonth = new Date(year, month + 1, 0).getDate();
                    totalScheduled += (monthPerc / daysInMonth) * effectiveDate.getDate();
                }
            }
            return Math.min(100, totalScheduled);
        }

        function calculateWeeklyUpdates(row, headers, contractId, pdoLookup, mOffset) {
            let weeks = ['missing', 'missing', 'missing', 'missing'];
            const contractColIndex = findContractHeaderCol(headers);
            const ntpOffset = pdoLookup[contractId] ? parseNtpToOffset(pdoLookup[contractId].ntp) : 0;
            const monthDiff = mOffset - ntpOffset;
            
            if (monthDiff < 0) return ['before_ntp', 'before_ntp', 'before_ntp', 'before_ntp']; 
            
            const suspColIdx = headers.findIndex(h => String(h || '').toUpperCase().trim() === 'SUSPENSION');
            let suspensions = [];
            if (suspColIdx !== -1) {
                const suspStr = String(row[suspColIdx] || '');
                if (suspStr) {
                    suspensions = suspStr.split(',').map(s => {
                        const p = s.split('|');
                        const sStart = p[0] ? new Date(p[0].trim()) : null;
                        const sEnd = p[1] && p[1].trim() !== '' ? new Date(p[1].trim()) : null;
                        return { suspend: (sStart && !isNaN(sStart.getTime())) ? sStart : null, resume: (sEnd && !isNaN(sEnd.getTime())) ? sEnd : null };
                    }).filter(s => s.suspend !== null);
                }
            }
            
            const targetYear = START_YEAR + Math.floor(mOffset / 12);
            const targetMonth = mOffset % 12;
            const weekRanges = [
                { start: new Date(targetYear, targetMonth, 1), end: new Date(targetYear, targetMonth, 7, 23, 59, 59) },
                { start: new Date(targetYear, targetMonth, 8), end: new Date(targetYear, targetMonth, 14, 23, 59, 59) },
                { start: new Date(targetYear, targetMonth, 15), end: new Date(targetYear, targetMonth, 21, 23, 59, 59) },
                { start: new Date(targetYear, targetMonth, 22), end: new Date(targetYear, targetMonth + 1, 0, 23, 59, 59) }
            ];

            const todayTime = _today.getTime();

            for (let w = 0; w < 4; w++) {
                const wkStart = weekRanges[w].start;
                const wkEnd = weekRanges[w].end;
                
                if (wkStart.getTime() > todayTime) {
                    weeks[w] = 'future';
                    continue;
                }

                const isSuspended = suspensions.some(s => {
                    const sStart = s.suspend;
                    const sEnd = s.resume || new Date(2099, 11, 31); 
                    return sStart <= wkEnd && sEnd >= wkStart;
                });
                if (isSuspended) weeks[w] = 'suspended';
            }

            for (let c = 0; c < row.length; c++) {
                if (c === contractColIndex) continue;
                const colHeader = String(headers[c] || '').trim().toUpperCase();
                if (!colHeader.startsWith('ITEM')) continue;
                const cellVal = String(row[c] || '').trim();
                if (cellVal !== "" && cellVal.includes('|')) {
                    const parts = cellVal.split('|').map(p => p.trim());
                    if (parts.length <= 7 + monthDiff) continue;
                    const tpStr = String(parts[7 + monthDiff] || '');
                    if (tpStr.includes(',')) {
                        const sp = tpStr.split(',');
                        for(let i=0; i<4; i++) {
                            if (weeks[i] === 'future' || weeks[i] === 'suspended') continue;
                            const parsed = parseFloat(sp[i] ? sp[i].replace(/[^0-9.-]+/g, "") : "");
                            if (!isNaN(parsed) && parsed > 0) weeks[i] = 'updated';
                        }
                    } else {
                        if (weeks[0] !== 'future' && weeks[0] !== 'suspended') {
                            const parsed = parseFloat(tpStr.replace(/[^0-9.-]+/g, ""));
                            if (!isNaN(parsed) && parsed > 0) weeks[0] = 'updated';
                        }
                    }
                }
            }
            return weeks;
        }

                                    html += `

                                        <td class="py-1.5 px-2 dotted-border font-extrabold text-xs md:text-sm">${p.coc}</td>

                            html += `</tbody></table></div>`;

                } else {

                    const allStatuses = [...new Set(monthlyDataGlobal.map(item => item.status))].filter(Boolean).sort();

                            </div>
                        </div>
                    `;

                    let filteredMonthly = monthlyDataGlobal.map(item => {
                        const ntpOffset = parseNtpToOffset(item.ntp);
                        const monthDiff = targetMonthOffset - ntpOffset;
                        const isBeforeNTP = monthDiff < 0;

                        let actualText = '-';
                        let remarkText = '-';
                        let pcmaText = '-';

                        let isActualUpdated = false;
                        let isPcmaUpdated = false;
                        let isRemarksUpdated = false;

                        let trendData = [];
                        for (let i = 0; i < 4; i++) {
                            let colOffset = targetMonthOffset - 3 + i; 
                            let itemMonthDiff = colOffset - ntpOffset;
                            let isBeforeNTPCol = itemMonthDiff < 0;
                            
                            let pcmaVal = '-', actualVal = '-', indicator = '';
                            if (!isBeforeNTPCol) {
                                const pParts = (item.pcmaRaw || '').split('|').map(p => p.trim());
                                pcmaVal = pParts[itemMonthDiff] || '';
                                if (!pcmaVal) pcmaVal = '-';
                                
                                const mParts = (item.monthlyRaw || '').split('|').map(p => p.trim());
                                actualVal = cleanActualVal(mParts[itemMonthDiff] || '');

                                let prevMonthDiff = itemMonthDiff - 1;
                                let prevActualVal = prevMonthDiff >= 0 ? cleanActualVal(mParts[prevMonthDiff] || '') : '-';
                                
                                let curNum = parseFloat(actualVal) || 0;
                                let prevNum = parseFloat(prevActualVal) || 0;
                                
                                if (actualVal !== '-') {
                                    if (curNum > prevNum) {
                                        indicator = 'up';
                                    } else if (curNum < prevNum) {
                                        indicator = 'down';
                                    } else if (curNum === prevNum && curNum > 0) {
                                        indicator = 'equal';
                                    }
                                }
                            }
                            trendData.push({ monthDiff: itemMonthDiff, isBeforeNTP: isBeforeNTPCol, pcmaVal, actualVal, indicator });
                        }

                        if (!isBeforeNTP) {
                            const monthlyParts = (item.monthlyRaw || '').split('|').map(p => p.trim());
                            const remarksParts = (item.remarksRaw || '').split('|').map(p => p.trim());
                            const pcmaParts = (item.pcmaRaw || '').split('|').map(p => p.trim());
                            
                            let mVal = monthlyParts[monthDiff] || '';
                            actualText = cleanActualVal(mVal);
                            if (mVal !== '' && actualText !== '-') isActualUpdated = true;

                            let rVal = remarksParts[monthDiff] || '';
                            if (rVal && rVal !== '-') { remarkText = rVal; isRemarksUpdated = true; }

                            let pVal = pcmaParts[monthDiff] || '';
                            if (pVal && pVal !== '-') { pcmaText = pVal; isPcmaUpdated = true; }
                        }

                        return {
                            ...item, monthDiff, isBeforeNTP,
                            isActualUpdated, isPcmaUpdated, isRemarksUpdated,
                            displayActual: actualText, displayRemarks: remarkText, displayPcma: pcmaText,
                            trendData
                        };
                    }).filter(item => {
                        const matchYear = monthlyFilterYear === 'All' || item.year === monthlyFilterYear;
                        const matchPe = monthlyFilterPe === 'All' || item.pe === monthlyFilterPe;
                        const matchStatus = monthlyFilterStatus === 'All' || item.status === monthlyFilterStatus;
                        
                        const matchPendingPcma = !monthlyFilterPendingPCMA || (!item.isPcmaUpdated && !item.isBeforeNTP);
                        const matchPendingActual = !monthlyFilterPendingActual || (!item.isActualUpdated && !item.isBeforeNTP);
                        const matchPendingRemarks = !monthlyFilterPendingRemarks || (!item.isRemarksUpdated && !item.isBeforeNTP);

                        let matchSearch = true;
                        if (monthlySearchQuery) {
                            const sq = monthlySearchQuery.toLowerCase();
                            matchSearch = (item.contractId && item.contractId.toLowerCase().includes(sq)) ||
                                          (item.projectName && item.projectName.toLowerCase().includes(sq)) ||
                                          (item.location && item.location.toLowerCase().includes(sq)) ||
                                          (item.contractor && item.contractor.toLowerCase().includes(sq)) ||
                                          (item.displayRemarks && item.displayRemarks.toLowerCase().includes(sq));
                        }
                        
                        return matchYear && matchPe && matchStatus && matchPendingPcma && matchPendingActual && matchPendingRemarks && matchSearch;

                        const groupedMonthly = {};
                        filteredMonthly.forEach(item => {
                            if(!groupedMonthly[item.year]) groupedMonthly[item.year] = [];
                            groupedMonthly[item.year].push(item);
                        });

                        const sortedYears = Object.keys(groupedMonthly).sort().reverse();
                        
                        sortedYears.forEach((yearGrp) => {
                            const theme = YEAR_THEMES[yearGrp] || YEAR_THEMES[2026]; 
                            const items = groupedMonthly[yearGrp];

                                        <div class="w-[20%] py-1.5 flex justify-center items-center">

                                        </div>

                                            <span class="text-sm md:text-base font-bold drop-shadow-sm">Pending</span>
                                        </div>
                                    </div>
                                    <table class="w-full border-collapse text-sm md:text-base font-bold text-black bg-white table-fixed">
                                        <thead>
                                            <tr class="bg-[#fff9f2] italic text-xs md:text-sm border-b border-orange-200">
                                                <th class="py-1.5 px-1 dotted-border font-extrabold text-black text-center w-[25%]">Contract ID</th>
                                                <th class="py-1.5 px-1 dotted-border font-extrabold text-black text-center w-[20%]">PCMA</th>
                                                <th class="py-1.5 px-1 dotted-border font-extrabold text-black text-center w-[20%]">Actual</th>
                                                <th class="py-1.5 px-1 font-extrabold text-black text-center w-[35%]">Remarks</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                `;

                                                        placeholder="-"
                                                        onchange="updateSheetData('${p.contractId}', 'pcma', this.value, ${p.monthDiff})"
                                                    />
                                                </div>

                                            <td class="py-2 px-1 dotted-border font-black text-center text-[13px] md:text-base">
                                                ${p.isBeforeNTP ? '<span class="text-xs text-gray-500 font-bold italic">Before NTP</span>' : `
                                                <span>${p.displayActual}</span>
                                                `}
                                            </td>
                                            
                                            <td class="py-1 px-1 text-center">
                                                ${p.isBeforeNTP ? '<span class="text-xs text-gray-500 font-bold italic">Before NTP</span>' : `
