<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D VO Tracking Dashboard - Monitor</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Configuration & Custom CSS -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'dark-bg': '#1a1a24',
                        'neon-blue': '#00f3ff',
                        'neon-purple': '#b026ff',
                        'neon-green': '#00ff88',
                        'neon-orange': '#ff5e00',
                        'neon-pink': '#ff0055'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #1a1a24;
            color: #e2e8f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
        }

        .card-3d {
            background: #20202d;
            box-shadow: 12px 12px 24px #121219, -12px -12px 24px #2e2e41;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .btn-3d {
            background: #20202d;
            box-shadow: 6px 6px 12px #121219, -6px -6px 12px #2e2e41;
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.2s ease;
            border-radius: 16px;
        }

        .btn-3d:active {
            box-shadow: inset 4px 4px 8px #121219, inset -4px -4px 8px #2e2e41;
            transform: scale(0.98);
        }

        .btn-3d.active-tab {
            box-shadow: inset 6px 6px 12px #121219, inset -6px -6px 12px #2e2e41;
            color: #00f3ff;
            border-bottom: 3px solid #00f3ff;
        }

        .td-clickable {
            background: linear-gradient(145deg, #ff0055, #c20042);
            box-shadow: 0 5px 0 #8a002f, 0 10px 15px rgba(0,0,0,0.5);
            border-radius: 12px;
            width: 42px;
            height: 42px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 800;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.1s;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        .td-clickable:active {
            transform: translateY(5px);
            box-shadow: 0 0px 0 #8a002f, 0 3px 5px rgba(0,0,0,0.5);
        }

        .sticky-col {
            position: sticky;
            left: 0;
            background: #20202d;
            z-index: 10;
            box-shadow: 4px 0 8px rgba(0,0,0,0.3);
        }

        .modal-content-3d {
            background: #252535;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255,255,255,0.1);
            border: 1px solid #3d3d52;
        }
        
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1a1a24; }
        ::-webkit-scrollbar-thumb { background: #3d3d52; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #00f3ff; }

        .loading-pulse { animation: pulse 1.5s infinite; }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.05); }
        }

        /* Missing Doc Chip Hover */
        .doc-chip {
            cursor: pointer;
            transition: all 0.2s;
        }
        .doc-chip:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 0, 85, 0.4);
            border-color: rgba(255, 0, 85, 0.8);
        }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen flex flex-col items-center">

    <!-- Header -->
    <header class="w-full max-w-6xl text-center mb-4 md:mb-8 mt-4">
        <h1 class="text-3xl md:text-6xl font-black mb-1 drop-shadow-lg text-transparent bg-clip-text bg-gradient-to-r from-neon-blue via-neon-purple to-neon-pink" style="filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));">
            <i class="fa-solid fa-layer-group text-neon-blue mr-3"></i><span class="md:hidden">Monitoring</span><span class="hidden md:inline">Files to Upload</span>
        </h1>
    </header>

    <!-- Main Dashboard Container -->
    <main class="w-full max-w-6xl card-3d p-4 md:p-8 relative">
        
        <!-- Loading Overlay -->
        <div id="loader" class="absolute inset-0 z-50 bg-[#20202d]/90 rounded-2xl flex flex-col items-center justify-center backdrop-blur-sm">
            <i class="fa-solid fa-cube text-6xl text-neon-blue loading-pulse mb-4"></i>
            <h2 class="text-xl font-bold text-neon-blue" id="loader-title">Fetching Live Data...</h2>
            <p id="loader-text" class="text-gray-400 mt-2 text-sm text-center px-4">Connecting securely to API Backend...</p>
        </div>

        <!-- Document Type Toggle -->
        <div class="sticky top-0 md:static z-40 grid grid-cols-3 md:flex md:flex-wrap justify-center mb-6 bg-[#181822]/95 backdrop-blur-md rounded-xl md:rounded-2xl p-2 w-full md:w-fit mx-auto border border-gray-700/50 shadow-[0_10px_30px_rgba(0,0,0,0.6)] md:shadow-inner gap-1 md:gap-2">
            <button onclick="switchDocType('MOBILIZATION')" id="type-MOBILIZATION" class="px-1 md:px-4 py-2 rounded-lg font-black text-[10px] md:text-sm transition-all bg-[#2a2a3a] text-neon-blue shadow-md border border-gray-600/50 text-center">MOBILIZATION</button>
            <button onclick="switchDocType('ON-GOING')" id="type-ON-GOING" class="px-1 md:px-4 py-2 rounded-lg font-black text-[10px] md:text-sm transition-all text-gray-400 hover:text-white border-transparent text-center">ON-GOING</button>
            <button onclick="switchDocType('COMPLETION')" id="type-COMPLETION" class="px-1 md:px-4 py-2 rounded-lg font-black text-[10px] md:text-sm transition-all text-gray-400 hover:text-white border-transparent text-center">COMPLETION</button>
            <button onclick="switchDocType('ACCEPTANCE')" id="type-ACCEPTANCE" class="px-1 md:px-4 py-2 rounded-lg font-black text-[10px] md:text-sm transition-all text-gray-400 hover:text-white border-transparent text-center">ACCEPTANCE</button>
            <button onclick="switchDocType('GEOTAGGING')" id="type-GEOTAGGING" class="px-1 md:px-4 py-2 rounded-lg font-black text-[10px] md:text-sm transition-all text-gray-400 hover:text-white border-transparent text-center">GEOTAGGING</button>
            <button onclick="switchDocType('PCMA')" id="type-PCMA" class="px-1 md:px-4 py-2 rounded-lg font-black text-[10px] md:text-sm transition-all text-gray-400 hover:text-white border-transparent text-center">PCMA</button>
        </div>

        <!-- Role Tabs -->
        <div class="grid grid-cols-4 md:flex md:flex-wrap justify-center gap-2 md:gap-4 mb-6 w-full max-w-3xl mx-auto">
            <button onclick="switchTab('PE')" id="tab-PE" class="btn-3d active-tab py-2 md:py-4 px-2 md:px-6 font-black text-xs md:text-lg flex flex-col md:flex-row items-center gap-1 md:gap-3 w-full sm:w-auto justify-center">
                <i class="fa-solid fa-helmet-safety text-neon-orange md:text-2xl"></i> <span class="md:hidden">PE</span><span class="hidden md:inline">Project Engineer</span>
            </button>
            <button onclick="switchTab('PI')" id="tab-PI" class="btn-3d py-2 md:py-4 px-2 md:px-6 font-black text-xs md:text-lg flex flex-col md:flex-row items-center gap-1 md:gap-3 w-full sm:w-auto justify-center text-gray-400">
                <i class="fa-solid fa-magnifying-glass-chart text-neon-green md:text-2xl"></i> <span class="md:hidden">PI</span><span class="hidden md:inline">Project Inspector</span>
            </button>
            <button onclick="switchTab('RE')" id="tab-RE" class="btn-3d py-2 md:py-4 px-2 md:px-6 font-black text-xs md:text-lg flex flex-col md:flex-row items-center gap-1 md:gap-3 w-full sm:w-auto justify-center text-gray-400">
                <i class="fa-solid fa-user-gear text-neon-purple md:text-2xl"></i> <span class="md:hidden">RE</span><span class="hidden md:inline">Resident Engineer</span>
            </button>
            <button onclick="switchTab('QE')" id="tab-QE" class="btn-3d py-2 md:py-4 px-2 md:px-6 font-black text-xs md:text-lg flex flex-col md:flex-row items-center gap-1 md:gap-3 w-full sm:w-auto justify-center text-gray-400">
                <i class="fa-solid fa-clipboard-check text-neon-pink md:text-2xl"></i> <span class="md:hidden">QE</span><span class="hidden md:inline">Quantity Engineer</span>
            </button>
        </div>

        <!-- Global Search Button -->
        <div class="w-full max-w-md mx-auto mb-8 relative">
            <button onclick="openSearchModal()" class="w-full bg-[#121219] hover:bg-[#1a1a24] border border-gray-700 rounded-xl py-3 px-4 text-white focus:outline-none focus:border-neon-blue transition-all shadow-[inset_0_2px_4px_rgba(0,0,0,0.3)] flex items-center justify-center gap-3">
                <i class="fa-solid fa-magnifying-glass text-neon-blue text-lg"></i>
                <span class="font-bold text-gray-300">Global Search Contract ID</span>
            </button>
        </div>

        <!-- Table Container (PC View) -->
        <div class="hidden md:block w-full overflow-x-auto rounded-xl border border-gray-700/50 shadow-inner bg-[#181822] p-2">
            <table class="w-full text-left border-collapse min-w-[700px]">
                <thead>
                    <tr class="text-neon-blue border-b-2 border-gray-700 bg-[#1c1c28]">
                        <th id="table-role-header" class="p-4 sticky-col font-black text-lg"><i class="fa-solid fa-user-tie mr-2"></i>Name</th>
                        <th class="p-4 text-center font-bold"><i class="fa-regular fa-calendar mr-2"></i>2023</th>
                        <th class="p-4 text-center font-bold"><i class="fa-regular fa-calendar mr-2"></i>2024</th>
                        <th class="p-4 text-center font-bold"><i class="fa-regular fa-calendar mr-2"></i>2025</th>
                        <th class="p-4 text-center font-bold"><i class="fa-regular fa-calendar mr-2"></i>2026</th>
                        <th class="p-4 text-center font-bold"><i class="fa-solid fa-percent mr-2"></i>Upload %</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- Dynamic Data injected here -->
                </tbody>
            </table>
        </div>

        <!-- Mobile Data Container -->
        <div id="mobile-container" class="md:hidden w-full flex flex-col gap-5">
            <!-- Dynamic Data injected here -->
        </div>
    </main>

    <!-- Global Search Modal -->
    <div id="search-modal" class="fixed inset-0 z-[120] hidden items-start justify-center bg-black/90 backdrop-blur-md p-4 pt-10 transition-all">
        <div class="modal-content-3d rounded-2xl w-full max-w-4xl flex flex-col h-[85vh] transform scale-95 transition-transform duration-300" id="search-modal-box">
            <div class="p-5 border-b border-gray-700 flex justify-between items-center bg-gradient-to-r from-gray-800 to-gray-900 rounded-t-2xl">
                <div class="relative w-full max-w-2xl mr-4">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 transform -translate-y-1/2 text-neon-blue"></i>
                    <input type="text" id="global-search-input" oninput="performGlobalSearch()" placeholder="Type Contract ID..." class="w-full bg-[#121219] border border-gray-700 rounded-xl py-3 pl-12 pr-4 text-white focus:outline-none focus:border-neon-blue focus:ring-1 focus:ring-neon-blue transition-all shadow-[inset_0_2px_4px_rgba(0,0,0,0.3)] text-lg font-bold">
                </div>
                <button onclick="closeSearchModal()" class="text-gray-400 hover:text-neon-pink transition-colors text-2xl shrink-0">
                    <i class="fa-solid fa-circle-xmark"></i>
                </button>
            </div>
            <div class="p-6 flex-1 overflow-y-auto bg-[#1a1a24] rounded-b-2xl custom-scrollbar" id="search-results">
                <!-- Results injected here -->
                <div class="text-center text-gray-500 mt-10">
                    <i class="fa-solid fa-keyboard text-5xl mb-3 opacity-20"></i>
                    <p class="font-bold">Type to search across all tabs</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Details Modal (Pending Files) -->
    <div id="modal" class="fixed inset-0 z-[100] hidden items-center justify-center bg-black/80 backdrop-blur-md p-4 transition-all">
        <div class="modal-content-3d rounded-2xl w-full max-w-4xl overflow-hidden transform scale-95 transition-transform duration-300 flex flex-col" id="modal-box">
            <div class="bg-gradient-to-r from-gray-800 to-gray-900 p-5 border-b border-gray-700 flex justify-between items-center">
                <h3 id="modal-title" class="text-xl font-bold text-white flex items-center gap-3">
                    <!-- Title injected here -->
                </h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-neon-pink transition-colors text-2xl">
                    <i class="fa-solid fa-circle-xmark"></i>
                </button>
            </div>
            <div class="p-6 max-h-[75vh] overflow-y-auto" id="modal-body">
                <!-- Contract items generated here -->
            </div>
            <div class="p-4 bg-gray-900 border-t border-gray-800 text-center">
                <button onclick="closeModal()" class="btn-3d px-8 py-2 text-white font-bold text-sm mx-auto">Close Panel</button>
            </div>
        </div>
    </div>

    <!-- Upload/Action Modal (Dynamic Content Injection) -->
    <div id="upload-modal" class="fixed inset-0 z-[130] hidden items-center justify-center bg-black/90 backdrop-blur-md p-4 transition-all">
        <div class="modal-content-3d rounded-2xl w-full max-w-lg overflow-hidden transform scale-95 transition-transform duration-300 flex flex-col" id="upload-modal-box">
            <div class="bg-gradient-to-r from-gray-800 to-gray-900 p-5 border-b border-gray-700 flex justify-between items-center">
                <h3 class="text-xl font-bold text-white flex items-center gap-3" id="upload-modal-title">
                    <!-- Injected dynamically -->
                </h3>
                <button onclick="closeUploadModal()" class="text-gray-400 hover:text-neon-pink transition-colors text-2xl" id="btn-close-upload">
                    <i class="fa-solid fa-circle-xmark"></i>
                </button>
            </div>
            <div class="p-6 bg-[#1a1a24] flex flex-col gap-4" id="upload-modal-body">
                <!-- Injected dynamically -->
            </div>
            <div class="p-4 bg-gray-900 border-t border-gray-800 flex gap-3" id="upload-modal-footer">
                <!-- Injected dynamically -->
            </div>
        </div>
    </div>

    <script>
        // =========================================================================
        // FAST API CONFIGURATION (via Google Apps Script Web App)
        // No Private Keys Exposed.
        // =========================================================================
        const API_URL = 'https://script.google.com/macros/s/AKfycbyEzusTIK4YXUYYy-_AiebjRF7Ecd4pQ8xmFN_X6L3eaKBRlicHC0VNP1VvRHD6L1K-ZA/exec';

        // Global State
        window.appData = {
            'MOBILIZATION': { PE: {}, PI: {}, RE: {}, QE: {} },
            'ON-GOING':   { PE: {}, PI: {}, RE: {}, QE: {} },
            'COMPLETION': { PE: {}, PI: {}, RE: {}, QE: {} },
            'ACCEPTANCE': { PE: {}, PI: {}, RE: {}, QE: {} },
            'GEOTAGGING': { PE: {}, PI: {}, RE: {}, QE: {} },
            'PCMA':       { PE: {}, PI: {}, RE: {}, QE: {} }
        };
        let currentRole = 'PE';
        let currentDocType = 'MOBILIZATION'; 
        window.globalHeaders = [];
        window.globalContractSearch = [];

        // -------------------------------------------------------------
        // API HELPER FUNCTIONS (Fast text/plain CORS bypass)
        // -------------------------------------------------------------
        async function apiCall(payload) {
            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' } 
                });
                const data = await res.json();
                if (!data.ok && data.error) throw new Error(data.error);
                return data;
            } catch (e) {
                throw new Error("API Error: " + e.message);
            }
        }

        function getBase64(file) { 
            return new Promise((resolve, reject) => { 
                const reader = new FileReader(); 
                reader.readAsDataURL(file); 
                reader.onload = () => resolve(reader.result); 
                reader.onerror = error => reject(error); 
            }); 
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchData();
        });

        // -------------------------------------------------------------
        // DATA FETCHING
        // -------------------------------------------------------------
        async function fetchData() {
            try {
                document.getElementById('loader-text').innerText = "Downloading Sheet Data from Backend...";
                
                const resData = await apiCall({ action: 'fetchData' });
                const rawData = resData.data;

                if (!rawData || rawData.length < 3) {
                    showError("Not enough data found in the spreadsheet (requires at least a header on Row 3).");
                    return;
                }

                // Row 3 is Index 2 in the array
                const headersArray = rawData[2]; 
                window.globalHeaders = headersArray; 
                const rowsArray = [];

                // Data starts from Row 4 (Index 3)
                for (let i = 3; i < rawData.length; i++) {
                    const rowVals = rawData[i];
                    while (rowVals.length < headersArray.length) {
                        rowVals.push('');
                    }
                    const isBlank = rowVals.every(v => String(v || "").trim() === "");
                    if (isBlank) continue;

                    rowsArray.push({
                        rowNumber: i + 1, // Real row number in sheets
                        values: rowVals
                    });
                }

                processData(headersArray, rowsArray);
                
            } catch (error) {
                showError(error.message);
                console.error(error);
            }
        }

        function showError(msg) {
            document.getElementById('loader-text').innerHTML = `<span class="text-red-400 font-bold"><i class="fa-solid fa-triangle-exclamation"></i> ${msg}</span>`;
            document.querySelector('.loading-pulse')?.classList.remove('loading-pulse');
            document.querySelector('.fa-cube')?.classList.replace('fa-cube', 'fa-skull-crossbones');
            document.querySelector('.fa-skull-crossbones')?.classList.add('text-red-500');
        }

        // -------------------------------------------------------------
        // DATA PROCESSING (MAPPING TABS TO COLUMNS)
        // -------------------------------------------------------------
        function processData(headersArray, rowsArray) {
            const headers = headersArray.map(h => (h || '').toString().trim().toUpperCase());
            const findCol = (aliases) => headers.findIndex(h => aliases.some(a => h === a || h.startsWith(a + ' ')));

            // Fixed Columns
            const cols = {
                PE: findCol(['PE', 'PROJECT ENGINEER']),
                PI: findCol(['PI', 'PROJECT INSPECTOR']),
                RE: findCol(['RE', 'RESIDENT ENGINEER']),
                QE: findCol(['QE', 'QUANTITY ENGINEER', 'QUALITY ENGINEER']), 
                RE_QE: findCol(['RE & QE', 'RE/QE', 'RE / QE']), 
                YEAR: findCol(['YEAR']),
                CONTRACT: findCol(['CONTRACT ID', 'CONTRACT_ID', 'CONTRACT'])
            };

            // Dynamic finding of ALL Months for PCMA tracking
            window.rowCache = {}; 
            window.globalContractSearch = []; 
            const monthHeaders = [];
            const monthNames = ['JANUARY', 'FEBRUARY', 'MARCH', 'APRIL', 'MAY', 'JUNE', 'JULY', 'AUGUST', 'SEPTEMBER', 'OCTOBER', 'NOVEMBER', 'DECEMBER', 'JAN', 'FEB', 'MAR', 'APR', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
            const monthRegex = new RegExp(`^20(\\d{2})\\s+(${monthNames.join('|')})$`, 'i');

            headers.forEach((h, i) => {
                const match = h.match(monthRegex);
                if (match && !h.includes('PCMA') && !h.includes('REMARKS')) {
                    const year = match[1]; 
                    const monthFull = match[2].toUpperCase(); 
                    const monthShort = monthFull.substring(0, 3); 

                    const actualCol = i;
                    const pcmaCol = headers.findIndex(x => x === `${h} PCMA`);
                    const remarksCol = headers.findIndex(x => x === `${year} ${monthShort} REMARKS`);

                    // Generate a sortable integer
                    const d = new Date(Date.parse(monthFull + " 1, 2012"));
                    const monthIndex = !isNaN(d.getMonth()) ? d.getMonth() : 0;
                    const sortKey = parseInt(`20${year}${String(monthIndex).padStart(2, '0')}`);

                    monthHeaders.push({
                        label: h,
                        sortKey: sortKey,
                        actualCol: actualCol,
                        pcmaCol: pcmaCol,
                        remarksCol: remarksCol,
                        actualHeader: h,
                        pcmaHeader: pcmaCol !== -1 ? headersArray[pcmaCol] : null,
                        remarksHeader: remarksCol !== -1 ? headersArray[remarksCol] : null
                    });
                }
            });

            // Sort months from latest to oldest
            monthHeaders.sort((a, b) => b.sortKey - a.sortKey);

            // Mapping requested categories
            const docCategories = {
                'MOBILIZATION': ['MOBILIZATION', 'SI', 'MINUTES', 'AS-STAKED PLAN'],
                'ON-GOING': [
                    'ON-GOING', 
                    ...Array.from({length: 5}, (_, i) => `VO${i+1}`),
                    ...Array.from({length: 4}, (_, i) => `WSO${i+1}`),
                    ...Array.from({length: 4}, (_, i) => `CWSO${i+1}`),
                    ...Array.from({length: 4}, (_, i) => `WRO${i+1}`),
                    ...Array.from({length: 20}, (_, i) => `CTE${i+1}`),
                    'REVISED PLAN'
                ],
                'COMPLETION': ['COMPLETED', 'TURN-OVER', 'FCIR', 'COC', '95% PUNCHLIST', 'AS-BUILT PLAN'],
                'ACCEPTANCE': ['CFA PUNCHLIST', 'FAIR', 'CFA'],
                'GEOTAGGING': ['GEOTAGGED MOB', 'GEOTAGGED ON-GOING', 'GEOTAGGED COMPLETED'],
                'PCMA': ['ACTUAL', 'PCMA']
            };

            const docsToTrack = [];
            
            Object.keys(docCategories).forEach(cat => {
                docCategories[cat].forEach(docName => {
                    const variants = [docName, `${docName} `, docName.replace(/-/g, '')];
                    const upVariants = [`${docName} UPLOADED`, `${docName} UP`, `${docName}UPLOADED`];
                    
                    docsToTrack.push({
                        type: cat,
                        name: docName,
                        doc: findCol(variants),
                        up: findCol(upVariants)
                    });
                });
            });

            const yearsTracked = ['2023', '2024', '2025', '2026'];

            for(let i = 0; i < rowsArray.length; i++) {
                const rowObj = rowsArray[i];
                const row = rowObj.values;
                const rowNumber = rowObj.rowNumber;

                if(cols.YEAR === -1 || !row[cols.YEAR]) continue;

                let rowYear = (row[cols.YEAR] || '').toString().trim();
                if(!yearsTracked.includes(rowYear)) continue;

                let missingDocsMap = {
                    'MOBILIZATION': [], 'ON-GOING': [], 'COMPLETION': [], 
                    'ACCEPTANCE': [], 'GEOTAGGING': [], 'PCMA': []
                };
                let statsMap = {
                    'MOBILIZATION': { total: 0, uploaded: 0 },
                    'ON-GOING':     { total: 0, uploaded: 0 },
                    'COMPLETION':   { total: 0, uploaded: 0 },
                    'ACCEPTANCE':   { total: 0, uploaded: 0 },
                    'GEOTAGGING':   { total: 0, uploaded: 0 },
                    'PCMA':         { total: 0, uploaded: 0 }
                };
                
                docsToTrack.forEach(v => {
                    if(v.doc !== -1) {
                        let hasDoc = row[v.doc] && row[v.doc].toString().trim() !== '';
                        let isUploaded = v.up !== -1 && row[v.up] && row[v.up].toString().trim() !== '';
                        if(hasDoc) {
                            statsMap[v.type].total++;
                            if(isUploaded) {
                                statsMap[v.type].uploaded++;
                            } else {
                                missingDocsMap[v.type].push(v.name);
                            }
                        }
                    }
                });

                const contractId = cols.CONTRACT !== -1 && row[cols.CONTRACT] ? row[cols.CONTRACT].toString().trim() : 'Unknown';

                // PCMA Tracking logic
                window.rowCache[rowNumber] = {
                    contractId: contractId,
                    pcmaData: monthHeaders.map(mh => ({
                        label: mh.label,
                        actual: mh.actualCol !== -1 ? String(row[mh.actualCol] || '').trim() : '',
                        pcma: mh.pcmaCol !== -1 ? String(row[mh.pcmaCol] || '').trim() : '',
                        remarks: mh.remarksCol !== -1 ? String(row[mh.remarksCol] || '').trim() : '',
                        actualHeader: mh.actualHeader,
                        pcmaHeader: mh.pcmaHeader,
                        remarksHeader: mh.remarksHeader
                    }))
                };

                if (monthHeaders.length > 0) {
                    const latest = monthHeaders[0];
                    const hasActual = latest.actualCol !== -1 && String(row[latest.actualCol]).trim() !== '';
                    const hasPcmaVal = latest.pcmaCol !== -1 && String(row[latest.pcmaCol]).trim() !== '';
                    
                    statsMap['PCMA'].total++;
                    if (hasActual && hasPcmaVal) {
                        statsMap['PCMA'].uploaded++;
                    } else {
                        missingDocsMap['PCMA'].push('PCMA Updates');
                    }
                }

                // Register for Global Search
                const totalMissing = Object.values(missingDocsMap).reduce((sum, arr) => sum + arr.length, 0);
                if (totalMissing > 0 && contractId !== 'Unknown') {
                    window.globalContractSearch.push({
                        contractId: contractId,
                        rowNumber: rowNumber,
                        year: rowYear,
                        missing: missingDocsMap
                    });
                }

                const assignToRole = (roleKey, rawNames) => {
                    if(!rawNames || typeof rawNames !== 'string' || rawNames.trim() === '') return;
                    const names = rawNames.split(/\s+and\s+|[\/&,]/i).map(n => n.trim()).filter(n => n !== '');
                    const uniqueNames = [...new Set(names)];
                    
                    uniqueNames.forEach(name => {
                        Object.keys(statsMap).forEach(catType => {
                            if(!window.appData[catType][roleKey][name]) {
                                window.appData[catType][roleKey][name] = { 
                                    '2023':[], '2024':[], '2025':[], '2026':[], 
                                    totalDocs: 0, uploadedDocs: 0 
                                };
                            }
                            
                            window.appData[catType][roleKey][name].totalDocs += statsMap[catType].total;
                            window.appData[catType][roleKey][name].uploadedDocs += statsMap[catType].uploaded;
                            
                            if(missingDocsMap[catType].length > 0) {
                                window.appData[catType][roleKey][name][rowYear].push({ 
                                    contractId: contractId, 
                                    rowNumber: rowNumber,
                                    missingDocs: missingDocsMap[catType] 
                                });
                            }
                        });
                    });
                };

                if(cols.PE !== -1) assignToRole('PE', row[cols.PE]);
                if(cols.PI !== -1) assignToRole('PI', row[cols.PI]);
                if(cols.RE !== -1) assignToRole('RE', row[cols.RE]);
                if(cols.QE !== -1) assignToRole('QE', row[cols.QE]);
                
                if(cols.RE_QE !== -1) {
                    assignToRole('RE', row[cols.RE_QE]);
                    assignToRole('QE', row[cols.RE_QE]);
                }
            }

            document.getElementById('loader').classList.add('hidden');
            renderTable();
        }

            document.getElementById('upload-modal-box').classList.remove('scale-100');
            document.getElementById('upload-modal-box').classList.add('scale-95');
            setTimeout(() => { 
                document.getElementById('upload-modal').classList.add('hidden'); 
                document.getElementById('upload-modal').classList.remove('flex'); 
            }, 200);
        }

        function setUploadStatus(msg, type) {
            const el = document.getElementById('up-status');
            el.classList.remove('hidden', 'text-neon-blue', 'border-neon-blue', 'text-neon-green', 'border-neon-green', 'text-neon-pink', 'border-neon-pink', 'bg-[#00f3ff]/10', 'bg-[#00ff88]/10', 'bg-[#ff0055]/10');
            if(type === 'loading') el.classList.add('text-neon-blue', 'border-neon-blue', 'bg-[#00f3ff]/10');
            else if(type === 'success') el.classList.add('text-neon-green', 'border-neon-green', 'bg-[#00ff88]/10');
            else if(type === 'error') el.classList.add('text-neon-pink', 'border-neon-pink', 'bg-[#ff0055]/10');
            el.innerHTML = msg;
        }

        async function executeUpload() {
            if(!currentUploadContext) return;

            const { contractId, docName, rowNumber } = currentUploadContext;
            const uploaderName = document.getElementById('up-name').value.trim();
            const fileInput = document.getElementById('up-file');
            
            if(!uploaderName) {
                setUploadStatus('<i class="fa-solid fa-triangle-exclamation"></i> Please enter uploader name.', 'error');
                return;
            }
            if(!fileInput.files || fileInput.files.length === 0) {
                setUploadStatus('<i class="fa-solid fa-triangle-exclamation"></i> Please select a file.', 'error');
                return;
            }

            const file = fileInput.files[0];
            const newFilename = `${contractId} - ${docName}`;

            document.getElementById('btn-execute-upload').disabled = true;
            document.getElementById('btn-cancel-upload').disabled = true;
            document.getElementById('btn-close-upload').disabled = true;

            setUploadStatus('<i class="fa-solid fa-spinner fa-spin"></i> Reading file...', 'loading');

            try {
                const b64 = await getBase64(file);
                
                setUploadStatus('<i class="fa-solid fa-spinner fa-spin"></i> Sending securely to backend...', 'loading');
                
                await apiCall({
                    action: 'uploadFile',
                    contractId: contractId,
                    docName: docName,
                    uploaderName: uploaderName,
                    rowNumber: rowNumber,
                    filename: newFilename,
                    mimeType: file.type,
                    base64Data: b64.split(',')[1]
                });

                setUploadStatus('<i class="fa-solid fa-circle-check"></i> Upload Successful! Refreshing Data...', 'success');
                
                setTimeout(() => {
                    closeUploadModal();
                    closeModal();
                    document.getElementById('loader').classList.remove('hidden');
                    fetchData(); 
                }, 1500);

            } catch (err) {
                setUploadStatus(`<i class="fa-solid fa-circle-xmark"></i> Error: ${err.message}`, 'error');
            } finally {
                document.getElementById('btn-execute-upload').disabled = false;
                document.getElementById('btn-cancel-upload').disabled = false;
                document.getElementById('btn-close-upload').disabled = false;
            }
        }

    </script>
</body>
</html>
