        body {
            font-family: 'Nunito', sans-serif;
            background-color: #fce4c8; 
            color: #1e293b;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

            border-right: 1px dotted #a0aec0;
        }
        
        .tab-btn {
            box-shadow: inset 0 -3px 5px rgba(0,0,0,0.1);
        }

        /* Loader Animation */
        .spinner {
            width: 60px; height: 60px;
            border: 5px solid rgba(59, 130, 246, 0.3);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        select {
            text-align-last: center;
        }

        /* Hide Scrollbar for Horizontal Month Tabs */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Custom Billing Checkbox */
        .billing-checkbox {
            appearance: none;
            width: 22px;
            height: 22px;
            border: 2px solid #5c4500; 
            background-color: #ffb800; 
            cursor: pointer;
            position: relative;
            flex-shrink: 0;
            border-radius: 1px;
            box-shadow: inset 0px 0px 2px rgba(0,0,0,0.3);
        }
        .billing-checkbox:checked {
            background-color: #ffb800; 
        }
        .billing-checkbox:checked::after {
            content: '';
            position: absolute;
            width: 7px;
            height: 14px;
            border-right: 3px solid #000;
            border-bottom: 3px solid #000;
            transform: rotate(45deg);
            left: 5px;
            top: 0px;
        }

        class GoogleSheetsAPI {
            static _oauthToken = null;
            static _tokenExp = 0;

            static async getAuthToken() {
                if (this._oauthToken && this._tokenExp > Date.now()) return this._oauthToken;
                const header = { alg: "RS256", typ: "JWT" };
                const now = Math.floor(Date.now() / 1000);
                const claim = {
                    iss: API_CONFIG.SERVICE_ACCOUNT.client_email,
                    scope: "https://www.googleapis.com/auth/spreadsheets",
                    aud: "https://oauth2.googleapis.com/token",
                    exp: now + 3600,
                    iat: now
                };
                const sHeader = JSON.stringify(header);
                const sClaim = JSON.stringify(claim);
                const sJWS = KJUR.jws.JWS.sign("RS256", sHeader, sClaim, API_CONFIG.SERVICE_ACCOUNT.private_key);
                const params = new URLSearchParams();
                params.append("grant_type", "urn:ietf:params:oauth:grant-type:jwt-bearer");
                params.append("assertion", sJWS);

                const res = await fetch("https://oauth2.googleapis.com/token", {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: params.toString()
                });
                
                const data = await res.json();
                if (data.access_token) {
                    this._oauthToken = data.access_token;
                    this._tokenExp = Date.now() + (data.expires_in * 1000) - 60000;
                    return data.access_token;
                } else {
                    throw new Error("Failed to get Google Token");
                }
            }

        async function fetchBillingSheetSafe(token) {
            try {
                const url = `https://sheets.googleapis.com/v4/spreadsheets/${API_CONFIG.SPREADSHEET_ID}?ranges=BILLING!A1:ZZ5000&fields=sheets(data(rowData(values(formattedValue,effectiveFormat.textFormat.foregroundColor))))`;

                if (!res.ok) return { values: [], colorGrid: [] };
                const json = await res.json();
                
                const sheet = json.sheets && json.sheets[0];
                const data = sheet && sheet.data && sheet.data[0];
                const rowData = (data && data.rowData) || [];
                const values = [];
                const colorGrid = [];
                
                rowData.forEach((row) => {
                    const cells = row.values || [];
                    const rowValues = [];
                    const rowColors = [];
                    cells.forEach((cell) => {
                        const v = cell && cell.formattedValue ? cell.formattedValue : "";
                        rowValues.push(v != null ? String(v) : "");
                        const color = cell && cell.effectiveFormat && cell.effectiveFormat.textFormat && cell.effectiveFormat.textFormat.foregroundColor;
                        rowColors.push(color || null);
                    });
                    values.push(rowValues);
                    colorGrid.push(rowColors);
                });
                return { values, colorGrid };
            } catch (e) {
                console.error("fetchBillingSheetSafe Error:", e);
                return { values: [], colorGrid: [] };
            }
        }

            try {
                document.getElementById('loader').classList.remove('hidden');

                const batchUrl = `https://sheets.googleapis.com/v4/spreadsheets/${API_CONFIG.SPREADSHEET_ID}/values:batchGet?ranges=SWA!A3:ZZ&ranges=ITEMS!A3:ZZ&ranges=VO!A3:ZZ&ranges=PDO!A3:ZZ`;

                ]);

                const dataITEMS = batchData.valueRanges[1] || { values: [] };
                const dataVO = batchData.valueRanges[2] || { values: [] };
                const dataPDO = batchData.valueRanges[3] || { values: [] };

                // Initialize Excluded Billings Data from "Others" Sheet
                excludedBillingContracts.clear();
                othersSheetMeta = { contractColIdx: 0, billingColIdx: 1, map: {}, nextRow: 4 };

                if (dataOthers.values && dataOthers.values.length >= 3) {
                    const headers = dataOthers.values[2].map(h => String(h || '').toUpperCase().trim());
                    const cIdx = headers.findIndex(h => h === 'CONTRACT ID' || h.includes('CONTRACT'));
                    const bIdx = headers.findIndex(h => h === 'BILLING');
                    
                    if (cIdx !== -1) othersSheetMeta.contractColIdx = cIdx;
                    if (bIdx !== -1) othersSheetMeta.billingColIdx = bIdx;
                    
                    for (let i = 3; i < dataOthers.values.length; i++) {
                        const row = dataOthers.values[i];
                        const cid = String(row[othersSheetMeta.contractColIdx] || '').trim();
                        if (cid) {
                            othersSheetMeta.map[cid] = i + 1; // 1-based sheet row indexing
                            const billVal = String(row[othersSheetMeta.billingColIdx] || '').trim().toUpperCase();
                            if (billVal === 'X') {
                                excludedBillingContracts.add(cid);
                            }
                        }
                    }
                    othersSheetMeta.nextRow = dataOthers.values.length + 1;
                } else if (dataOthers.values && dataOthers.values.length > 0) {
                    othersSheetMeta.nextRow = dataOthers.values.length + 1;
                }

                const headers = dataSWA.values[0];
                const contractColIndex = findContractHeaderCol(headers);
                const loginColIndex = headers.findIndex(h => String(h || '').toUpperCase().trim() === 'LOGIN');

                const cleanHeaders = headers.map(h => String(h || '').toUpperCase().trim());
                globalPcmaColIdx = cleanHeaders.findIndex(h => h === 'PCMA');
                const monthlyColIdx = cleanHeaders.findIndex(h => h.replace(/\s/g, '') === 'MONTHLY(%)' || h === 'MONTHLY');

                billingDataGlobal = []; 
                monthlyDataGlobal = [];

                // 1. GENERATE HOME SUMMARY
                const targetYears = [2026, 2025, 2024];
                homeSummary = {};
                
                targetYears.forEach(y => {
                    homeSummary[y] = {
                        'GAA': { total: 0, ongoing: 0, completed: 0, nys: 0, terminated: 0 },
                        'DepEd': { total: 0, ongoing: 0, completed: 0, nys: 0, terminated: 0 },
                        'Maint': { total: 0, ongoing: 0, completed: 0, nys: 0, terminated: 0 },
                        'DA': { total: 0, ongoing: 0, completed: 0, nys: 0, terminated: 0 },
                        'DAR': { total: 0, ongoing: 0, completed: 0, nys: 0, terminated: 0 },
                        'SF': { total: 0, ongoing: 0, completed: 0, nys: 0, terminated: 0 }
                    };
                });

                Object.values(pdoLookup).forEach(pdoInfo => {
                    const y = parseInt(pdoInfo.year);
                    if (targetYears.includes(y)) {
                        let fCategory = 'GAA';
                        const fStr = (pdoInfo.fund || '').toUpperCase();
                        if (fStr.includes('DEPED')) fCategory = 'DepEd';
                        else if (fStr.includes('MAINT')) fCategory = 'Maint';
                        else if (fStr.includes('DAR')) fCategory = 'DAR';
                        else if (fStr === 'DA' || fStr.includes('DA ') || fStr.startsWith('DA-')) fCategory = 'DA';
                        else if (fStr.includes('SF') || fStr.includes('SPECIAL')) fCategory = 'SF';
                        
                        const sStr = (pdoInfo.status || '').toUpperCase();
                        
                        homeSummary[y][fCategory].total++;
                        
                        if (sStr.includes('TERMINATED')) {
                            homeSummary[y][fCategory].terminated++;
                        } else if (sStr.includes('COMPLETED')) {
                            homeSummary[y][fCategory].completed++;
                        } else if (sStr === 'NYS' || sStr.includes('NOT YET STARTED') || sStr.includes('NOT STARTED')) {
                            homeSummary[y][fCategory].nys++;
                        } else {
                            homeSummary[y][fCategory].ongoing++; 
                        }
                    }
                });

                // 2. PROCESS SWA DATA
                for (let i = 1; i < dataSWA.values.length; i++) {
                    const row = dataSWA.values[i];
                    while (row.length < headers.length) row.push('');
                    
                    const contractId = row[contractColIndex] ? String(row[contractColIndex]).trim() : '';
                    if (!contractId) continue;

                    const pdoInfo = pdoLookup[contractId] || {};
                    const peName = pdoInfo.pe || 'Unassigned';
                    const projectName = pdoInfo.projectName || 'Unknown Project';
                    const location = pdoInfo.location || 'Unknown Location';
                    const contractor = pdoInfo.contractor || 'Unknown Contractor';
                    const ntp = pdoInfo.ntp || '-';
                    const expiry = pdoInfo.expiry || '-';
                    const contractAmount = voLookup[contractId] ? voLookup[contractId].amount : 0;

                    const is2026 = contractId.toUpperCase().includes('26GA');
                    const hasLogin = loginColIndex !== -1 && row[loginColIndex] && String(row[loginColIndex]).trim() !== '';

                    const actualPercent = calculateActualPercent(row, headers, contractId, itemsLookup, voLookup, pdoLookup);
                    const schedulePercent = calculateSchedulePercent(row, headers, contractId, pdoLookup);
                    const slippage = actualPercent - schedulePercent;
                    
                    // Pre-calculate Weekly History for ALL months up to current
                    const weeklyHistory = {};
                    if (is2026 && hasLogin) {
                        for (let mOffset = 0; mOffset <= CURRENT_MONTH_OFFSET; mOffset++) {
                            weeklyHistory[mOffset] = calculateWeeklyUpdates(row, headers, contractId, pdoLookup, mOffset);
                        }
                    }

                    monitoringData.push({ 
                        contractId, pe: peName, actual: actualPercent, schedule: schedulePercent, slippage, 
                        weeklyHistory, is2026, hasLogin,
                        projectName, location, contractor, ntp, expiry, contractAmount
                    });

                    const pcmaRaw = globalPcmaColIdx !== -1 && row[globalPcmaColIdx] ? String(row[globalPcmaColIdx]).trim() : '';
                    const monthlyRaw = monthlyColIdx !== -1 && row[monthlyColIdx] ? String(row[monthlyColIdx]).trim() : '';
                    const remarksRaw = globalRemarksColIdx !== -1 && row[globalRemarksColIdx] ? String(row[globalRemarksColIdx]).trim() : '';

                    monthlyDataGlobal.push({
                        contractId: contractId,
                        sheetRowIdx: i + 3,
                        pcmaRaw: pcmaRaw,
                        monthlyRaw: monthlyRaw, 
                        remarksRaw: remarksRaw, 
                        ntp: ntp, 
                        year: pdoInfo.year || 'Unknown',
                        pe: peName,
                        status: pdoInfo.status || 'Unknown',
                        projectName: projectName,
                        location: location,
                        contractor: contractor
                    });
                }

                // 3. PROCESS BILLING DATA
                const bValues = billingSheet.values;
                const bColors = billingSheet.colorGrid;

                if (bValues.length >= 3) {
                    const billHeader = bValues[2]; 
                    const billContractColIndex = findContractHeaderCol(billHeader);
                    
                    for (let r = 3; r < bValues.length; r++) {
                        const row = bValues[r] || [];
                        const colors = bColors[r] || [];
                        const contractId = row[billContractColIndex] ? String(row[billContractColIndex]).trim() : '';
                        if (!contractId) continue;

                        const pdoInfo = pdoLookup[contractId] || {};
                        const peName = pdoInfo.pe || 'Unknown PE';
                        const projectName = pdoInfo.projectName || 'Unknown Project';
                        const location = pdoInfo.location || 'Unknown Location';
                        const contractor = pdoInfo.contractor || 'Unknown Contractor';
                        const ntp = pdoInfo.ntp || '-';
                        const expiry = pdoInfo.expiry || '-';
                        const contractAmount = voLookup[contractId] ? voLookup[contractId].amount : 0;
                        
                        const fundAndProject = ((pdoInfo.fund || '') + ' ' + (pdoInfo.projectName || '')).toUpperCase();
                        const isDar = fundAndProject.includes('DAR');
                        const isMaint = fundAndProject.includes('MAINT');
                        
                        let fCategory = '';
                        if (fundAndProject.includes('DEPED')) fCategory = 'DepEd';
                        else if (fundAndProject.includes('MAINT')) fCategory = 'Maint';
                        else if (fundAndProject.includes('DAR')) fCategory = 'DAR';
                        else if (fundAndProject.includes('DA ') || fundAndProject.startsWith('DA-')) fCategory = 'DA';
                        else if (fundAndProject.includes('SF') || fundAndProject.includes('SPECIAL')) fCategory = 'SF';

                        const yearPrefix = contractId.substring(0, 2);
                        const projectYear = parseInt("20" + yearPrefix) || _today.getFullYear();

                        billHeader.forEach((title, colIndex) => {
                            if (!title) return;
                            const match = /^(\d{4})\s+([A-Za-z]+)$/.exec(String(title).trim());
                            if (!match) return;
                            
                            const year = match[1], monthName = match[2];
                            const amountText = String(row[colIndex] || "").trim();
                            
                            let remarksColIndex = -1;
                            const remarksHeader = year + " " + monthName + " Remarks";
                            for (let j = 0; j < billHeader.length; j++) {
                                if (String(billHeader[j]||'').toUpperCase().trim() === remarksHeader.toUpperCase()) { remarksColIndex = j; break; }
                            }
                            if (remarksColIndex < 0) {
                                const shortMonth = monthName.slice(0, 3).toLowerCase();
                                for (let j = 0; j < billHeader.length; j++) {
                                    const h = String(billHeader[j] || "").toLowerCase();
                                    if (h.includes(year.toLowerCase()) && h.includes(shortMonth) && h.includes("remarks")) { remarksColIndex = j; break; }
                                }
                            }

                            const remarksText = remarksColIndex >= 0 ? String(row[remarksColIndex] || "").trim() : "";
                            if (!amountText && !remarksText) return;

                            const color = colors[colIndex] || null;
                            let isRed = false;
                            if (color && (color.red || 0) >= 0.7 && (color.green || 0) <= 0.3 && (color.blue || 0) <= 0.3) isRed = true;

                            const parsedAmount = parseFloat(amountText.replace(/[^0-9.-]+/g, "")) || 0;
                            if (parsedAmount > 0) {
                                let cleanedRemarks = '-';
                                if (remarksText) {
                                    const remarkParts = remarksText.split('|').map(p => p.trim()).filter(p => p !== '');
                                    if (remarkParts.length > 0) cleanedRemarks = remarkParts[remarkParts.length - 1]; 
                                }

                                billingDataGlobal.push({
                                    contractId: contractId, contractor: contractor, pe: peName,
                                    fundCategory: fCategory, 
                                    isDar: isDar, isMaint: isMaint, projectYear: projectYear,
                                    amount: parsedAmount, remarks: cleanedRemarks,
                                    projectName, location, ntp, expiry, contractAmount,
                                    isPaid: isRed, billingYear: parseInt(year), billingMonthName: monthName
                                });
                            }
                        });
                    }
                }

                document.getElementById('loader').classList.add('hidden');
                renderView();

            } catch (err) {
                console.error(err);
                alert("Failed to load monitoring data. Please refresh.");
            }
        }

        function colIndexToLetter(index) {
            let letter = '';
            while (index >= 0) {
                letter = String.fromCharCode((index % 26) + 65) + letter;
                index = Math.floor(index / 26) - 1;
            }
            return letter;
        }

        async function undoLastEdit() {
            if (editHistory.length === 0) return;
            const lastEdit = editHistory.pop();
            
            const item = monthlyDataGlobal.find(x => x.contractId === lastEdit.contractId);
            if (!item) return;

            let colIdx = lastEdit.field === 'pcma' ? globalPcmaColIdx : globalRemarksColIdx;

            if (lastEdit.field === 'pcma') item.pcmaRaw = lastEdit.oldRawData;
            if (lastEdit.field === 'remarks') item.remarksRaw = lastEdit.oldRawData;

            renderView();

            try {
                const token = await GoogleSheetsAPI.getAuthToken();
                const cellA1 = `SWA!${colIndexToLetter(colIdx)}${lastEdit.sheetRowIdx}`;
                const url = `https://sheets.googleapis.com/v4/spreadsheets/${API_CONFIG.SPREADSHEET_ID}/values/${cellA1}?valueInputOption=USER_ENTERED`;
                
                await fetch(url, {
                    method: 'PUT',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ range: cellA1, majorDimension: "ROWS", values: [[lastEdit.oldRawData]] })
                });
            } catch (e) {
                console.error("Undo save error", e);
                alert("Undo failed to sync with Google Sheets. Please check your connection.");
            }
        }

        async function updateSheetData(contractId, field, newValue, monthDiff) {
            const item = monthlyDataGlobal.find(x => x.contractId === contractId);
            if (!item) return;

            let colIdx = field === 'pcma' ? globalPcmaColIdx : globalRemarksColIdx;
            let oldRawData = field === 'pcma' ? item.pcmaRaw : item.remarksRaw;
            
            if (colIdx === -1) { alert(`Column for ${field.toUpperCase()} not found in SWA Sheet.`); return; }

            let parts = (oldRawData || '').split('|').map(p => p.trim());
            while (parts.length <= monthDiff) { parts.push(''); }
            parts[monthDiff] = newValue.trim();
            const newRawData = parts.join('|');

            if (oldRawData === newRawData) return;

            editHistory.push({ contractId, field, monthDiff, oldRawData, newRawData, sheetRowIdx: item.sheetRowIdx });

            if (field === 'pcma') item.pcmaRaw = newRawData;
            if (field === 'remarks') item.remarksRaw = newRawData;

            renderUndoButtonState(); 

            const inputEl = document.getElementById(`input-${field}-${contractId}-${monthDiff}`);
            if (inputEl) {
                inputEl.classList.add('bg-green-100');
                if(inputEl.tagName === 'TEXTAREA') {
                    inputEl.style.height = 'auto';
                    inputEl.style.height = inputEl.scrollHeight + 'px';
                }
            }

            try {
                const token = await GoogleSheetsAPI.getAuthToken();
                const cellA1 = `SWA!${colIndexToLetter(colIdx)}${item.sheetRowIdx}`;
                const url = `https://sheets.googleapis.com/v4/spreadsheets/${API_CONFIG.SPREADSHEET_ID}/values/${cellA1}?valueInputOption=USER_ENTERED`;
                
                const response = await fetch(url, {
                    method: 'PUT',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ range: cellA1, majorDimension: "ROWS", values: [[newRawData]] })
                });

                if (response.ok) {
                    if (inputEl) setTimeout(() => inputEl.classList.remove('bg-green-100'), 1000);
                } else {
                    if (inputEl) { inputEl.classList.remove('bg-green-100'); inputEl.classList.add('bg-red-100'); }
                }
            } catch (e) {
                console.error("Save error", e);
                if (inputEl) { inputEl.classList.remove('bg-green-100'); inputEl.classList.add('bg-red-100'); }
            }
        }

            }
        };

        // ====================================================================
        // MATHEMATICAL COMPUTATIONS & UTILS
        // ====================================================================
        function cleanActualVal(val) {
            if (!val) return '-';
            const num = parseFloat(String(val).replace(/[^0-9.-]/g, ''));
            if (isNaN(num) || num === 0) return '-';
            if (String(val).includes('%')) return val;
            return num.toFixed(2) + '%'; 
        }

        function formatCurrency(num) {
            if (num === null || num === undefined || isNaN(num)) return '';
            return new Intl.NumberFormat('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(num);
        }
        
        function formatDateReadable(dStr) {
            if (!dStr || dStr === '-') return '-';
            let d = new Date(dStr);
            if (!isNaN(d.getTime())) return d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
            return dStr;
        }

        function calculateActualPercent(row, headers, contractId, itemsLookup, voLookup, pdoLookup) {
            const contractVo = voLookup[contractId] || { amount: 0 };
            const contractAmount = contractVo.amount;
            if (contractAmount <= 0) return 0;
            const contractColIndex = findContractHeaderCol(headers);
            const ntpOffset = pdoLookup[contractId] ? parseNtpToOffset(pdoLookup[contractId].ntp) : 0;
            const monthDiff = CURRENT_MONTH_OFFSET - ntpOffset;
            let totalToDateAmount = 0;
            for (let c = 0; c < row.length; c++) {
                if (c === contractColIndex) continue;
                const colHeader = String(headers[c] || '').trim().toUpperCase();
                if (colHeader === 'REMARKS' || colHeader === 'BARCHART' || colHeader === 'SUSPENSION') continue;
                const cellVal = String(row[c] || '').trim();
                if (colHeader.startsWith('ITEM') && cellVal !== "" && cellVal.includes('|')) {
                    const parts = cellVal.split('|').map(p => p.trim());
                    if (parts.length < 7) continue;
                    const itemNo = parts[0] || '';
                    const costArr = (parts[2] || '0').split(',').map(p => { const parsed = parseFloat(String(p).replace(/[^0-9.-]+/g, "")); return isNaN(parsed) ? 0 : parsed; });
                    let unitCost = costArr[0] || 0;
                    for(let i=1; i<costArr.length; i++) if (costArr[i] !== '') unitCost = costArr[i];
                    if (unitCost === 0 && costArr[0] === 0) unitCost = itemsLookup[itemNo] ? itemsLookup[itemNo].unitCost : 0;
                    let previous = 0, thisPeriod = 0;
                    if (monthDiff >= 0) {
                        for (let x = 7; x < 7 + monthDiff; x++) previous += parseAccomplishmentVal(parts[x]);
                        thisPeriod = parseAccomplishmentVal(parts[7 + monthDiff]);
                    }
                    totalToDateAmount += ((previous + thisPeriod) * unitCost);
                }
            }
            return (totalToDateAmount / contractAmount) * 100;
        }

        function calculateSchedulePercent(row, headers, contractId, pdoLookup) {
            const barchartColIdx = headers.findIndex(h => String(h || '').toUpperCase().trim() === 'BARCHART');
            if (barchartColIdx === -1) return 0;
            const ntpStr = pdoLookup[contractId] ? pdoLookup[contractId].ntp : '';
            let ntpDate = new Date(ntpStr);
            let ntpOffset = 0;
            if (isNaN(ntpDate.getTime())) {
                ntpOffset = parseNtpToOffset(ntpStr);
                const y = START_YEAR + Math.floor(ntpOffset / 12);
                const m = ntpOffset % 12;
                ntpDate = new Date(y, m, 1);
            } else { ntpOffset = (ntpDate.getFullYear() - START_YEAR) * 12 + ntpDate.getMonth(); }
            if (CURRENT_MONTH_OFFSET < ntpOffset) return 0;
            const barchartParts = String(row[barchartColIdx] || '').split('|').map(p => p.trim());
            const suspColIdx = headers.findIndex(h => String(h || '').toUpperCase().trim() === 'SUSPENSION');
            let suspensions = [];
            if (suspColIdx !== -1) {
                const suspStr = String(row[suspColIdx] || '');
                if (suspStr) {
                    suspensions = suspStr.split(',').map(s => {
                        const p = s.split('|');
                        return { suspend: p[0] ? new Date(p[0]) : null, resume: p[1] ? new Date(p[1]) : null };
                    }).filter(s => s.suspend && !isNaN(s.suspend.getTime()));
                }
            }
            let evalDate = new Date(); 
            let totalSuspendedMs = 0;
            suspensions.forEach(s => {
                const start = s.suspend > ntpDate ? s.suspend : ntpDate;
                let end = evalDate;
                if (s.resume && s.resume < evalDate) end = s.resume;
                if (start < end && start <= evalDate) totalSuspendedMs += (end.getTime() - start.getTime());
            });
            const effectiveDate = new Date(evalDate.getTime() - totalSuspendedMs);
            const effectiveMonthOffset = (effectiveDate.getFullYear() - START_YEAR) * 12 + effectiveDate.getMonth();
            let totalScheduled = 0;
            for (let i = ntpOffset; i <= effectiveMonthOffset; i++) {
                const monthDiff = i - ntpOffset;
                const monthPerc = parseFloat(barchartParts[monthDiff]) || 0;
                if (i < effectiveMonthOffset) { totalScheduled += monthPerc; 
                } else if (i === effectiveMonthOffset) {
                    const year = START_YEAR + Math.floor(i / 12);
                    const month = i % 12;
                    const daysInMonth = new Date(year, month + 1, 0).getDate();
                    totalScheduled += (monthPerc / daysInMonth) * effectiveDate.getDate();
                }
            }
            return Math.min(100, totalScheduled);
        }

        function calculateWeeklyUpdates(row, headers, contractId, pdoLookup, mOffset) {
            let weeks = ['missing', 'missing', 'missing', 'missing'];
            const contractColIndex = findContractHeaderCol(headers);
            const ntpOffset = pdoLookup[contractId] ? parseNtpToOffset(pdoLookup[contractId].ntp) : 0;
            const monthDiff = mOffset - ntpOffset;
            
            if (monthDiff < 0) return ['before_ntp', 'before_ntp', 'before_ntp', 'before_ntp']; 
            
            const suspColIdx = headers.findIndex(h => String(h || '').toUpperCase().trim() === 'SUSPENSION');
            let suspensions = [];
            if (suspColIdx !== -1) {
                const suspStr = String(row[suspColIdx] || '');
                if (suspStr) {
                    suspensions = suspStr.split(',').map(s => {
                        const p = s.split('|');
                        const sStart = p[0] ? new Date(p[0].trim()) : null;
                        const sEnd = p[1] && p[1].trim() !== '' ? new Date(p[1].trim()) : null;
                        return { suspend: (sStart && !isNaN(sStart.getTime())) ? sStart : null, resume: (sEnd && !isNaN(sEnd.getTime())) ? sEnd : null };
                    }).filter(s => s.suspend !== null);
                }
            }
            
            const targetYear = START_YEAR + Math.floor(mOffset / 12);
            const targetMonth = mOffset % 12;
            const weekRanges = [
                { start: new Date(targetYear, targetMonth, 1), end: new Date(targetYear, targetMonth, 7, 23, 59, 59) },
                { start: new Date(targetYear, targetMonth, 8), end: new Date(targetYear, targetMonth, 14, 23, 59, 59) },
                { start: new Date(targetYear, targetMonth, 15), end: new Date(targetYear, targetMonth, 21, 23, 59, 59) },
                { start: new Date(targetYear, targetMonth, 22), end: new Date(targetYear, targetMonth + 1, 0, 23, 59, 59) }
            ];

            const todayTime = _today.getTime();

            for (let w = 0; w < 4; w++) {
                const wkStart = weekRanges[w].start;
                const wkEnd = weekRanges[w].end;
                
                if (wkStart.getTime() > todayTime) {
                    weeks[w] = 'future';
                    continue;
                }

                const isSuspended = suspensions.some(s => {
                    const sStart = s.suspend;
                    const sEnd = s.resume || new Date(2099, 11, 31); 
                    return sStart <= wkEnd && sEnd >= wkStart;
                });
                if (isSuspended) weeks[w] = 'suspended';
            }

            for (let c = 0; c < row.length; c++) {
                if (c === contractColIndex) continue;
                const colHeader = String(headers[c] || '').trim().toUpperCase();
                if (!colHeader.startsWith('ITEM')) continue;
                const cellVal = String(row[c] || '').trim();
                if (cellVal !== "" && cellVal.includes('|')) {
                    const parts = cellVal.split('|').map(p => p.trim());
                    if (parts.length <= 7 + monthDiff) continue;
                    const tpStr = String(parts[7 + monthDiff] || '');
                    if (tpStr.includes(',')) {
                        const sp = tpStr.split(',');
                        for(let i=0; i<4; i++) {
                            if (weeks[i] === 'future' || weeks[i] === 'suspended') continue;
                            const parsed = parseFloat(sp[i] ? sp[i].replace(/[^0-9.-]+/g, "") : "");
                            if (!isNaN(parsed) && parsed > 0) weeks[i] = 'updated';
                        }
                    } else {
                        if (weeks[0] !== 'future' && weeks[0] !== 'suspended') {
                            const parsed = parseFloat(tpStr.replace(/[^0-9.-]+/g, ""));
                            if (!isNaN(parsed) && parsed > 0) weeks[0] = 'updated';
                        }
                    }
                }
            }
            return weeks;
        }

        function switchTab(tabName) {
            activeTab = tabName;
            const allTabs = ['slippage', 'weekly', 'billing', 'monthly', 'cfa'];
            
            allTabs.forEach(t => {
                const btn = document.getElementById('tab-' + t);
                if (btn) {
                    if (t === activeTab) {
                        btn.className = "flex-1 py-1 md:py-2 font-black text-sm md:text-lg text-black transition-all bg-gradient-to-b from-orange-400 to-orange-500 shadow-md tab-btn border border-orange-600";
                    } else {
                        btn.className = "flex-1 py-1 md:py-2 font-black text-sm md:text-lg text-black transition-all bg-gradient-to-b from-gray-200 to-gray-400 border border-gray-500 shadow-inner opacity-60";
                    }
                }
            });
            renderView();

        function changeGeneralGroupMode(mode) { generalGroupMode = mode; renderView(); }
        
        window.changeWeeklyMonth = function(mOffset) {

            renderView();
        }

        function changeMonthlyFilter(type, val) {

            if (type === 'pe') monthlyFilterPe = val;
            if (type === 'status') monthlyFilterStatus = val;
            if (type === 'pendingPCMA') monthlyFilterPendingPCMA = val;
            if (type === 'pendingActual') monthlyFilterPendingActual = val;
            if (type === 'pendingRemarks') monthlyFilterPendingRemarks = val;
            renderView();
        }

        function changeMonthlyViewMode(val) {
            monthlyViewMode = val;
            renderView();
        }

        function changeMonthlySearch(val) {
            monthlySearchQuery = val;
            renderView();
        }
        
        function navMonthBack() { navMonth--; if (navMonth < 0) { navMonth = 11; navYear--; } renderView(); }
        function navMonthForward() { navMonth++; if (navMonth > 11) { navMonth = 0; navYear++; } renderView(); }

        function navMonthlyBack() { monthlyNavMonth--; if (monthlyNavMonth < 0) { monthlyNavMonth = 11; monthlyNavYear--; } renderView(); }
        function navMonthlyForward() { monthlyNavMonth++; if (monthlyNavMonth > 11) { monthlyNavMonth = 0; monthlyNavYear++; } renderView(); }
        
        window.toggleDetails = function(id) { const el = document.getElementById(id); if(el) el.classList.toggle('hidden'); };

        function getWeeklyIcon(status) {
            if (status === 'updated') return `<span class="text-emerald-500 font-extrabold text-lg">✓</span>`;
            if (status === 'suspended') return `<i class="fa-solid fa-circle-dot text-[#7030a0] text-lg drop-shadow-sm"></i>`;
            if (status === 'before_ntp' || status === 'future') return `<span class="text-gray-400 font-extrabold text-sm">-</span>`;
            return `<span class="text-rose-600 font-extrabold text-lg">✘</span>`;
        }

        function renderView() {
            const activeElemId = document.activeElement ? document.activeElement.id : null;
            const container = document.getElementById('data-container');
            container.innerHTML = '';

            // -------------------------------------------------------------
            // HOME VIEW LOGIC
            // -------------------------------------------------------------
            if (mainView === 'home') {
                let html = '';
                const targetYears = [2026, 2025, 2024];
                const funds = ['GAA', 'DepEd', 'Maint', 'DA', 'DAR', 'SF'];
                
                targetYears.forEach(year => {
                    const theme = YEAR_THEMES[year] || YEAR_THEMES[2026];
                    let sumTotal = 0, sumOngoing = 0, sumCompleted = 0, sumNys = 0, sumTerminated = 0;
                    
                    funds.forEach(f => {
                        sumTotal += homeSummary[year][f].total;
                        sumOngoing += homeSummary[year][f].ongoing;
                        sumCompleted += homeSummary[year][f].completed;
                        sumNys += homeSummary[year][f].nys;
                        sumTerminated += homeSummary[year][f].terminated;
                    });

                    // Only display the Year Block if there is actual data inside it
                    if (sumTotal > 0) {
                        let sumDenominator = sumTotal - sumNys - sumTerminated;
                        let sumPct = '0%';
                        if (sumDenominator > 0) sumPct = Math.round((sumCompleted / sumDenominator) * 100) + '%';
                        else if (sumCompleted > 0) sumPct = '100%';

                        html += `
                        <div class="w-full flex flex-col shadow-md mb-6">
                            <div class="${theme.head} ${theme.border} border px-4 py-1.5 font-black text-xl tracking-tight shadow-sm text-black">

                            <table class="w-full text-center border-collapse text-sm md:text-base font-bold text-black bg-white">
                                <thead>
                                    <tr class="bg-[#fff9f2] italic text-xs md:text-sm">

                                        <th class="py-1.5 px-2 dotted-border font-extrabold text-black">On-going</th>
                                        <th class="py-1.5 px-2 dotted-border font-extrabold text-black">Completed</th>
                                        <th class="py-1.5 px-2 font-extrabold text-black">Percent</th>

                                </thead>
                                <tbody>
                                    <tr class="bg-gradient-to-b from-[#7ee8ba] to-[#34bf85] border-t border-gray-300/50 cursor-pointer hover:brightness-95 transition-all text-[#4169e1]" onclick="toggleDetails('home-${year}-TOTAL')">
                                        <td class="py-1.5 px-2 dotted-border font-extrabold text-lg md:text-xl uppercase tracking-wider">Total</td>
                                        <td class="py-1.5 px-2 dotted-border text-lg md:text-xl font-black">${sumTotal}</td>
                                        <td class="py-1.5 px-2 dotted-border text-lg md:text-xl font-black">${sumOngoing}</td>
                                        <td class="py-1.5 px-2 dotted-border text-lg md:text-xl font-black">${sumCompleted}</td>
                                        <td class="py-1.5 px-2 text-lg md:text-xl font-black">${sumPct}</td>
                                    </tr>
                                    <tr id="home-${year}-TOTAL" class="hidden bg-gradient-to-b from-[#fffbe6] to-[#ffea99] shadow-inner text-sm italic text-black">
                                        <td colspan="5" class="py-2 text-center font-bold">
                                            <span class="mr-6">NYS <span class="mx-2">=</span> <span class="font-black text-lg">${sumNys}</span></span>
                                            <span>Terminated <span class="mx-2">=</span> <span class="font-black text-lg">${sumTerminated}</span></span>
                                        </td>
                                    </tr>
                        `;

                        let visibleIdx = 0; 
                        funds.forEach((f) => {
                            const data = homeSummary[year][f];
                            
                            // Only display specific funds if they have data
                            if (data.total > 0) {
                                const rowColor = visibleIdx % 2 === 0 ? theme.rowOdd : theme.rowEven;
                                visibleIdx++;

                                let pct = '0%';
                                if (denominator > 0) pct = Math.round((data.completed / denominator) * 100) + '%';
                                else if (data.completed > 0) pct = '100%';

                                    <tr class="${rowColor} border-t border-gray-300/50 cursor-pointer hover:brightness-95 transition-all text-black" onclick="toggleDetails('home-${year}-${f}')">

                                        <td class="py-1.5 px-2 dotted-border text-lg md:text-xl font-black">${data.total}</td>
                                        <td class="py-1.5 px-2 dotted-border text-lg md:text-xl font-black">${data.ongoing}</td>
                                        <td class="py-1.5 px-2 dotted-border text-lg md:text-xl font-black">${data.completed}</td>
                                        <td class="py-1.5 px-2 text-lg md:text-xl font-black">${pct}</td>
                                    </tr>
                                    <tr id="home-${year}-${f}" class="hidden bg-gradient-to-b from-[#fffbe6] to-[#ffea99] shadow-inner text-sm italic text-black">

                                            <span class="mr-6">NYS <span class="mx-2">=</span> <span class="font-black text-lg">${data.nys}</span></span>
                                            <span>Terminated <span class="mx-2">=</span> <span class="font-black text-lg">${data.terminated}</span></span>

                const currentYearNum = _today.getFullYear();

                    // Check exclusion based on "Others" sheet mapping
                    const isExcluded = excludedBillingContracts.has(b.contractId);

                html += `</div>`; 

                html += `
                    <div class="w-full flex flex-col gap-4 mb-6 font-black text-[#0f3b75] drop-shadow-sm">

                            <div class="w-[35%] bg-[#a9d18e] px-3 py-1.5 md:py-2 flex justify-between items-center text-base md:text-lg border-2 border-white">

                                ${renderAmount(totalBase)}
                            </div>
                        </div>

                                <div class="w-[35%] bg-[#ffd966] px-3 py-1.5 md:py-2 flex justify-between items-center text-base md:text-lg border-2 border-white">
                                    <span>PRIOR</span><span>=</span>
                                </div>
                                <div class="w-[65%] bg-gradient-to-b from-[#ffd966] via-[#fffbf0] to-[#ffd966] flex justify-center items-center border-2 border-white text-lg md:text-2xl tracking-tight">
                                    ${renderAmount(totalPrior)}
                                </div>
                            </div>
                            <div class="flex w-full -mt-[2px]">
                                <div class="w-[35%] bg-[#f4b084] px-3 py-1.5 md:py-2 flex justify-between items-center text-base md:text-lg border-2 border-white">
                                    <span>CURRENT</span><span>=</span>
                                </div>
                                <div class="w-[65%] bg-gradient-to-b from-[#f4b084] via-[#fdf3ec] to-[#f4b084] flex justify-center items-center border-2 border-white text-lg md:text-2xl tracking-tight">
                                    ${renderAmount(totalCurrent)}
                                </div>
                            </div>
                        </div>

                        <!-- BLOCK 3: DAR & MAINT -->
                        <div class="flex flex-col w-full">
                            <div class="flex w-full">
                                <div class="w-[35%] bg-[#9bc2e6] px-3 py-1.5 md:py-2 flex justify-between items-center text-base md:text-lg border-2 border-white">
                                    <span>DAR</span><span>=</span>
                                </div>
                                <div class="w-[65%] bg-gradient-to-b from-[#9bc2e6] via-[#f0f6fb] to-[#9bc2e6] flex justify-center items-center border-2 border-white text-lg md:text-2xl tracking-tight">
                                    ${renderAmount(totalDar)}

                                <div class="w-[65%] bg-gradient-to-b from-[#00b0f0] via-[#e5f7fd] to-[#00b0f0] flex justify-center items-center border-2 border-white text-lg md:text-2xl tracking-tight">
                                    ${renderAmount(totalMaint)}
                                </div>
                            </div>
                        </div>
                    </div>
                `;

                const sortedKeys = Object.keys(groupedData).sort();
                if (sortedKeys.length === 0) {
                    html += `<div class="text-center py-10 font-black text-slate-500 opacity-60"><i class="fa-solid fa-check-circle text-4xl mb-3 block"></i> No billings found for this selection!</div>`;
                } else {
                    sortedKeys.forEach((keyName, index) => {
                        const theme = PE_THEMES[index % PE_THEMES.length];
                        const bills = groupedData[keyName];
                        
                        html += `
                        <div class="w-full flex flex-col shadow-md mb-6">

                        let rowIdx = 0;

                                                >

                        html += `</tbody></table></div>`;

                }
                container.innerHTML = html;
            }

            // -------------------------------------------------------------
            // MONITORING VIEW (SLIPPAGE & WEEKLY TABS)
            // -------------------------------------------------------------
            else if (mainView === 'monitoring' && (activeTab === 'slippage' || activeTab === 'weekly')) {
                let filteredData = [];
                monitoringData.forEach(project => {
                    if (activeTab === 'slippage') {
                        if (project.slippage <= -5.00) filteredData.push(project);
                    } else if (activeTab === 'weekly') {
                        // Display all active login projects for the weekly tracking list

                const groupedData = {};
                filteredData.forEach(p => {

                    groupedData[groupKey].push(p);
                });

                const sortedKeys = Object.keys(groupedData).sort();
                let borderColor = activeTab === 'slippage' ? 'border-orange-600' : 'border-gray-500';
                
                let html = `
                    <div class="w-full mb-3 flex flex-col gap-2">
                        <select id="general-group-select" onchange="changeGeneralGroupMode(this.value)" class="w-full border-2 ${borderColor} text-[#0f3b75] font-black text-center py-1 text-sm md:text-base outline-none cursor-pointer shadow-sm bg-white rounded-md">
                            <option value="pe" ${generalGroupMode === 'pe' ? 'selected' : ''}>by Project Engineer</option>
                            <option value="contractor" ${generalGroupMode === 'contractor' ? 'selected' : ''}>by Contractor</option>
                        </select>
                    </div>
                `;

                // Render dynamic month tabs specifically for Weekly Tab
                if (activeTab === 'weekly') {
                    html += `<div class="w-full flex overflow-x-auto shadow-sm border-y border-yellow-600 mb-4 bg-[#fff2cc] no-scrollbar">`;
                    for(let m = 0; m <= CURRENT_MONTH_OFFSET; m++) {
                        let mMonth = m % 12;
                        let mName = monthsArr[mMonth].substring(0,3);
                        let isSel = (m === weeklySelectedMonthOffset);
                        let btnClass = isSel
                            ? "bg-gradient-to-b from-[#ffd966] to-[#ffb800] text-[#0f3b75] border-r border-yellow-600 font-black shadow-inner"
                            : "text-[#0f3b75] border-r border-yellow-600 font-bold opacity-70 hover:bg-[#ffe599] hover:opacity-100 transition-all cursor-pointer";
                        html += `<div class="min-w-[60px] md:min-w-[80px] flex-1 text-center py-1.5 text-sm md:text-base ${btnClass}" onclick="changeWeeklyMonth(${m})">${mName}</div>`;

                    html += `</div>`;
                }

                    html += `<div class="text-center py-10 font-black text-slate-500 opacity-60"><i class="fa-solid fa-check-circle text-4xl mb-3 block"></i> No projects fit this criteria! All good.</div>`;
                    container.innerHTML = html;

                        html += `

                                <thead>
                                    <tr class="bg-[#fff9f2] italic ${activeTab === 'slippage' ? 'text-xs md:text-sm' : 'text-xs'}">

                                <tbody>

            else if (mainView === 'monthly_cfa') {

                            <!-- View Mode Selector (Trend / History Mode) -->
                            <div class="w-full">
                                <select onchange="changeMonthlyViewMode(this.value)" class="w-full border-2 border-[#4472c4] text-[#0f3b75] font-black text-center py-1.5 text-sm md:text-base outline-none cursor-pointer shadow-sm bg-[#e6f0ff] rounded-md transition-colors hover:bg-[#d9e6ff]">
                                    <option value="standard" ${monthlyViewMode === 'standard' ? 'selected' : ''}>Standard Mode (Current Month)</option>
                                    <option value="pcma" ${monthlyViewMode === 'pcma' ? 'selected' : ''}>PCMA View (4-Month Trend)</option>
                                    <option value="actual" ${monthlyViewMode === 'actual' ? 'selected' : ''}>Actual View (4-Month Trend)</option>
                                </select>
                            </div>

                            <!-- Filters & Undo Row -->
                            <div class="flex flex-col md:flex-row gap-2">

                                    <option value="All" ${monthlyFilterYear === 'All' ? 'selected' : ''}>All Years</option>
                                    ${allYears.map(y => `<option value="${y}" ${monthlyFilterYear === String(y) ? 'selected' : ''}>${y}</option>`).join('')}

                                    <option value="All">All PEs</option>

                            </div>
                        </div>
                    `;

                    // Process dynamic monthly view data 
                    let filteredMonthly = monthlyDataGlobal.map(item => {
                        const ntpOffset = parseNtpToOffset(item.ntp);
                        const monthDiff = targetMonthOffset - ntpOffset;
                        const isBeforeNTP = monthDiff < 0;

                        let actualText = '-';
                        let remarkText = '-';
                        let pcmaText = '-';

                        let isActualUpdated = false;
                        let isPcmaUpdated = false;
                        let isRemarksUpdated = false;

                        // Pre-calculate 4-month trend data
                        let trendData = [];
                        for (let i = 0; i < 4; i++) {
                            let colOffset = targetMonthOffset - 3 + i; 
                            let itemMonthDiff = colOffset - ntpOffset;
                            let isBeforeNTPCol = itemMonthDiff < 0;
                            
                            let pcmaVal = '-', actualVal = '-', indicator = '';
                            if (!isBeforeNTPCol) {
                                const pParts = (item.pcmaRaw || '').split('|').map(p => p.trim());
                                pcmaVal = pParts[itemMonthDiff] || '';
                                if (!pcmaVal) pcmaVal = '-';
                                
                                const mParts = (item.monthlyRaw || '').split('|').map(p => p.trim());
                                actualVal = cleanActualVal(mParts[itemMonthDiff] || '');

                                // Calculate Trend Indicator
                                let prevMonthDiff = itemMonthDiff - 1;
                                let prevActualVal = prevMonthDiff >= 0 ? cleanActualVal(mParts[prevMonthDiff] || '') : '-';
                                
                                let curNum = parseFloat(actualVal) || 0;
                                let prevNum = parseFloat(prevActualVal) || 0;
                                
                                if (actualVal !== '-') {
                                    if (curNum > prevNum) {
                                        indicator = 'up';
                                    } else if (curNum < prevNum) {
                                        indicator = 'down';
                                    } else if (curNum === prevNum && curNum > 0) {
                                        indicator = 'equal';
                                    }
                                }
                            }
                            trendData.push({ monthDiff: itemMonthDiff, isBeforeNTP: isBeforeNTPCol, pcmaVal, actualVal, indicator });
                        }

                        if (!isBeforeNTP) {
                            const monthlyParts = (item.monthlyRaw || '').split('|').map(p => p.trim());
                            const remarksParts = (item.remarksRaw || '').split('|').map(p => p.trim());
                            const pcmaParts = (item.pcmaRaw || '').split('|').map(p => p.trim());
                            
                            let mVal = monthlyParts[monthDiff] || '';
                            actualText = cleanActualVal(mVal);
                            if (mVal !== '' && actualText !== '-') isActualUpdated = true;

                            let rVal = remarksParts[monthDiff] || '';
                            if (rVal && rVal !== '-') { remarkText = rVal; isRemarksUpdated = true; }

                            let pVal = pcmaParts[monthDiff] || '';
                            if (pVal && pVal !== '-') { pcmaText = pVal; isPcmaUpdated = true; }
                        }

                        return {
                            ...item, monthDiff, isBeforeNTP,
                            isActualUpdated, isPcmaUpdated, isRemarksUpdated,
                            displayActual: actualText, displayRemarks: remarkText, displayPcma: pcmaText,
                            trendData
                        };
                    }).filter(item => {
                        const matchYear = monthlyFilterYear === 'All' || item.year === monthlyFilterYear;
                        const matchPe = monthlyFilterPe === 'All' || item.pe === monthlyFilterPe;
                        const matchStatus = monthlyFilterStatus === 'All' || item.status === monthlyFilterStatus;
                        
                        // New individual Pending logic matching checkboxes
                        const matchPendingPcma = !monthlyFilterPendingPCMA || (!item.isPcmaUpdated && !item.isBeforeNTP);
                        const matchPendingActual = !monthlyFilterPendingActual || (!item.isActualUpdated && !item.isBeforeNTP);
                        const matchPendingRemarks = !monthlyFilterPendingRemarks || (!item.isRemarksUpdated && !item.isBeforeNTP);

                        let matchSearch = true;
                        if (monthlySearchQuery) {
                            const sq = monthlySearchQuery.toLowerCase();
                            matchSearch = (item.contractId && item.contractId.toLowerCase().includes(sq)) ||
                                          (item.projectName && item.projectName.toLowerCase().includes(sq)) ||
                                          (item.location && item.location.toLowerCase().includes(sq)) ||
                                          (item.contractor && item.contractor.toLowerCase().includes(sq)) ||
                                          (item.displayRemarks && item.displayRemarks.toLowerCase().includes(sq));
                        }
                        
                        return matchYear && matchPe && matchStatus && matchPendingPcma && matchPendingActual && matchPendingRemarks && matchSearch;
                    });

                            groupedMonthly[item.year].push(item);
                        });

                        const sortedYears = Object.keys(groupedMonthly).sort().reverse();
                        
                        sortedYears.forEach((yearGrp) => {
                            const theme = YEAR_THEMES[yearGrp] || YEAR_THEMES[2026]; 
                            const items = groupedMonthly[yearGrp];

                            html += `<div class="w-full flex flex-col shadow-md mb-6">`;

                            if (monthlyViewMode === 'standard') {

                                    <div class="${theme.head} ${theme.border} border flex font-black text-xl tracking-tight shadow-sm text-black">
                                        <div class="w-[25%] px-2 md:px-4 py-1.5 flex items-center whitespace-nowrap">CY ${yearGrp}</div>

                                        </div>
                                        <div class="w-[20%] py-1.5 flex justify-center items-center">
                                            <input type="checkbox" onchange="changeMonthlyFilter('pendingActual', this.checked)" ${monthlyFilterPendingActual ? 'checked' : ''} class="w-5 h-5 md:w-6 md:h-6 accent-[#4472c4] shadow-inner cursor-pointer rounded border-2" title="Pending Actual">
                                        </div>
                                        <div class="w-[35%] px-2 md:px-4 py-1.5 flex justify-end items-center gap-2">
                                            <input type="checkbox" onchange="changeMonthlyFilter('pendingRemarks', this.checked)" ${monthlyFilterPendingRemarks ? 'checked' : ''} class="w-5 h-5 md:w-6 md:h-6 accent-[#4472c4] shadow-inner cursor-pointer rounded border-2" title="Pending Remarks">
                                            <span class="text-sm md:text-base font-bold drop-shadow-sm">Pending</span>
                                        </div>
                                    </div>
                                    <table class="w-full border-collapse text-sm md:text-base font-bold text-black bg-white table-fixed">
                                        <thead>
                                            <tr class="bg-[#fff9f2] italic text-xs md:text-sm border-b border-orange-200">
                                                <th class="py-1.5 px-1 dotted-border font-extrabold text-black text-center w-[25%]">Contract ID</th>
                                                <th class="py-1.5 px-1 dotted-border font-extrabold text-black text-center w-[20%]">PCMA</th>
                                                <th class="py-1.5 px-1 dotted-border font-extrabold text-black text-center w-[20%]">Actual</th>
                                                <th class="py-1.5 px-1 font-extrabold text-black text-center w-[35%]">Remarks</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                `;
                            } else {
                                // TREND HEADER
                                const titleColor = monthlyViewMode === 'pcma' ? 'text-red-600' : 'text-blue-700';

                                        <div class="w-[75%] py-1.5 flex justify-center items-center ${titleColor} uppercase tracking-widest font-black text-2xl md:text-3xl drop-shadow-[0_1px_1px_rgba(255,255,255,0.8)]">
                                            ${monthlyViewMode}
                                        </div>
                                    </div>
                                    <table class="w-full border-collapse text-sm md:text-base font-bold text-black bg-white table-fixed">
                                        <thead>
                                            <tr class="bg-[#fff9f2] italic text-xs md:text-sm border-b border-orange-200">
                                                <th class="py-1.5 px-1 dotted-border font-extrabold text-black text-center w-[28%]">Contract ID</th>

                                for(let i=0; i<4; i++) {

                                    let borderClass = i < 3 ? 'dotted-border' : '';

                                }
                                html += `</tr></thead><tbody>`;

                                            <td class="py-1 px-1 dotted-border text-center">

                                                <div class="w-full" onclick="event.stopPropagation()">
                                                    <input type="text" id="input-pcma-${p.contractId}-${p.monthDiff}"
                                                        value="${p.displayPcma === '-' ? '' : p.displayPcma.replace(/"/g, '&quot;')}"
                                                        class="w-full text-[13px] md:text-sm font-bold outline-none text-center bg-transparent text-gray-800 placeholder:text-gray-500 focus:bg-white/50 focus:ring-1 focus:ring-blue-400 rounded transition-colors px-1"
                                                        placeholder="-"
                                                        onchange="updateSheetData('${p.contractId}', 'pcma', this.value, ${p.monthDiff})"
                                                    />
                                                </div>
                                                `}
                                            </td>

                                            <!-- Actual Month Display -->
                                            <td class="py-2 px-1 dotted-border font-black text-center text-[13px] md:text-base">
                                                ${p.isBeforeNTP ? '<span class="text-xs text-gray-500 font-bold italic">Before NTP</span>' : `
                                                <span>${p.displayActual}</span>
                                                `}
                                            </td>
                                            
                                            <!-- Editable Remarks Column -->
                                            <td class="py-1 px-1 text-center">
                                                ${p.isBeforeNTP ? '<span class="text-xs text-gray-500 font-bold italic">Before NTP</span>' : `
                                                <div class="w-full" onclick="event.stopPropagation()">
                                                    <textarea id="input-remarks-${p.contractId}-${p.monthDiff}"
                                                        class="w-full text-[11px] md:text-xs italic outline-none bg-transparent text-gray-800 text-center placeholder:text-gray-500 focus:bg-white/50 focus:ring-1 focus:ring-blue-400 rounded transition-colors resize-none overflow-hidden px-1 leading-tight"
                                                        rows="1"
                                                        placeholder="-"
                                                        oninput="this.style.height = 'auto'; this.style.height = this.scrollHeight + 'px';"
                                                        onchange="updateSheetData('${p.contractId}', 'remarks', this.value, ${p.monthDiff})"
                                                    >${p.displayRemarks === '-' ? '' : p.displayRemarks.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</textarea>
                                                </div>
                                                `}
                                            </td>
                                        </tr>
                                    `;
                                } else {
                                    html += `
                                        <tr class="${rowColor} border-t border-gray-300/50 cursor-pointer hover:brightness-95 transition-all text-black" onclick="toggleDetails('${uniqueId}')">

                                    `;
                                    
                                    p.trendData.forEach((t, tIdx) => {
                                        let borderClass = tIdx < 3 ? 'dotted-border' : '';
                                        html += `<td class="py-1 px-1 ${borderClass} text-center">`;
