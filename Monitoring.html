                                                    <textarea id="input-remarks-${p.contractId}-${p.monthDiff}"
                                                        class="w-full text-[11px] md:text-xs italic outline-none bg-transparent text-gray-800 text-center placeholder:text-gray-500 focus:bg-white/50 focus:ring-1 focus:ring-blue-400 rounded transition-colors resize-none overflow-hidden px-1 leading-tight"
                                                        rows="1"
                                                        placeholder="-"
                                                        oninput="this.style.height = 'auto'; this.style.height = this.scrollHeight + 'px';"
                                                        onchange="updateSheetData('${p.contractId}', 'remarks', this.value, ${p.monthDiff})"
                                                    >${p.displayRemarks === '-' ? '' : p.displayRemarks.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</textarea>
                                                </div>
                                                `}
                                            </td>
                                        </tr>
                                    `;
                                } else {
                                    html += `
                                        <tr class="${rowColor} border-t border-gray-300/50 cursor-pointer hover:brightness-95 transition-all text-black" onclick="toggleDetails('${uniqueId}')">
                                            <td class="py-2 px-1 dotted-border text-center font-extrabold md:text-[15px] tracking-wider overflow-hidden">${p.contractId}</td>
                                    `;
                                    
                                    p.trendData.forEach((t, tIdx) => {
                                        let borderClass = tIdx < 3 ? 'dotted-border' : '';
                                        html += `<td class="py-1 px-1 ${borderClass} text-center">`;
                                        
                                        if (t.isBeforeNTP) {
                                            html += `<span class="text-[10px] md:text-xs text-gray-400 font-bold italic leading-tight drop-shadow-sm">Before NTP</span>`;
                                        } else if (monthlyViewMode === 'pcma') {
                                            html += `
                                                <div class="w-full" onclick="event.stopPropagation()">
                                                    <input type="text" id="input-pcma-${p.contractId}-${t.monthDiff}"
                                                        value="${t.pcmaVal === '-' ? '' : t.pcmaVal.replace(/"/g, '&quot;')}"
                                                        class="w-full text-xs md:text-sm font-bold outline-none text-center bg-transparent text-gray-800 placeholder:text-gray-500 focus:bg-white/50 focus:ring-1 focus:ring-blue-400 rounded transition-colors px-1"
                                                        placeholder="-"
                                                        onchange="updateSheetData('${p.contractId}', 'pcma', this.value, ${t.monthDiff})"
                                                    />
                                                </div>
                                            `;
                                        } else {
                                            let iconHtml = '';
                                            if (t.indicator === 'up') {
                                                iconHtml = `<i class="fa-solid fa-arrow-up text-[#34d399] text-[13px] md:text-[15px]" style="-webkit-text-stroke: 1px #064e3b;"></i>`;
                                            } else if (t.indicator === 'down') {
                                                iconHtml = `<i class="fa-solid fa-arrow-down text-[#fb7185] text-[13px] md:text-[15px]" style="-webkit-text-stroke: 1px #881337;"></i>`;
                                            } else if (t.indicator === 'equal') {
                                                iconHtml = `
                                                    <div class="inline-flex flex-col gap-[2px] mt-0.5">
                                                        <div class="w-[12px] h-[4px] bg-[#ef4444] border border-[#7f1d1d]"></div>
                                                        <div class="w-[12px] h-[4px] bg-[#64748b] border border-[#0f172a]"></div>
                                                    </div>`;
                                            }

                                            if (t.actualVal === '-') {
                                                html += `<span class="text-[12px] md:text-sm font-black">-</span>`;
                                            } else {
                                                html += `
                                                    <div class="flex items-center justify-center gap-1.5 md:gap-2">
                                                        <span class="text-[12px] md:text-sm font-black">${t.actualVal}</span>
                                                        <span class="w-3 md:w-4 flex items-center justify-center">${iconHtml}</span>
                                                    </div>
                                                `;
                                            }
                                        }
                                        html += `</td>`;
                                    });
                                    html += `</tr>`;
                                }

                                html += `
                                    <tr id="${uniqueId}" class="hidden bg-white shadow-inner text-xs md:text-sm text-black">
                                        <td colspan="${monthlyViewMode === 'standard' ? '4' : '5'}" class="px-2 py-2">
                                            <div class="flex flex-col text-left py-1 w-full max-w-full">
                                                <div class="flex gap-2 pb-1.5 pt-1">
                                                    <div class="w-[90px] md:w-[100px] font-medium italic shrink-0 text-slate-800 text-right">Project Name</div>
                                                    <div class="font-bold shrink-0 text-slate-800">:</div>
                                                    <div class="text-gray-900 leading-snug break-words flex-1">${p.projectName}</div>
                                                </div>
                                                <div class="flex gap-2 border-t border-dotted border-orange-300 py-1.5">
                                                    <div class="w-[90px] md:w-[100px] font-medium italic shrink-0 text-slate-800 text-right">Location</div>
                                                    <div class="font-bold shrink-0 text-slate-800">:</div>
                                                    <div class="text-gray-900 leading-snug break-words flex-1">${p.location}</div>
                                                </div>
                                                <div class="flex gap-2 border-t border-dotted border-orange-300 py-1.5">
                                                    <div class="w-[90px] md:w-[100px] font-medium italic shrink-0 text-slate-800 text-right">Contractor</div>
                                                    <div class="font-bold shrink-0 text-slate-800">:</div>
                                                    <div class="text-gray-900 leading-snug break-words flex-1">${p.contractor}</div>
                                                </div>
                                                <div class="flex gap-2 border-t border-dotted border-orange-300 pt-1.5 pb-1">
                                                    <div class="w-[90px] md:w-[100px] font-medium italic shrink-0 text-slate-800 text-right">PE</div>
                                                    <div class="font-bold shrink-0 text-slate-800">:</div>
                                                    <div class="text-gray-900 font-bold flex-1">${p.pe}</div>
                                                </div>
                                            </div>
                                        </td>
                                    </tr>
                                `;
                            });
                            html += `</tbody></table></div>`;
                        });
                    }
                    container.innerHTML = html;

                    // FAST-DOM Call to smoothly resize all textareas exactly once without freezing the UI
                    if (monthlyViewMode === 'standard') {
                        resizeTextareasSmoothly();
                    }
                }
            }

            // -------------------------------------------------------------
            // DOCUMENTS VIEW
            // -------------------------------------------------------------
            else if (mainView === 'documents') {
                const allYears = [...new Set(monthlyDataGlobal.map(item => item.year))].filter(Boolean).sort().reverse();
                const allPEs = [...new Set(monthlyDataGlobal.map(item => item.pe))].filter(Boolean).sort();
                const allStatuses = [...new Set(monthlyDataGlobal.map(item => item.status))].filter(Boolean).sort();

                let html = `
                    <div class="w-full flex flex-col gap-2 mb-4">
                        <div class="relative w-full">
                            <i class="fa-solid fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                            <input type="text" placeholder="Search Contract ID, Project, Contractor..." value="${docSearchQuery}" class="w-full border-2 border-orange-500 pl-10 pr-3 py-1.5 rounded-md text-sm md:text-base font-bold outline-none text-slate-700 shadow-sm" onkeyup="debounceDocSearch(this.value)">
                        </div>

                        <div class="flex flex-col md:flex-row gap-2">
                            <select onchange="changeDocFilter('year', this.value)" class="flex-1 border-2 border-orange-500 text-[#0f3b75] font-black text-center py-1.5 text-sm md:text-base outline-none cursor-pointer shadow-sm bg-white rounded-md">
                                <option value="All" ${docFilterYear === 'All' ? 'selected' : ''}>All Years</option>
                                ${allYears.map(y => `<option value="${y}" ${docFilterYear === String(y) ? 'selected' : ''}>${y}</option>`).join('')}
                            </select>
                            <select onchange="changeDocFilter('pe', this.value)" class="flex-1 border-2 border-orange-500 text-[#0f3b75] font-black text-center py-1.5 text-sm md:text-base outline-none cursor-pointer shadow-sm bg-white rounded-md">
                                <option value="All">All PEs</option>
                                ${allPEs.map(pe => `<option value="${pe}" ${docFilterPe===pe?'selected':''}>${pe}</option>`).join('')}
                            </select>
                            <select onchange="changeDocFilter('status', this.value)" class="flex-1 border-2 border-orange-500 text-[#0f3b75] font-black text-center py-1.5 text-sm md:text-base outline-none cursor-pointer shadow-sm bg-white rounded-md">
                                <option value="All">All Status</option>
                                ${allStatuses.map(s => `<option value="${s}" ${docFilterStatus===s?'selected':''}>${s}</option>`).join('')}
                            </select>
                        </div>
                    </div>
                `;

                let filteredDocs = monthlyDataGlobal.filter(item => {
                    const matchYear = docFilterYear === 'All' || item.year === docFilterYear;
                    const matchPe = docFilterPe === 'All' || item.pe === docFilterPe;
                    const matchStatus = docFilterStatus === 'All' || item.status === docFilterStatus;
                    let matchSearch = true;
                    if (docSearchQuery) {
                        const sq = docSearchQuery.toLowerCase();
                        matchSearch = (item.contractId && item.contractId.toLowerCase().includes(sq)) ||
                                      (item.projectName && item.projectName.toLowerCase().includes(sq)) ||
                                      (item.contractor && item.contractor.toLowerCase().includes(sq));
                    }
                    return matchYear && matchPe && matchStatus && matchSearch;
                });

                if (filteredDocs.length === 0) {
                    html += `<div class="text-center py-10 font-black text-slate-500 opacity-60"><i class="fa-solid fa-folder-open text-4xl mb-3 block"></i> No projects found matching this criteria!</div>`;
                } else {
                    const groupedDocs = {};
                    filteredDocs.forEach(item => {
                        if(!groupedDocs[item.pe]) groupedDocs[item.pe] = [];
                        groupedDocs[item.pe].push(item);
                    });

                    const sortedPEs = Object.keys(groupedDocs).sort();
                    
                    let docCols = [];
                    if (documentSubTab === 'planning') {
                        docCols = [{k: 'POW', l: 'POW'}, {k: 'DUPA', l: 'DUPA'}, {k: 'QUANTITY CALCULATION', l: 'Q.C.'}, {k: 'ORIGINAL PLAN', l: 'Orig. Plan'}];
                    } else if (documentSubTab === 'procurement') {
                        docCols = [{k: 'BOQ', l: 'BOQ'}, {k: 'DETAILED ESTIMATE', l: 'Estimate'}, {k: 'NOTICE OF AWARD', l: 'NOA'}, {k: 'CONTRACT AGREEMENT', l: 'Contract'}];
                    } else {
                        docCols = [{k: 'NTP', l: 'NTP'}, {k: 'PDM', l: 'PDM'}, {k: 'BAR-CHART', l: 'B. Chart'}, {k: 'PRE-CON NOTICE & MINUTES OF MEETING', l: 'Pre-con'}];
                    }

 
	sortedPEs.forEach((pe, index) => {
                        const theme = PE_THEMES[index % PE_THEMES.length];
                        const items = groupedDocs[pe];

                        // Check specific state for this PE (defaults to false if undefined)
                        const isHideComplete = docHideCompletePE[pe] || false;

                        // Calculate totals for progress bar (Status)
                        let peTotalReq = 0;
                        let peTotalChecks = 0;

                        items.forEach(p => {
                            let projReq = 0;
                            let projChecks = 0;
                            docCols.forEach(col => {
                                const docStatus = p.docs ? p.docs[col.k] : null;
                                if (docStatus && docStatus.required) {
                                    projReq++;
                                    if (docStatus.uploaded) projChecks++;
                                }
                            });
                            p._docReq = projReq;
                            p._docChecks = projChecks;
                            peTotalReq += projReq;
                            peTotalChecks += projChecks;
                        });

                        // Filter items if Hide Checkbox is true FOR THIS SPECIFIC PE
                        let visibleItems = items;
                        if (isHideComplete) {
                            // Hide if all required documents are checked, or if completely N.A.
                            visibleItems = items.filter(p => p._docReq > 0 && p._docChecks < p._docReq);
                        }

                        // Hide the whole PE container if no items are left visible and it's set to hide
                        if (visibleItems.length === 0 && isHideComplete) return;

                        // Calculate percentage format for Progress Bar
                        let percent = 0;
                        if (peTotalReq > 0) percent = (peTotalChecks / peTotalReq) * 100;
                        const percentStr = peTotalReq > 0 ? percent.toFixed(2) : '0.00';
                        
                        const peEscaped = pe.replace(/"/g, '&quot;'); // Escape to safely pass into the HTML string

                        html += `
                            <div class="w-full flex flex-col shadow-md mb-6">
                                <div class="${theme.header} px-4 py-1.5 font-black text-lg md:text-xl tracking-tight shadow-sm z-10 relative flex justify-between items-center">
                                    <span>${pe}</span>
                                    <div class="flex items-center gap-2 md:gap-4 text-sm md:text-base font-bold text-black">
                                        <label class="flex items-center gap-1 cursor-pointer hover:opacity-80">
                                            <span class="text-xs md:text-sm tracking-wide font-medium">Hide</span>
                                            <input type="checkbox" onchange="toggleDocHideComplete(this.getAttribute('data-pe'), this.checked)" data-pe="${peEscaped}" ${isHideComplete ? 'checked' : ''} class="w-4 h-4 md:w-5 md:h-5 accent-[#4472c4] cursor-pointer shadow-inner">
                                        </label>
                                        <span class="text-red-600 drop-shadow-[0_1px_1px_rgba(255,255,255,0.7)] text-xl md:text-2xl ml-1">${items.length}</span>
                                    </div>
                                </div>
                                
                                <!-- STATUS PROGRESS BAR -->
                                <div class="flex items-center px-2 py-1.5 bg-[#e0e8f5] border-b-2 border-white shadow-inner">
                                    <span class="font-extrabold text-[#5c2d91] mr-2 text-sm md:text-base tracking-wide drop-shadow-sm">Status :</span>
                                    <div class="flex-1 bg-[#b0bec5] rounded-full h-[18px] md:h-[22px] relative overflow-hidden shadow-[inset_0px_2px_4px_rgba(0,0,0,0.3)] border border-gray-400 flex">
                                        <div class="bg-gradient-to-b from-[#ff4d4d] to-[#cc0000] h-full transition-all duration-500 ease-out" style="width: ${percent}%;"></div>
                                        <div class="absolute inset-0 flex items-center justify-center text-white font-black text-[11px] md:text-sm drop-shadow-[0_1px_1px_rgba(0,0,0,0.8)] pointer-events-none tracking-widest">
                                            ${percentStr}% &nbsp;&nbsp; ${peTotalChecks} | ${peTotalReq}
                                        </div>
                                    </div>
                                </div>

                                <table class="w-full text-center border-collapse text-sm font-bold text-black bg-white">
                                    <thead>
                                        <tr class="bg-[#fff9f2] italic text-[11px] md:text-sm border-b border-orange-200">
                                            <th class="py-2 px-1 dotted-border font-extrabold text-black w-[24%]">Contract ID</th>
                        `;
                        docCols.forEach(col => {
                            html += `<th class="py-2 px-1 dotted-border font-extrabold text-black w-[19%]">${col.l}</th>`;
                        });
                        html += `</tr></thead><tbody>`;

                        visibleItems.forEach((p, idx) => {
                            const rowColor = idx % 2 === 0 ? theme.rowOdd : theme.rowEven;
                            const uniqueId = `doc-details-${index}-${idx}`;
                            html += `
                                <tr class="${rowColor} border-t border-gray-300/50 cursor-pointer hover:brightness-95 transition-all text-black" onclick="toggleDetails('${uniqueId}')">
                                    <td class="py-2 px-1 dotted-border font-extrabold tracking-wider text-[12px] md:text-base">${p.contractId}</td>
                            `;
                            
                            docCols.forEach(col => {
                                const docStatus = p.docs ? p.docs[col.k] : null;
                                let iconHtml = '';
                                if (!docStatus || !docStatus.required) {
                                    iconHtml = '<span class="text-purple-700 font-extrabold text-sm md:text-lg drop-shadow-sm" style="font-family: serif; letter-spacing:-0.5px;">N.A</span>';
                                } else if (docStatus.uploaded) {
                                    iconHtml = '<i class="fa-solid fa-check text-emerald-500 text-lg md:text-xl font-black drop-shadow-sm"></i>';
                                } else {
                                    iconHtml = '<i class="fa-solid fa-xmark text-red-600 text-lg md:text-xl font-black drop-shadow-sm"></i>';
                                }
                                html += `<td class="py-2 px-1 dotted-border">${iconHtml}</td>`;
                            });

                            html += `</tr>${generateDetailsRow(uniqueId, 5, p)}`;
                        });
                        html += `</tbody></table></div>`;
                    });

               

			   }
                container.innerHTML = html;
            }

            if (activeElemId) {
                const el = document.getElementById(activeElemId);
                if (el) {
                    el.focus();
                    if(el.setSelectionRange) {
                        const len = el.value.length;
                        el.setSelectionRange(len, len);
                    }
                }
            }
        }

        // ====================================================================
        // HELPER UTILITIES
        // ====================================================================
        function buildItemsLookupMap(data) {
            let map = {};
            if (!data.values || data.values.length < 1) return map;
            const headers = data.values[0].map(h => String(h || '').toUpperCase().trim());
            const colItemNo = headers.findIndex(h => h === 'ITEM NO.' || h === 'ITEM NO' || h === 'ITEM');
            const colUnitCost = headers.findIndex(h => h === 'UNIT COST' || h === 'COST' || h === 'RATE');
            for (let i = 1; i < data.values.length; i++) {
                const row = data.values[i];
                const itemNo = colItemNo !== -1 && row[colItemNo] ? String(row[colItemNo]).trim() : '';
                if (!itemNo) continue;
                const unitCost = colUnitCost !== -1 && row[colUnitCost] ? parseFloat(String(row[colUnitCost]).replace(/[^0-9.]/g, '')) || 0 : 0;
                map[itemNo] = { unitCost };
            }
            return map;
        }

        function buildVoLookupMap(data) {
            let map = {};
            if (!data.values || data.values.length < 1) return map;
            const headers = data.values[0].map(h => String(h || '').toUpperCase().trim());
            const colContractId = headers.findIndex(h => h.includes('CONTRACT'));
            const colRevCost = headers.findIndex(h => h === 'REV. CONTRACT COST' || h === 'REVISED CONTRACT COST');
            const colCost = headers.findIndex(h => h === 'CONTRACT COST' || h === 'COST');
            const finalColContractId = colContractId !== -1 ? colContractId : 0;
            for (let i = 1; i < data.values.length; i++) {
                const row = data.values[i];
                const contractId = String(row[finalColContractId] || '').trim();
                if (!contractId) continue;
                const revCostStr = colRevCost !== -1 ? String(row[colRevCost] || '').trim() : '';
                const costStr = colCost !== -1 ? String(row[colCost] || '').trim() : '';
                let finalAmount = 0;
                if (revCostStr !== '') finalAmount = parseFloat(revCostStr.replace(/[^0-9.]/g, '')) || 0;
                else if (costStr !== '') finalAmount = parseFloat(costStr.replace(/[^0-9.]/g, '')) || 0;
                map[contractId] = { amount: finalAmount };
            }
            return map;
        }

        function buildPdoLookupMap(data) {
            let map = {};
            if (!data.values || data.values.length < 1) return map;
            
            const cleanHeaders = data.values[0].map(h => String(h || '').toUpperCase().replace(/[\s\-_]/g, ''));
            let colContractId = cleanHeaders.findIndex(h => h.includes('CONTRACTID') || h.includes('CONTRACT'));
            if (colContractId === -1) colContractId = 0;
            
            const rawHeaders = data.values[0].map(h => String(h || '').toUpperCase().trim());
            const colNtp = rawHeaders.findIndex(h => h === 'NTP' || h === 'NOTICE TO PROCEED');
            const colExpiry = rawHeaders.findIndex(h => h === 'ORIG. EXPIRY' || h === 'EXPIRY' || h === 'TARGET DATE' || h === 'COMPLETION DATE' || h.includes('EXPIRY'));
            const colPE = rawHeaders.findIndex(h => h === 'PROJECT ENGINEER (PE)' || h.includes('PROJECT ENGINEER'));
            const colContractor = rawHeaders.findIndex(h => h === 'CONTRACTOR' || h.includes('CONTRACTOR'));
            const colProjectName = rawHeaders.findIndex(h => h === 'PROJECT NAME' || h.includes('TITLE'));
            const colLocation = rawHeaders.findIndex(h => h === 'LOCATION' || h.includes('LOCATION'));
            const colFund = rawHeaders.findIndex(h => h === 'FUND' || h.includes('FUND'));
            
            const colYear = rawHeaders.findIndex(h => h === 'YEAR' || h.includes('YEAR'));
            const colStatus = rawHeaders.findIndex(h => h === 'STATUS' || h.includes('STATUS'));

            for (let i = 1; i < data.values.length; i++) {
                const row = data.values[i];
                const contractId = String(row[colContractId] || '').trim();
                if (!contractId) continue;
                
                map[contractId] = { 
                    ntp: colNtp !== -1 && row[colNtp] ? String(row[colNtp]).trim() : '-',
                    expiry: colExpiry !== -1 && row[colExpiry] ? String(row[colExpiry]).trim() : '-',
                    pe: colPE !== -1 && row[colPE] ? String(row[colPE]).trim() : 'Unknown PE',
                    contractor: colContractor !== -1 && row[colContractor] ? String(row[colContractor]).trim() : 'Unknown Contractor',
                    projectName: colProjectName !== -1 && row[colProjectName] ? String(row[colProjectName]).trim() : 'Unknown Project',
                    location: colLocation !== -1 && row[colLocation] ? String(row[colLocation]).trim() : 'Unknown Location',
                    fund: colFund !== -1 && row[colFund] ? String(row[colFund]).trim() : '',
                    year: colYear !== -1 && row[colYear] ? String(row[colYear]).trim() : '',
                    status: colStatus !== -1 && row[colStatus] ? String(row[colStatus]).trim() : ''
                };
            }
            return map;
        }

        function findContractHeaderCol(headers) {
            const clean = headers.map(h => String(h || '').toUpperCase().replace(/[\s\-_]/g, ''));
            const index = clean.findIndex(h => h.includes('CONTRACTID') || h === 'CONTRACT' || h.includes('CONTRACT'));
            return index !== -1 ? index : 0;
        }

        function parseNtpToOffset(ntpStr) {
            if (!ntpStr || ntpStr === '-') return 0;
            const cleaned = ntpStr.toLowerCase().trim();
            const monthNames = ["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec"];
            let monthIdx = -1;
            for (let i = 0; i < 12;i++) if (cleaned.includes(monthNames[i])) { monthIdx = i; break; }
            if (monthIdx !== -1) {
                const numMatches = cleaned.match(/\d+/g);
                let year = START_YEAR;
                if (numMatches && numMatches.length > 0) {
                    const lastNum = parseInt(numMatches[numMatches.length - 1]);
                    year = lastNum < 100 ? 2000 + lastNum : lastNum;
                }
                return (year - START_YEAR) * 12 + monthIdx;
            }
            const d = new Date(ntpStr);
            if (!isNaN(d.getTime())) return (d.getFullYear() - START_YEAR) * 12 + d.getMonth();
            return 0; 
        }

        function parseAccomplishmentVal(val) {
            if (!val) return 0;
            const str = String(val).trim();
            if (str.includes(',')) {
                return str.split(',').reduce((sum, p) => {
                    const parsed = parseFloat(p.trim().replace(/[^0-9.-]+/g, ""));
                    return sum + (isNaN(parsed) ? 0 : parsed);
                }, 0);
            }
            const parsed = parseFloat(str.replace(/[^0-9.-]+/g, ""));
            return isNaN(parsed) ? 0 : parsed;
        }
    </script>
