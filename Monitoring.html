<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D VO Tracking Dashboard - Monitor</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Configuration & Custom CSS -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'dark-bg': '#1a1a24',
                        'neon-blue': '#00f3ff',
                        'neon-purple': '#b026ff',
                        'neon-green': '#00ff88',
                        'neon-orange': '#ff5e00',
                        'neon-pink': '#ff0055'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #1a1a24;
            color: #e2e8f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
        }

        /* 3D Neumorphism & Glassmorphism Utilities */
        .card-3d {
            background: #20202d;
            box-shadow: 12px 12px 24px #121219, -12px -12px 24px #2e2e41;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .btn-3d {
            background: #20202d;
            box-shadow: 6px 6px 12px #121219, -6px -6px 12px #2e2e41;
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.2s ease;
            border-radius: 16px;
        }

        .btn-3d:active {
            box-shadow: inset 4px 4px 8px #121219, inset -4px -4px 8px #2e2e41;
            transform: scale(0.98);
        }

        .btn-3d.active-tab {
            box-shadow: inset 6px 6px 12px #121219, inset -6px -6px 12px #2e2e41;
            color: #00f3ff;
            border-bottom: 3px solid #00f3ff;
        }

        /* 3D Clickable Badge for Totals */
        .td-clickable {
            background: linear-gradient(145deg, #ff0055, #c20042);
            box-shadow: 0 5px 0 #8a002f, 0 10px 15px rgba(0,0,0,0.5);
            border-radius: 12px;
            width: 42px;
            height: 42px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 800;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.1s;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        .td-clickable:active {
            transform: translateY(5px);
            box-shadow: 0 0px 0 #8a002f, 0 3px 5px rgba(0,0,0,0.5);
        }

        /* Table sticky column for mobile */
        .sticky-col {
            position: sticky;
            left: 0;
            background: #20202d;
            z-index: 10;
            box-shadow: 4px 0 8px rgba(0,0,0,0.3);
        }

        /* Modal 3D Effect */
        .modal-content-3d {
            background: #252535;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255,255,255,0.1);
            border: 1px solid #3d3d52;
        }
        
        /* Smooth Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1a1a24; }
        ::-webkit-scrollbar-thumb { background: #3d3d52; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #00f3ff; }

        .loading-pulse { animation: pulse 1.5s infinite; }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.05); }
        }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen flex flex-col items-center">

    <!-- Header -->
    <header class="w-full max-w-6xl text-center mb-8 mt-4">
        <h1 class="text-3xl md:text-6xl font-black mb-1 drop-shadow-lg text-transparent bg-clip-text bg-gradient-to-r from-neon-blue via-neon-purple to-neon-pink" style="filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));">
            <i class="fa-solid fa-layer-group text-neon-blue mr-3"></i><span class="md:hidden">Monitoring Project Documents</span><span class="hidden md:inline">File Tracker</span>
        </h1>
        <h2 class="text-lg md:text-2xl font-bold text-gray-300 mb-3 tracking-wide">
            Upload your Project Documents
        </h2>
        <p class="text-gray-400 font-medium text-sm md:text-base"><i class="fa-solid fa-server mr-2 text-neon-green"></i>Live Sync from Google Sheets API</p>
    </header>

    <!-- Main Dashboard Container -->
    <main class="w-full max-w-6xl card-3d p-4 md:p-8 relative">
        
        <!-- Loading Overlay -->
        <div id="loader" class="absolute inset-0 z-50 bg-[#20202d]/90 rounded-2xl flex flex-col items-center justify-center backdrop-blur-sm">
            <i class="fa-solid fa-cube text-6xl text-neon-blue loading-pulse mb-4"></i>
            <h2 class="text-xl font-bold text-neon-blue">Fetching Live Data...</h2>
            <p id="loader-text" class="text-gray-400 mt-2 text-sm text-center px-4">Connecting to Google Sheets via API...</p>
        </div>

        <!-- Document Type Toggle -->
        <div class="grid grid-cols-4 md:flex md:flex-wrap justify-center mb-6 bg-[#181822] rounded-2xl p-2 w-full md:w-fit mx-auto border border-gray-700/50 shadow-inner gap-1 md:gap-2">
            <button onclick="switchDocType('VO')" id="type-VO" class="px-1 md:px-6 py-2 rounded-xl font-black text-xs md:text-sm transition-all bg-[#2a2a3a] text-neon-blue shadow-md border border-gray-600/50 text-center"><span class="md:hidden">VO</span><span class="hidden md:inline">Variation Orders</span></button>
            <button onclick="switchDocType('SO')" id="type-SO" class="px-1 md:px-6 py-2 rounded-xl font-black text-xs md:text-sm transition-all text-gray-400 hover:text-white border-transparent text-center"><span class="md:hidden">SO</span><span class="hidden md:inline">Suspension Orders</span></button>
            <button onclick="switchDocType('COMP')" id="type-COMP" class="px-1 md:px-6 py-2 rounded-xl font-black text-xs md:text-sm transition-all text-gray-400 hover:text-white border-transparent text-center"><span class="md:hidden">COC</span><span class="hidden md:inline">Completion</span></button>
            <button onclick="switchDocType('ACC')" id="type-ACC" class="px-1 md:px-6 py-2 rounded-xl font-black text-xs md:text-sm transition-all text-gray-400 hover:text-white border-transparent text-center"><span class="md:hidden">CA</span><span class="hidden md:inline">Acceptance</span></button>
        </div>

        <!-- Role Tabs -->
        <div class="grid grid-cols-4 md:flex md:flex-wrap justify-center gap-2 md:gap-4 mb-8 w-full max-w-3xl mx-auto">
            <button onclick="switchTab('PE')" id="tab-PE" class="btn-3d active-tab py-2 md:py-4 px-2 md:px-6 font-black text-xs md:text-lg flex flex-col md:flex-row items-center gap-1 md:gap-3 w-full sm:w-auto justify-center">
                <i class="fa-solid fa-helmet-safety text-neon-orange md:text-2xl"></i> <span class="md:hidden">PE</span><span class="hidden md:inline">Project Engineer</span>
            </button>
            <button onclick="switchTab('PI')" id="tab-PI" class="btn-3d py-2 md:py-4 px-2 md:px-6 font-black text-xs md:text-lg flex flex-col md:flex-row items-center gap-1 md:gap-3 w-full sm:w-auto justify-center text-gray-400">
                <i class="fa-solid fa-magnifying-glass-chart text-neon-green md:text-2xl"></i> <span class="md:hidden">PI</span><span class="hidden md:inline">Project Inspector</span>
            </button>
            <button onclick="switchTab('RE')" id="tab-RE" class="btn-3d py-2 md:py-4 px-2 md:px-6 font-black text-xs md:text-lg flex flex-col md:flex-row items-center gap-1 md:gap-3 w-full sm:w-auto justify-center text-gray-400">
                <i class="fa-solid fa-user-gear text-neon-purple md:text-2xl"></i> <span class="md:hidden">RE</span><span class="hidden md:inline">Resident Engineer</span>
            </button>
            <button onclick="switchTab('QE')" id="tab-QE" class="btn-3d py-2 md:py-4 px-2 md:px-6 font-black text-xs md:text-lg flex flex-col md:flex-row items-center gap-1 md:gap-3 w-full sm:w-auto justify-center text-gray-400">
                <i class="fa-solid fa-clipboard-check text-neon-pink md:text-2xl"></i> <span class="md:hidden">QE</span><span class="hidden md:inline">Quantity Engineer</span>
            </button>
        </div>

        <!-- Table Container (PC View) -->
        <div class="hidden md:block w-full overflow-x-auto rounded-xl border border-gray-700/50 shadow-inner bg-[#181822] p-2">
            <table class="w-full text-left border-collapse min-w-[700px]">
                <thead>
                    <tr class="text-neon-blue border-b-2 border-gray-700 bg-[#1c1c28]">
                        <th id="table-role-header" class="p-4 sticky-col font-black text-lg"><i class="fa-solid fa-user-tie mr-2"></i>Name</th>
                        <th class="p-4 text-center font-bold"><i class="fa-regular fa-calendar mr-2"></i>2023</th>
                        <th class="p-4 text-center font-bold"><i class="fa-regular fa-calendar mr-2"></i>2024</th>
                        <th class="p-4 text-center font-bold"><i class="fa-regular fa-calendar mr-2"></i>2025</th>
                        <th class="p-4 text-center font-bold"><i class="fa-regular fa-calendar mr-2"></i>2026</th>
                        <th class="p-4 text-center font-bold"><i class="fa-solid fa-percent mr-2"></i>Upload %</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- Dynamic Data injected here -->
                </tbody>
            </table>
        </div>

        <!-- Mobile Data Container -->
        <div id="mobile-container" class="md:hidden w-full flex flex-col gap-5">
            <!-- Dynamic Data injected here -->
        </div>
    </main>

    <!-- Details Modal -->
    <div id="modal" class="fixed inset-0 z-[100] hidden items-center justify-center bg-black/80 backdrop-blur-md p-4 transition-all">
        <div class="modal-content-3d rounded-2xl w-full max-w-4xl overflow-hidden transform scale-95 transition-transform duration-300 flex flex-col" id="modal-box">
            <!-- Modal Header -->
            <div class="bg-gradient-to-r from-gray-800 to-gray-900 p-5 border-b border-gray-700 flex justify-between items-center">
                <h3 id="modal-title" class="text-xl font-bold text-white flex items-center gap-3">
                    <i class="fa-solid fa-folder-open text-neon-orange"></i> Pending Documents
                </h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-neon-pink transition-colors text-2xl">
                    <i class="fa-solid fa-circle-xmark"></i>
                </button>
            </div>
            <!-- Modal Body -->
            <div class="p-6 max-h-[75vh] overflow-y-auto" id="modal-body">
                <!-- Contract items generated here -->
            </div>
            <!-- Modal Footer -->
            <div class="p-4 bg-gray-900 border-t border-gray-800 text-center">
                <button onclick="closeModal()" class="btn-3d px-8 py-2 text-white font-bold text-sm mx-auto">Close Panel</button>
            </div>
        </div>
    </div>

    <script>
        // Global State (Segmented by DocType and Role)
        window.appData = {
            VO:   { PE: {}, PI: {}, RE: {}, QE: {} },
            SO:   { PE: {}, PI: {}, RE: {}, QE: {} },
            COMP: { PE: {}, PI: {}, RE: {}, QE: {} },
            ACC:  { PE: {}, PI: {}, RE: {}, QE: {} }
        };
        let currentRole = 'PE';
        let currentDocType = 'VO'; // Default to VO 

        // Initialization
        document.addEventListener('DOMContentLoaded', () => {
            fetchData();
        });

        // -------------------------------------------------------------
        // NEW PURE HTML DATA FETCHING (Google Sheets REST API)
        // -------------------------------------------------------------
        async function fetchData() {
            // Configuration derived from the provided prompt
            const SPREADSHEET_ID = '1LSYLZ7tfSeVupQMPsCOHG4SlnzPQqOAIe03QI1qRMr8';
            const API_KEY = 'AIzaSyCz6fNJr3ecn-M2HActqM1aCXbxqRLj2e8'; 
            const SHEET_NAME = 'UPLOAD';
            const RANGE = `${SHEET_NAME}!A3:ZZ`; 

            const url = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${RANGE}?key=${API_KEY}`;

            try {
                const response = await fetch(url);
                
                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.error?.message || `HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                
                if (!data.values || data.values.length === 0) {
                    showError("No data found in the spreadsheet.");
                    return;
                }

                // First row of the range is the header (Row 3)
                const headersArray = data.values[0];
                const rowsArray = [];

                // Subsequent rows are data
                for (let i = 1; i < data.values.length; i++) {
                    const rowVals = data.values[i];
                    
                    // Google Sheets API omits trailing empty cells. We pad them to match headers.
                    while (rowVals.length < headersArray.length) {
                        rowVals.push('');
                    }

                    const isBlank = rowVals.every(v => String(v || "").trim() === "");
                    if (isBlank) continue;

                    rowsArray.push({
                        rowNumber: 3 + i, 
                        values: rowVals
                    });
                }

                processData(headersArray, rowsArray);
                
            } catch (error) {
                showError("Failed to communicate with server. Error: " + error.message);
                console.error(error);
            }
        }

        function showError(msg) {
            document.getElementById('loader-text').innerHTML = `<span class="text-red-400 font-bold"><i class="fa-solid fa-triangle-exclamation"></i> ${msg}</span>`;
            document.querySelector('.loading-pulse')?.classList.remove('loading-pulse');
            document.querySelector('.fa-cube')?.classList.replace('fa-cube', 'fa-skull-crossbones');
            document.querySelector('.fa-skull-crossbones')?.classList.add('text-red-500');
        }

        function processData(headersArray, rowsArray) {
            // Normalize headers for flexible, exact matching
            const headers = headersArray.map(h => (h || '').toString().trim().toUpperCase());
            
            // Helper to find column index based on possible names
            const findCol = (aliases) => headers.findIndex(h => aliases.some(a => h === a || h.startsWith(a + ' ')));

            // Identify column indices
            const cols = {
                PE: findCol(['PE', 'PROJECT ENGINEER']),
                PI: findCol(['PI', 'PROJECT INSPECTOR']),
                RE: findCol(['RE', 'RESIDENT ENGINEER']),
                QE: findCol(['QE', 'QUANTITY ENGINEER', 'QUALITY ENGINEER']), 
                RE_QE: findCol(['RE & QE', 'RE/QE', 'RE / QE']), 
                YEAR: findCol(['YEAR']),
                CONTRACT: findCol(['CONTRACT ID', 'CONTRACT_ID', 'CONTRACT'])
            };

            // Identify all required Document Columns (categorized by type: VO, SO, COMP, ACC)
            const docsToTrack = [];
            
            for(let i=1; i<=5; i++) docsToTrack.push({ type: 'VO', name: `VO${i}`, doc: findCol([`VO${i}`, `V.O.${i}`, `VO ${i}`]), up: findCol([`VO${i} UPLOADED`, `VO ${i} UPLOADED`, `VO${i} UP`]) });
            for(let i=1; i<=4; i++) docsToTrack.push({ type: 'SO', name: `WSO${i}`, doc: findCol([`WSO${i}`, `W.S.O.${i}`, `WSO ${i}`]), up: findCol([`WSO${i} UPLOADED`, `WSO ${i} UPLOADED`, `WSO${i} UP`]) });
            for(let i=1; i<=4; i++) docsToTrack.push({ type: 'SO', name: `CWSO${i}`, doc: findCol([`CWSO${i}`, `C.W.S.O.${i}`, `CWSO ${i}`]), up: findCol([`CWSO${i} UPLOADED`, `CWSO ${i} UPLOADED`, `CWSO${i} UP`]) });
            for(let i=1; i<=4; i++) docsToTrack.push({ type: 'SO', name: `WRO${i}`, doc: findCol([`WRO${i}`, `W.R.O.${i}`, `WRO ${i}`]), up: findCol([`WRO${i} UPLOADED`, `WRO ${i} UPLOADED`, `WRO${i} UP`]) });
            for(let i=1; i<=20; i++) docsToTrack.push({ type: 'SO', name: `CTE${i}`, doc: findCol([`CTE${i}`, `C.T.E.${i}`, `CTE ${i}`]), up: findCol([`CTE${i} UPLOADED`, `CTE ${i} UPLOADED`, `CTE${i} UP`]) });

            docsToTrack.push({ type: 'COMP', name: 'FCIR', doc: findCol(['FCIR']), up: findCol(['FCIR UPLOADED', 'FCIR UP']) });
            docsToTrack.push({ type: 'COMP', name: 'COC', doc: findCol(['COC']), up: findCol(['COC UPLOADED', 'COC UP']) });

            docsToTrack.push({ type: 'ACC', name: 'FAIR', doc: findCol(['FAIR']), up: findCol(['FAIR UPLOADED', 'FAIR UP']) });
            docsToTrack.push({ type: 'ACC', name: 'CFA', doc: findCol(['CFA']), up: findCol(['CFA UPLOADED', 'CFA UP']) });

            const yearsTracked = ['2023', '2024', '2025', '2026'];

            for(let i = 0; i < rowsArray.length; i++) {
                const row = rowsArray[i].values;
                if(cols.YEAR === -1 || !row[cols.YEAR]) continue;

                let rowYear = (row[cols.YEAR] || '').toString().trim();
                if(!yearsTracked.includes(rowYear)) continue;

                let missingVO = [], missingSO = [], missingCOMP = [], missingACC = [];
                let stats = {
                    VO:   { total: 0, uploaded: 0 },
                    SO:   { total: 0, uploaded: 0 },
                    COMP: { total: 0, uploaded: 0 },
                    ACC:  { total: 0, uploaded: 0 }
                };
                
                docsToTrack.forEach(v => {
                    if(v.doc !== -1) {
                        let hasDoc = row[v.doc] && row[v.doc].toString().trim() !== '';
                        let isUploaded = v.up !== -1 && row[v.up] && row[v.up].toString().trim() !== '';
                        
                        if(hasDoc) {
                            stats[v.type].total++;
                            if(isUploaded) {
                                stats[v.type].uploaded++;
                            } else {
                                if(v.type === 'VO') missingVO.push(v.name);
                                else if(v.type === 'SO') missingSO.push(v.name);
                                else if(v.type === 'COMP') missingCOMP.push(v.name);
                                else if(v.type === 'ACC') missingACC.push(v.name);
                            }
                        }
                    }
                });

                const contractId = cols.CONTRACT !== -1 && row[cols.CONTRACT] ? row[cols.CONTRACT] : 'Unknown Contract ID';

                const assignToRole = (roleKey, rawNames) => {
                    if(!rawNames || typeof rawNames !== 'string' || rawNames.trim() === '') return;
                    
                    const names = rawNames.split(/\s+and\s+|[\/&,]/i).map(n => n.trim()).filter(n => n !== '');
                    const uniqueNames = [...new Set(names)];
                    
                    uniqueNames.forEach(name => {
                        ['VO', 'SO', 'COMP', 'ACC'].forEach(docTypeKey => {
                            if(!window.appData[docTypeKey][roleKey][name]) {
                                window.appData[docTypeKey][roleKey][name] = { 
                                    '2023':[], '2024':[], '2025':[], '2026':[], 
                                    totalDocs: 0, uploadedDocs: 0 
                                };
                            }
                            
                            window.appData[docTypeKey][roleKey][name].totalDocs += stats[docTypeKey].total;
                            window.appData[docTypeKey][roleKey][name].uploadedDocs += stats[docTypeKey].uploaded;
                            
                            let targetMissingList;
                            if (docTypeKey === 'VO') targetMissingList = missingVO;
                            else if (docTypeKey === 'SO') targetMissingList = missingSO;
                            else if (docTypeKey === 'COMP') targetMissingList = missingCOMP;
                            else if (docTypeKey === 'ACC') targetMissingList = missingACC;
                            
                            if(targetMissingList.length > 0) {
                                window.appData[docTypeKey][roleKey][name][rowYear].push({ contractId, missingDocs: targetMissingList });
                            }
                        });
                    });
                };

                if(cols.PE !== -1) assignToRole('PE', row[cols.PE]);
                if(cols.PI !== -1) assignToRole('PI', row[cols.PI]);
                if(cols.RE !== -1) assignToRole('RE', row[cols.RE]);
                if(cols.QE !== -1) assignToRole('QE', row[cols.QE]);
                
                if(cols.RE_QE !== -1) {
                    assignToRole('RE', row[cols.RE_QE]);
                    assignToRole('QE', row[cols.RE_QE]);
                }
            }

            document.getElementById('loader').classList.add('hidden');
            renderTable();
        }

        function switchDocType(type) {
            currentDocType = type;
            
            ['VO', 'SO', 'COMP', 'ACC'].forEach(t => {
                const btn = document.getElementById(`type-${t}`);
                if(t === type) {
                    btn.classList.add('bg-[#2a2a3a]', 'text-neon-blue', 'shadow-md', 'border-gray-600/50');
                    btn.classList.remove('text-gray-400', 'border-transparent');
                } else {
                    btn.classList.remove('bg-[#2a2a3a]', 'text-neon-blue', 'shadow-md', 'border-gray-600/50');
                    btn.classList.add('text-gray-400', 'border-transparent');
                }
            });

            renderTable();
        }

        function switchTab(role) {
            currentRole = role;
            
            ['PE', 'PI', 'RE', 'QE'].forEach(r => {
                const btn = document.getElementById(`tab-${r}`);
                if(r === role) {
                    btn.classList.add('active-tab');
                    btn.classList.remove('text-gray-400');
                } else {
                    btn.classList.remove('active-tab');
                    btn.classList.add('text-gray-400');
                }
            });

            // Update Header Title dynamically based on Role
            const roleNamesPC = { 
                'PE': 'Project Engineer', 
                'PI': 'Project Inspector', 
                'RE': 'Resident Engineer', 
                'QE': 'Quantity Engineer' 
            };
            const roleNamesMobile = { 'PE': 'PE', 'PI': 'PI', 'RE': 'RE', 'QE': 'QE' };
            document.getElementById('table-role-header').innerHTML = `<i class="fa-solid fa-user-tie mr-2"></i><span class="md:hidden">${roleNamesMobile[role]}</span><span class="hidden md:inline">${roleNamesPC[role]}</span>`;

            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('table-body');
            const mobileContainer = document.getElementById('mobile-container');
            const dataMap = window.appData[currentDocType][currentRole];
            
            const persons = Object.keys(dataMap)
                                  .filter(person => dataMap[person].totalDocs > 0)
                                  .sort();

            if(persons.length === 0) {
                let categoryName = 'documents';
                if(currentDocType === 'VO') categoryName = 'Variation Orders';
                else if(currentDocType === 'SO') categoryName = 'Suspension Orders';
                else if(currentDocType === 'COMP') categoryName = 'Completion Documents';
                else if(currentDocType === 'ACC') categoryName = 'Acceptance Documents';

                let shortCatName = categoryName;
                if(currentDocType === 'COMP') shortCatName = 'COC Documents';
                if(currentDocType === 'ACC') shortCatName = 'CA Documents';

                tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-gray-400"><i class="fa-solid fa-check-circle text-4xl text-neon-green mb-3 block"></i>No personnel with registered ${categoryName} found for this role!</td></tr>`;
                mobileContainer.innerHTML = `<div class="p-8 bg-[#1c1c28] rounded-xl border border-gray-700/50 text-center text-gray-400 w-full"><i class="fa-solid fa-check-circle text-4xl text-neon-green mb-3 block"></i>No personnel with registered ${shortCatName} found!</div>`;
                return;
            }

            let pcHtml = '';
            let mobileHtml = '';
            
            persons.forEach(person => {
                const stats = dataMap[person];
                
                // Calculate Upload Percentage
                let percent = 0;
                if (stats.totalDocs > 0) {
                    percent = Math.round((stats.uploadedDocs / stats.totalDocs) * 100);
                } else {
                    percent = 100;
                }

                let percentColor = percent === 100 ? 'text-neon-green' : (percent >= 50 ? 'text-neon-orange' : 'text-neon-pink');
                let progressColor = percent === 100 ? 'bg-neon-green' : (percent >= 50 ? 'bg-neon-orange' : 'bg-neon-pink');
                let displayPercent = stats.totalDocs === 0 ? '-' : `${percent}%`;

                // --- PC HTML ---
                pcHtml += `
                <tr class="border-b border-gray-800 hover:bg-[#252536] transition-colors group">
                    <td class="p-4 sticky-col font-semibold flex items-center gap-3">
                        <div class="bg-gray-800 p-2 rounded-lg border border-gray-700 group-hover:border-neon-blue transition-colors">
                            <i class="fa-solid fa-user text-neon-blue"></i>
                        </div>
                        <span class="truncate max-w-[150px] sm:max-w-xs block" title="${person}">${person}</span>
                    </td>`;

                // Years Loop (PC & Mobile values calculation)
                let mobileButtonsHtml = '';
                ['2023', '2024', '2025', '2026'].forEach(year => {
                    const projects = stats[year];
                    if(projects.length > 0) {
                        pcHtml += `
                        <td class="p-4 text-center">
                            <button onclick="openModal('${currentDocType}', '${currentRole}', '${person.replace(/'/g, "\\'")}', '${year}')" class="td-clickable" title="Click to view ${projects.length} pending projects">
                                ${projects.length}
                            </button>
                        </td>`;
                        mobileButtonsHtml += `
                        <div class="flex justify-center">
                            <button onclick="openModal('${currentDocType}', '${currentRole}', '${person.replace(/'/g, "\\'")}', '${year}')" class="td-clickable" style="width:30px; height:30px; font-size:0.9rem;" title="Click to view ${projects.length} pending projects">
                                ${projects.length}
                            </button>
                        </div>`;
                    } else {
                        pcHtml += `<td class="p-4 text-center text-gray-600 font-bold">-</td>`;
                        mobileButtonsHtml += `<div class="text-center text-gray-600 font-black text-lg">-</div>`;
                    }
                });

                // Upload % Column (PC)
                pcHtml += `
                    <td class="p-4">
                        <div class="flex flex-col items-center justify-center w-full min-w-[120px]">
                            <div class="flex justify-between w-full px-1 mb-1 items-end">
                                <span class="font-black text-lg ${percentColor}">${displayPercent}</span>
                                <span class="text-[10px] text-gray-500 font-bold tracking-wider">${stats.uploadedDocs}/${stats.totalDocs}</span>
                            </div>
                            <div class="w-full bg-[#121219] rounded-full h-2.5 shadow-inner border border-gray-700/50">
                                <div class="${progressColor} h-2.5 rounded-full shadow-[0_0_8px_currentColor]" style="width: ${stats.totalDocs === 0 ? 0 : percent}%; transition: width 0.5s ease;"></div>
                            </div>
                        </div>
                    </td>
                </tr>`;

                // --- MOBILE HTML ---
                mobileHtml += `
                <div class="bg-[#1c1c28] rounded-xl border border-gray-700/50 p-4 hover:border-neon-blue transition-colors group shadow-md w-full">
                    <div class="flex items-center gap-3 mb-3">
                        <div class="bg-gray-800 p-2 rounded-lg border border-gray-700 group-hover:border-neon-blue transition-colors shadow-inner flex-shrink-0">
                            <i class="fa-solid fa-user text-neon-blue text-lg"></i>
                        </div>
                        <span class="font-black text-lg text-gray-100 tracking-wide break-words">${person}</span>
                    </div>
                    <div class="pl-12">
                        <div class="grid grid-cols-5 gap-1 mb-2 border-b border-gray-700/50 pb-1">
                            <div class="text-center font-bold text-gray-400 text-[10px]">2023</div>
                            <div class="text-center font-bold text-gray-400 text-[10px]">2024</div>
                            <div class="text-center font-bold text-gray-400 text-[10px]">2025</div>
                            <div class="text-center font-bold text-gray-400 text-[10px]">2026</div>
                            <div class="text-center font-bold text-gray-400 text-[10px]">Up %</div>
                        </div>
                        <div class="grid grid-cols-5 gap-1 items-center">
                            ${mobileButtonsHtml}
                            <div class="flex flex-col items-center justify-center w-full">
                                <span class="font-black text-[11px] ${percentColor} mb-1">${displayPercent}</span>
                                <div class="w-full bg-[#121219] rounded-full h-1.5 shadow-inner border border-gray-700/50 max-w-[30px]">
                                    <div class="${progressColor} h-1.5 rounded-full shadow-[0_0_8px_currentColor]" style="width: ${stats.totalDocs === 0 ? 0 : percent}%; transition: width 0.5s ease;"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>`;
            });

            tbody.innerHTML = pcHtml;
            mobileContainer.innerHTML = mobileHtml;
        }

        function openModal(docType, role, person, year) {
            const projects = window.appData[docType][role][person][year];
            const modal = document.getElementById('modal');
            const modalBox = document.getElementById('modal-box');
            
            const roleIcons = { 
                'PE': 'fa-helmet-safety text-neon-orange', 
                'PI': 'fa-magnifying-glass-chart text-neon-green', 
                'RE': 'fa-user-gear text-neon-purple',
                'QE': 'fa-clipboard-check text-neon-pink'
            };
            
            let docTypeName = 'Documents';
            if(docType === 'VO') docTypeName = 'Variation Orders';
            else if(docType === 'SO') docTypeName = 'Suspension Orders';
            else if(docType === 'COMP') docTypeName = 'Completion Documents';
            else if(docType === 'ACC') docTypeName = 'Acceptance Documents';
            
            document.getElementById('modal-title').innerHTML = `
                <div class="flex items-center gap-3">
                    <i class="fa-solid fa-folder-open text-neon-orange"></i> 
                    <div>
                        <div class="leading-tight">Pending ${docTypeName}</div>
                        <div class="text-sm text-gray-400 font-normal mt-1"><i class="fa-solid ${roleIcons[role]}"></i> ${person} | ${year}</div>
                    </div>
                </div>
            `;

            let bodyHtml = `<div class="grid grid-cols-1 md:grid-cols-2 gap-4">`;
            projects.forEach(p => {
                bodyHtml += `
                <div class="bg-[#1a1a24] p-4 rounded-xl shadow-inner border border-gray-700/50 relative overflow-hidden flex flex-col h-full">
                    <div class="absolute top-0 left-0 w-1 h-full bg-neon-pink"></div>
                    <div class="flex items-center gap-2 mb-3">
                        <i class="fa-solid fa-file-contract text-neon-blue"></i>
                        <span class="font-bold text-gray-100 text-lg leading-tight">Contract ID:<br/>${p.contractId}</span>
                    </div>
                    <div class="bg-[#20202d] rounded-lg p-3 border border-red-500/20 mt-auto">
                        <span class="text-xs text-gray-400 uppercase tracking-wider block mb-2">Missing Files</span>
                        <div class="flex flex-wrap gap-2">
                            ${p.missingDocs.map(doc => `<span class="bg-red-500/10 text-red-400 px-2 py-1 rounded-md text-sm font-bold border border-red-500/30 shadow-sm"><i class="fa-solid fa-cloud-arrow-up mr-1"></i>${doc}</span>`).join('')}
                        </div>
                    </div>
                </div>`;
            });
            bodyHtml += `</div>`;

            document.getElementById('modal-body').innerHTML = bodyHtml;

            modal.classList.remove('hidden');
            modal.classList.add('flex');
            setTimeout(() => {
                modalBox.classList.remove('scale-95');
                modalBox.classList.add('scale-100');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('modal');
            const modalBox = document.getElementById('modal-box');
            
            modalBox.classList.remove('scale-100');
            modalBox.classList.add('scale-95');
            
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }, 200);
        }

        document.getElementById('modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });
    </script>
</body>
</html>
