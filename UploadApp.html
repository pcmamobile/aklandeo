        async function getAccessToken() {
            if (window._cachedToken && window._tokenExpiry > Date.now()) return window._cachedToken;
            const header = { alg: "RS256", typ: "JWT" };
            const now = Math.floor(Date.now() / 1000);
            const claim = { iss: SERVICE_ACCOUNT.client_email, scope: "https://www.googleapis.com/auth/spreadsheets", aud: "https://oauth2.googleapis.com/token", exp: now + 3600, iat: now };
            const b64url = (str) => btoa(str).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
            const encHeader = b64url(JSON.stringify(header));
            const encClaim = b64url(JSON.stringify(claim));
            const unsignedToken = `${encHeader}.${encClaim}`;
            let pemContents = SERVICE_ACCOUNT.private_key.replace("-----BEGIN PRIVATE KEY-----", "").replace("-----END PRIVATE KEY-----", "").replace(/\n/g, '').replace(/\r/g, '');
            const binaryDerString = window.atob(pemContents);
            const binaryDer = new Uint8Array(binaryDerString.length);
            for (let i = 0; i < binaryDerString.length; i++) binaryDer[i] = binaryDerString.charCodeAt(i);
            const key = await window.crypto.subtle.importKey("pkcs8", binaryDer.buffer, { name: "RSASSA-PKCS1-v1_5", hash: "SHA-256" }, false, ["sign"]);
            const signature = await window.crypto.subtle.sign("RSASSA-PKCS1-v1_5", key, new TextEncoder().encode(unsignedToken));
            const encSignature = b64url(String.fromCharCode(...new Uint8Array(signature)));
            const jwt = `${unsignedToken}.${encSignature}`;
            const res = await fetch("https://oauth2.googleapis.com/token", { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: `grant_type=urn%3Aietf%3Aparams%3Aoauth%3Agrant-type%3Ajwt-bearer&assertion=${jwt}` });
            const data = await res.json();
            if (data.access_token) {
                window._cachedToken = data.access_token; window._tokenExpiry = Date.now() + (data.expires_in * 1000) - 60000;
                return data.access_token;
            } else throw new Error("Auth Failed");
        }

        function showLoader(msg) { document.getElementById('loaderText').innerText = msg; document.getElementById('loader').classList.remove('hidden'); }

        async function fetchContractData() {
            const inputId = document.getElementById('contractIdInput').value.trim().toUpperCase();
            if(!inputId) { alert("Please enter a Contract ID."); return; }
            contractId = inputId; showLoader("Searching Database...");

            try {
                const url = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/UPLOAD!A3:ZZ?key=${API_KEY}`;
                const response = await fetch(url); const json = await response.json();
                if (!json.values || json.values.length === 0) throw new Error("No data found.");
                
                const rawHeaders = json.values[0].map(h => String(h).trim());
                const headersUpper = rawHeaders.map(h => h.toUpperCase());
                const idColIndex = headersUpper.indexOf("CONTRACT ID");
                if (idColIndex === -1) throw new Error("Format Error: 'CONTRACT ID' column not found.");
                window._globalHeaders = headersUpper; 

                let documentHeaders = [];
                headersUpper.forEach((h, index) => {
                    if (h.endsWith(" UPLOADED")) {
                        let baseNameUpper = h.replace(" UPLOADED", "").trim();
                        let baseIndex = headersUpper.indexOf(baseNameUpper);
                        if (baseIndex !== -1) documentHeaders.push({ name: rawHeaders[baseIndex], baseIndex: baseIndex, uploadIndex: index });
                    }
                });

                let targetRowIndex = -1;
                for (let i = 1; i < json.values.length; i++) {
                    if (String(json.values[i][idColIndex]).trim().toUpperCase() === contractId) { targetRowIndex = i; break; }
                }

                if (targetRowIndex === -1) { hideLoader(); alert("Contract ID not found in the matrix. Please verify."); return; }
                contractRowNumber = targetRowIndex + 3;

                const rowData = json.values[targetRowIndex];
                currentContractDocs = [];
                documentHeaders.forEach(doc => {
                    let baseVal = rowData[doc.baseIndex] ? String(rowData[doc.baseIndex]).trim() : "";
                    let uploadVal = rowData[doc.uploadIndex] ? String(rowData[doc.uploadIndex]).trim() : "";
                    if (baseVal !== "") currentContractDocs.push({ name: doc.name, uploadVal: uploadVal });
                });

                document.getElementById('displayContractId').innerText = contractId;
                document.getElementById('searchScreen').style.display = 'none';
                document.getElementById('mainScreen').classList.remove('hidden');
                document.getElementById('mainScreen').style.display = 'flex';
                
                hideLoader(); renderList();
            } catch(e) { hideLoader(); alert("Error: " + e.message); }
        }

            currentTab = tab;
            document.getElementById('tab-upload').className = tab === 'upload' ? 'tab-btn tab-active' : 'tab-btn tab-inactive';
            document.getElementById('tab-uploaded').className = tab === 'uploaded' ? 'tab-btn tab-active' : 'tab-btn tab-inactive';
            renderList();
        }

        function formatDocName(name) {
            const match = name.match(/^SI\s*(\d+)$/i);
            if (match) {
                return `Site Instruction ${match[1]} (SI ${match[1]})`;
            }
            return name;
        }

        function renderList() {
            const container = document.getElementById('docListContainer');
            container.innerHTML = ''; let rowIndex = 1;

            currentContractDocs.forEach((doc, idx) => {
                const isUploaded = doc.uploadVal !== "";
                if (currentTab === 'upload' && isUploaded) return; 
                if (currentTab === 'uploaded' && !isUploaded) return; 

                const rowClass = rowIndex % 2 !== 0 ? 'row-odd' : 'row-even';
                const formattedName = formatDocName(doc.name);

                let rowHtml = `
                    <div class="doc-item">
                        <div class="doc-row ${rowClass}">
                            <div class="col-name-wrapper"><div class="col-index">${rowIndex}</div><div class="col-name-text">${formattedName}</div></div>
                `;

                if (currentTab === 'upload') {
                    rowHtml += `
                        <div class="btn-cell">
                            <button class="btn-3d-sphere" title="Upload File" onclick="triggerFilePicker('${doc.name}')">
                                <i class="fa-solid fa-arrow-up"></i><span class="upload-text">Upload</span>
                            </button>
                        </div>
                        <div class="btn-cell">
                            <button class="btn-3d-sphere" title="Use Custom Camera" onclick="openCustomCamera('${doc.name}')">
                                <i class="fa-solid fa-camera"></i>
                            </button>
                        </div>
                    `;
                } else {
                    rowHtml += `
                        <div class="btn-cell">
                            <button class="btn-3d-sphere view-btn" title="View Document" onclick="toggleView('view-${idx}')">
                                <i class="fa-solid fa-eye"></i>
                            </button>
                        </div>
                    `;
                }

                rowHtml += `</div>`; 

                if (currentTab === 'uploaded') {
                    let fileId = doc.uploadVal.split('|')[0].trim();
                    let embedUrl = fileId.startsWith('http') ? fileId : `https://drive.google.com/file/d/${fileId}/preview`;
                    rowHtml += `<div id="view-${idx}" class="accordion-body"><iframe class="accordion-iframe" data-src="${embedUrl}"></iframe></div>`;
                }
                rowHtml += `</div>`; 
                container.innerHTML += rowHtml; rowIndex++;
            });

            if (rowIndex === 1) container.innerHTML = `<div style="text-align:center; padding: 20px; font-weight:bold; color:#666;">No documents found for this view.</div>`;
        }

        function toggleView(id) {
            const el = document.getElementById(id); const iframe = el.querySelector('iframe');
            if (el.classList.contains('open')) el.classList.remove('open');
            else { if (!iframe.src) iframe.src = iframe.getAttribute('data-src'); el.classList.add('open'); }
        }

        function triggerFilePicker(docName) {
            pendingUploadDocType = docName;
            document.getElementById('pdfUploader').click();
        }

        document.getElementById('pdfUploader').addEventListener('change', async function(event) {
            const files = event.target.files; if (!files || files.length === 0) return;
            const docType = pendingUploadDocType;
            showLoader(`Processing ${files.length} file(s)...`);
            try {
                const { PDFDocument } = window.PDFLib; const mergedPdf = await PDFDocument.create();

                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    if (file.type === 'application/pdf') {
                        const arrayBuffer = await file.arrayBuffer();
                        const pdf = await PDFDocument.load(arrayBuffer);
                        const copiedPages = await mergedPdf.copyPages(pdf, pdf.getPageIndices());
                        copiedPages.forEach((page) => mergedPdf.addPage(page));
                    } else if (file.type.startsWith('image/')) {
                        const dataUrl = await new Promise((res, rej) => { const r = new FileReader(); r.onload=e=>res(e.target.result); r.readAsDataURL(file); });
                        const compressed = await compressImage(dataUrl, 1200); 
                        const b64 = compressed.dataUrl.split(',')[1];
                        const imageBytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
                        const image = await mergedPdf.embedJpg(imageBytes);
                        const page = mergedPdf.addPage([compressed.width, compressed.height]);
                        page.drawImage(image, { x: 0, y: 0, width: compressed.width, height: compressed.height });
                    }
                }
                const finalPdfBase64 = await mergedPdf.saveAsBase64();
                await executeUpload(finalPdfBase64, `${contractId} - ${docType}.pdf`, docType);
            } catch (err) { hideLoader(); alert("Error: " + err.message); } finally { event.target.value = ""; }
        });

        let camStream = null;
        let camTrack = null;
        let capturedImages = []; 
        let currentFilter = 'none';
        
        async function openCustomCamera(docName) {
            pendingUploadDocType = docName;
            const formattedName = formatDocName(docName);
            document.getElementById('camTitle').innerText = formattedName;
            document.getElementById('customCameraUI').classList.remove('hidden');
            capturedImages = []; updateGalleryUI(); setCameraFilter('none');
            
            try {
                camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } } });
                const video = document.getElementById('camVideo');
                video.srcObject = camStream;
                camTrack = camStream.getVideoTracks()[0];

                const capabilities = camTrack.getCapabilities();
                if (capabilities.zoom) document.getElementById('zoomControls').style.display = 'flex';
                else document.getElementById('zoomControls').style.display = 'none';
            } catch(err) {
                alert("Camera access denied or unavailable: " + err.message);
                closeCamera();
            }
        }

        function closeCamera() {
            if (camStream) { camStream.getTracks().forEach(track => track.stop()); camStream = null; }
            document.getElementById('customCameraUI').classList.add('hidden');
        }

        function setCameraFilter(filterName) {
            currentFilter = filterName;
            const video = document.getElementById('camVideo');
            video.className = `filter-${filterName}`; 
            
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('f-' + filterName).classList.add('active');
        }

        function setZoom(level) {
            if (!camTrack) return;
            try {
                camTrack.applyConstraints({ advanced: [{ zoom: level }] });
                document.querySelectorAll('.zoom-btn').forEach(b => b.classList.remove('active'));
                document.getElementById('z-' + level).classList.add('active');
            } catch(e) { console.log("Zoom not supported", e); }
        }

        // ==========================================
        // MANUAL CROP INTEGRATION (Cropper.js)
        // ==========================================
        function takeSnapshot() {
            const video = document.getElementById('camVideo');
            const canvas = document.getElementById('camCanvas');
            canvas.width = video.videoWidth; 
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            
            // Apply visual flash to screen to let user know photo was taken
            const ui = document.getElementById('customCameraUI');
            ui.style.background = 'white'; setTimeout(() => ui.style.background = 'black', 100);

            // Apply camera filters to the canvas
            if (currentFilter === 'bw') ctx.filter = 'grayscale(100%) contrast(1.2)';
            else if (currentFilter === 'enhanced') ctx.filter = 'contrast(1.3) saturate(1.4) brightness(1.1)';
            else ctx.filter = 'none';

            // Draw video frame to canvas
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const dataUrl = canvas.toDataURL('image/jpeg', 1.0); // High-res original
            
            // Show the Cropper UI overlay
            document.getElementById('cropperUI').classList.remove('hidden');
            
            // Load the snapped image into the Cropper element
            const imageElement = document.getElementById('imageToCrop');
            imageElement.src = dataUrl;

            // Initialize Cropper.js once image is loaded
            if (cropper) { cropper.destroy(); } 
            
            cropper = new Cropper(imageElement, {
                viewMode: 1,           
                dragMode: 'crop',      
                autoCropArea: 0.9,     // Automatically box 90% of the image initially
                restore: false,
                guides: true,          // Show grid lines to help align text
                center: true,
                highlight: false,
                cropBoxMovable: true,
                cropBoxResizable: true,
                toggleDragModeOnDblclick: false,
            });
        }

        function confirmCrop() {
            if (!cropper) return;
            
            // Extract the cropped portion as a new canvas
            const croppedCanvas = cropper.getCroppedCanvas({
                imageSmoothingEnabled: true,
                imageSmoothingQuality: 'high',
            });
            
            // Convert cropped area to Base64 Image
            const croppedDataUrl = croppedCanvas.toDataURL('image/jpeg', 0.85);
            
            // Push the *CROPPED* image to the gallery instead of full camera frame
            capturedImages.push(croppedDataUrl);
            
            closeCropperUI();
            updateGalleryUI();
        }

        function cancelCrop() {
            closeCropperUI();
        }

        function closeCropperUI() {
            if (cropper) {
                cropper.destroy();
                cropper = null;
            }
            document.getElementById('cropperUI').classList.add('hidden');
        }
        // ==========================================


        function updateGalleryUI() {
            const thumb = document.getElementById('camGalleryThumb');
            const badge = document.getElementById('camBadge');
            const saveBtn = document.getElementById('camSaveBtn');

            if (capturedImages.length > 0) {
                thumb.style.visibility = 'visible'; saveBtn.style.visibility = 'visible';
                badge.innerText = capturedImages.length;
                thumb.style.backgroundImage = `url(${capturedImages[capturedImages.length - 1]})`;
            } else {
                thumb.style.visibility = 'hidden'; saveBtn.style.visibility = 'hidden';
            }
        }

        async function saveCapturedImages() {
            if (capturedImages.length === 0) return;
            const docType = pendingUploadDocType;
            closeCamera();
            showLoader(`Merging ${capturedImages.length} page(s) to PDF...`);

            try {
                const { PDFDocument } = window.PDFLib;
                const mergedPdf = await PDFDocument.create();

                for (let i = 0; i < capturedImages.length; i++) {
                    const dataUrl = capturedImages[i];
                    const compressed = await compressImage(dataUrl, 1200); 
                    const b64 = compressed.dataUrl.split(',')[1];
                    const imageBytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
                    
                    const image = await mergedPdf.embedJpg(imageBytes);
                    const page = mergedPdf.addPage([compressed.width, compressed.height]);
                    page.drawImage(image, { x: 0, y: 0, width: compressed.width, height: compressed.height });
                }

                showLoader("Uploading to Server...");
                const finalPdfBase64 = await mergedPdf.saveAsBase64();
                await executeUpload(finalPdfBase64, `${contractId} - ${docType}.pdf`, docType);
            } catch(err) { hideLoader(); alert("Error processing camera captures: " + err.message); }
        }

        function compressImage(imgData, maxDim) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => {
                    let w = img.width; let h = img.height;
                    if (w > maxDim || h > maxDim) {
                        if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; } 
                        else { w = Math.round((w * maxDim) / h); h = maxDim; }
                    }
                    const canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    resolve({ dataUrl: canvas.toDataURL('image/jpeg', 0.8), width: w, height: h }); 
                };
                img.onerror = reject; img.src = imgData;
            });
        }

        async function executeUpload(base64Data, fileName, docType) {
            try {
                const driveRes = await fetch(UPLOAD_API_URL, { method: 'POST', body: JSON.stringify({ base64Data, fileName, contractId }) });
                const driveData = await driveRes.json();
                if (!driveData.success) throw new Error(driveData.error);
                
                showLoader("Syncing Database...");
                await updateSheetCell(docType.toUpperCase() + " UPLOADED", driveData.fileId);

                let targetDoc = currentContractDocs.find(d => d.name === docType);
                if (targetDoc) targetDoc.uploadVal = driveData.fileId; 
                
                alert("Upload Successful!"); hideLoader(); switchTab('uploaded');
            } catch(error) { hideLoader(); alert("Upload failed: " + error.message); }
        }

        function columnToLetter(column) {
            let temp, letter = '';
            while (column > 0) { temp = (column - 1) % 26; letter = String.fromCharCode(temp + 65) + letter; column = (column - temp - 1) / 26; }
            return letter;
        }

        async function updateSheetCell(colName, newVal) {
            const token = await getAccessToken();
            const colIndex = window._globalHeaders.indexOf(colName);
            if (colIndex < 0) throw new Error(`Column "${colName}" not found.`);
            const colLetter = columnToLetter(colIndex + 1);
            const range = `UPLOAD!${colLetter}${contractRowNumber}`;

            const res = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${range}?valueInputOption=USER_ENTERED`, {
                method: "PUT", headers: { "Authorization": `Bearer ${token}`, "Content-Type": "application/json" },
                body: JSON.stringify({ range: range, majorDimension: "ROWS", values: [[newVal]] })
            });
            if (!res.ok) { const err = await res.json(); throw new Error(err.error.message); } return true;
        }
    </script>
