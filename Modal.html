<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Project Details</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      /* Lively Pastel Palette */
      --pastel-pink: #ffb3ba;
      --pastel-pink-dark: #e68c98;
      --pastel-orange: #ffdfba;
      --pastel-orange-dark: #e6bd8c;
      --pastel-yellow: #fff3ba;
      --pastel-yellow-dark: #e6d88c;
      --pastel-green: #baffc9;
      --pastel-green-dark: #8ce6a3;
      --pastel-blue: #bae1ff;
      --pastel-blue-dark: #8abce6;
      --pastel-purple: #e2cbff;
      --pastel-purple-dark: #c0a3e6;
      
      /* DPWH Pastel Colors for Containers */
      --dpwh-pastel-orange: rgba(255, 231, 204, 0.95);
      --dpwh-pastel-blue: rgba(204, 228, 255, 0.95);
      
      --pcma-ink: #334155;
      --pcma-ring: rgba(0,0,0,.08);
      --footer-h: 85px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { 
      font-family: 'Nunito', sans-serif; 
      margin: 0; 
      /* Alive and Colorful Background Gradient */
      background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 50%, #8ec5fc 100%); 
      background-attachment: fixed;
      color: var(--pcma-ink); 
      overflow-x: hidden;
    }
    
    /* Animations */
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    @keyframes pulse-glow {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1)); }
      50% { transform: scale(1.08); filter: drop-shadow(0 8px 12px rgba(255, 215, 0, 0.4)); }
    }
    @keyframes candy-stripe {
      from { background-position: 0 0; }
      to { background-position: 40px 0; }
    }
    @keyframes popIn {
      0% { transform: scale(0.8) translateY(20px); opacity: 0; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }

    /* Header */
    .pcma-modal-top {
      position: sticky; top: 0; z-index: 5;
      display: flex; align-items: center; justify-content: center;
      gap: 8px;
      background: linear-gradient(135deg, var(--pastel-purple), var(--pastel-blue));
      color: #fff;
      min-height: 50px; padding: 10px;
      border-bottom: 3px solid var(--pastel-purple-dark);
      box-shadow: 0 6px 15px rgba(192, 163, 230, 0.25);
    }
    .pcma-modal-top > :not(.pcma-modal-top-cid):not(.view-toggle-btn) {
      display: none !important;
    }
    .pcma-modal-top-cid { 
      flex: 1; text-align: center;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      font-weight: 900; color: #fff; line-height: 1; 
      font-size: 1.4rem; letter-spacing: 1px; 
      text-shadow: 0 2px 0 var(--pastel-purple-dark), 0 4px 8px rgba(0,0,0,0.2);
    }
    .view-toggle-btn {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.5); border-radius: 8px;
      color: white; width: 34px; height: 34px; padding: 4px;
      display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s;
    }
    .view-toggle-btn:hover { background: rgba(255,255,255,0.3); border-color: white; }

    /* Layout - Reduced padding for edge-to-edge space saving */
    #pcmaModalBody { flex: 1 1 auto; overflow: auto; padding-bottom: calc(var(--footer-h) + 10px); }
    #pcmaModalContent { display: flex; flex-direction: column; gap: 12px; padding: 12px 8px; max-width: 1100px; margin: 0 auto; }
    
    /* Primary Data Grid */
    .pcma-primary { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); 
      gap: 8px; 
      background: linear-gradient(135deg, var(--dpwh-pastel-orange), var(--dpwh-pastel-blue)); 
      backdrop-filter: blur(5px);
      border: 3px solid #ffffff; 
      border-radius: 20px; 
      box-shadow: 0 8px 20px rgba(0,0,0,0.12), 0 4px 0 #cbd5e1; 
      padding: 8px; 
    }
    .pcma-primary-col { 
      background: rgba(255, 255, 255, 0.6); 
      border: 2px solid #ffffff; 
      border-radius: 14px; 
      padding: 6px; 
      display: flex; flex-direction: column; gap: 4px; /* Super close gaps */
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.02);
    }
    .pcma-primary-row { display: flex; align-items: stretch; gap: 4px; }
    
    .pcma-primary-label { 
      flex: 0 0 65px; /* Narrow label since text is under the icon */
      font-size: 0.6rem; font-weight: 900; color: #475569; 
      text-transform: uppercase; letter-spacing: 0px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
      text-align: center; line-height: 1.1;
    }
    /* Restored 3D icon wrapper */
    .icon-3d-wrapper {
      display: inline-flex; align-items: center; justify-content: center;
      width: 26px; height: 26px; border-radius: 8px;
      background: linear-gradient(135deg, #ffffff, #e2e8f0);
      box-shadow: 0 4px 6px rgba(0,0,0,0.1), 0 3px 0 #cbd5e1;
      border: 2px solid #fff;
      font-size: 13px;
      flex-shrink: 0;
    }
    
    .pcma-primary-value { 
      flex: 1; 
      background: #ffffff; 
      border-radius: 10px; 
      padding: 4px 8px; 
      font-weight: 600; 
      font-size: 0.8rem; color: #1e293b; 
      word-break: break-word; 
      border: 2px solid #e2e8f0;
      box-shadow: 0 2px 0 #e2e8f0;
      display: flex; align-items: center; /* Keeps text centered when row stretches */
    }
    .pcma-primary-value.pcma-status { 
      background: linear-gradient(135deg, var(--pastel-orange), var(--pastel-pink)); 
      color: #9f1225; 
      border-color: var(--pastel-pink-dark);
      box-shadow: 0 2px 0 var(--pastel-pink-dark);
      text-transform: uppercase;
      font-weight: 800;
      justify-content: center; text-align: center;
    }

    /* Hero Image */
    .pcma-hero { 
      width: 100%; border-radius: 20px; overflow: hidden; 
      background: #e2e8f0; border: 3px solid #fff; 
      box-shadow: 0 8px 20px rgba(0,0,0,0.1), 0 4px 0 #cbd5e1; 
      position: relative;
      display: flex; justify-content: center; align-items: center;
    }
    .pcma-hero img { 
      width: 100%; height: auto; 
      max-height: 500px; 
      object-fit: contain; display: block; 
    }

    /* Action Buttons - Horizonally Aligned */
    .pcma-action-buttons {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; width: 100%;
    }
    .modal-btn-3d {
      padding: 10px 14px; border-radius: 16px; font-size: 0.9rem; border: none; cursor: pointer;
      font-weight: 900; display: flex; flex-direction: row; align-items: center; justify-content: flex-start;
      gap: 12px; text-transform: uppercase; text-align: left; letter-spacing: 0.5px;
      font-family: 'Nunito', sans-serif; line-height: 1.2;
      transition: all 0.1s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
    }
    .modal-btn-3d span { z-index: 2; text-shadow: 0 2px 2px rgba(255,255,255,0.4); flex: 1; }
    .modal-btn-3d svg { 
      width: 38px; height: 38px; z-index: 2; flex-shrink: 0;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.15));
    }
    
    .btn-docs-3d { 
      background: linear-gradient(145deg, var(--pastel-yellow), #ffeb85); color: #8a7300; 
      border: 2px solid #e6d88c; box-shadow: 0 6px 0 #d4c570, 0 10px 15px rgba(212, 197, 112, 0.3); 
    }
    .btn-docs-3d:active { transform: translateY(6px); box-shadow: 0 0 0 #d4c570, 0 4px 8px rgba(212, 197, 112, 0.3); }
    .btn-docs-3d svg { animation: float 3s ease-in-out infinite; }

    .btn-upload-3d { 
      background: linear-gradient(145deg, var(--pastel-blue), #9ecef5); color: #00569f; 
      border: 2px solid #8abce6; box-shadow: 0 6px 0 #73aada, 0 10px 15px rgba(115, 170, 218, 0.3); 
    }
    .btn-upload-3d:active { transform: translateY(6px); box-shadow: 0 0 0 #73aada, 0 4px 8px rgba(115, 170, 218, 0.3); }
    .btn-upload-3d svg { animation: float 3.5s ease-in-out infinite 0.5s; }

    /* Awesome 3D Energy Mini Bars */
    .pcma-mini-bars { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; background: linear-gradient(135deg, var(--dpwh-pastel-orange), var(--dpwh-pastel-blue)); padding: 10px; border-radius: 20px; box-shadow: 0 6px 15px rgba(0,0,0,0.1), 0 4px 0 #cbd5e1; border: 3px solid #ffffff; backdrop-filter: blur(5px);}
    .pcma-mini-row { display: flex; align-items: center; gap: 8px; }
    .pcma-mini-label { width: 90px; text-align: left; font-weight: 900; color: #475569; font-size: 0.75rem; text-transform: uppercase; display: flex; align-items: center; gap: 4px; }
    .pcma-mini-bar { 
      flex: 1; height: 22px; background: #0f172a; border-radius: 999px; overflow: hidden; 
      box-shadow: inset 0 3px 6px rgba(0,0,0,0.8); border: 2px solid rgba(255,255,255,0.7); 
    }
    .pcma-mini-fill { 
      height: 100%; width: 0%; display: flex; align-items: center; justify-content: center; 
      font-size: 0.75rem; font-weight: 900; color: #fff; transition: width 1s cubic-bezier(0.34, 1.56, 0.64, 1); 
      white-space: nowrap; padding: 0 8px; border-radius: 999px; min-width: 65px; /* Ensures text like '0.00%' is never fully squished out of view */
      background-image: linear-gradient(45deg, rgba(255,255,255,0.3) 25%, transparent 25%, transparent 50%, rgba(255,255,255,0.3) 50%, rgba(255,255,255,0.3) 75%, transparent 75%, transparent);
      background-size: 20px 20px;
      animation: candy-stripe 1s linear infinite;
      text-shadow: 0 1px 2px rgba(0,0,0,0.8); 
    }

    .pcma-progress { margin-top: 4px; }
    .pcma-progress-label { font-weight: 900; color: #1e293b; margin-bottom: 4px; font-size: 0.9rem; text-align: center; text-transform: uppercase; letter-spacing: 0.5px;}
    .pcma-progress-bar { 
      width: 100%; background: #0f172a; border-radius: 16px; height: 28px; overflow: hidden; 
      box-shadow: inset 0 3px 8px rgba(0,0,0,0.8); border: 2px solid rgba(255,255,255,0.7); 
    }
    .pcma-progress-fill { 
      height: 100%; border-radius: 14px; text-align: center; line-height: 24px; font-weight: 900; color: #fff; 
      font-size: 0.9rem; width: 0%; transition: width 1.2s cubic-bezier(0.34, 1.56, 0.64, 1); white-space: nowrap; 
      min-width: 65px;
      background-image: linear-gradient(45deg, rgba(255,255,255,0.3) 25%, transparent 25%, transparent 50%, rgba(255,255,255,0.3) 50%, rgba(255,255,255,0.3) 75%, transparent 75%, transparent);
      background-size: 25px 25px;
      animation: candy-stripe 1s linear infinite;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8); 
    }

    /* Team Section */
    .pcma-team { 
      background: linear-gradient(135deg, var(--dpwh-pastel-orange), var(--dpwh-pastel-blue)); border: 3px solid #ffffff; border-radius: 20px; 
      padding: 10px; margin-top: 4px; box-shadow: 0 6px 15px rgba(0,0,0,0.1), 0 4px 0 #cbd5e1; 
      backdrop-filter: blur(5px);
    }
    .pcma-team-label { font-weight: 900; color: #334155; display: block; margin-bottom: 8px; font-size: 0.85rem; text-transform: uppercase; text-align: center; letter-spacing: 0.5px;}
    .team-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
    .team-member {
      display: flex; flex-direction: row; align-items: center; justify-content: center; 
      padding: 4px 10px; border-radius: 50px; border: 2px solid; background: #fff;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: default; gap: 6px;
    }
    .team-member:hover { transform: translateY(-2px); }
    .team-role { font-size: 0.6rem; font-weight: 900; text-transform: uppercase; padding: 2px 6px; border-radius: 999px; color: #fff; text-shadow: 0 1px 1px rgba(0,0,0,0.2); }
    .team-name { font-size: 0.75rem; font-weight: 800; color: #1e293b; white-space: nowrap;}

    /* Photos Grid */
    #pcmaModalPhotos { padding: 0 8px 80px; max-width: 1100px; margin: 0 auto; }
    .photo-section-title {
      font-weight: 900; font-size: 1rem; color: #1e293b; padding: 8px 0; 
      border-bottom: 3px solid rgba(255,255,255,0.5); margin: 15px 0 10px; text-transform: uppercase; letter-spacing: 1px; text-align: center;
    }
    .pcma-photo-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
    .pcma-photo-card { 
      display: flex; flex-direction: column; background: linear-gradient(135deg, var(--dpwh-pastel-orange), var(--dpwh-pastel-blue)); border: 3px solid #ffffff; 
      border-radius: 18px; padding: 10px; box-shadow: 0 8px 15px rgba(0,0,0,0.1), 0 4px 0 #cbd5e1; 
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); backdrop-filter: blur(5px);
    }
    .pcma-photo-card:hover { transform: translateY(-4px); border-color: var(--pastel-blue-dark); box-shadow: 0 12px 20px rgba(0,0,0,0.15), 0 4px 0 var(--pastel-blue-dark); }
    
    .pcma-photo-card img { 
      width: 100%; height: auto; object-fit: contain; 
      border-radius: 12px; margin-bottom: 10px; background: rgba(255,255,255,0.5); cursor: pointer; border: 2px solid #ffffff;
    }
    .pcma-photo-card img:hover { opacity: 0.9; }
    
    .pcma-photo-set-btns { display: flex; flex-direction: row; gap: 6px; width: 100%; justify-content: center; }
    .action-btn-3d { 
      flex: 1; padding: 6px; border: 2px solid; border-radius: 10px; 
      font-size: 0.6rem; font-weight: 900; cursor: pointer; color: #fff; 
      display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 4px;
      text-transform: uppercase; transition: all 0.1s;
      font-family: 'Nunito', sans-serif;
      text-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }
    .action-btn-3d svg { width: 12px; height: 12px; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.2)); }
    .action-btn-3d:active { transform: translateY(3px); box-shadow: 0 0 0 !important; }
    
    .btn-mini-icon { 
      background: linear-gradient(135deg, var(--pastel-purple), #b388ff); border-color: var(--pastel-purple-dark);
      box-shadow: 0 3px 0 var(--pastel-purple-dark); color: #4a148c; text-shadow: 0 1px 1px rgba(255,255,255,0.5);
    }
    .btn-mini-icon svg { animation: float 2.5s ease-in-out infinite; }

    .btn-main-photo { 
      background: linear-gradient(135deg, var(--pastel-orange), #ffb74d); border-color: var(--pastel-orange-dark);
      box-shadow: 0 3px 0 var(--pastel-orange-dark); color: #995c00; text-shadow: 0 1px 1px rgba(255,255,255,0.5);
    }
    .btn-main-photo svg { animation: pulse-glow 2s infinite; }

    /* Custom 3D Confirm Modal */
    .confirm-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(4px);
      display: none; align-items: center; justify-content: center; z-index: 100;
    }
    .confirm-modal-3d {
      background: #fff; border: 3px solid #e2e8f0; border-radius: 20px;
      padding: 20px; max-width: 300px; width: 90%; text-align: center;
      box-shadow: 0 15px 30px rgba(0,0,0,0.2), 0 6px 0 #cbd5e1;
      animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .confirm-msg { font-size: 0.95rem; font-weight: 900; color: #1e293b; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 0.5px;}
    .confirm-btns { display: flex; gap: 10px; justify-content: center; }
    .confirm-btn-yes, .confirm-btn-no {
      flex: 1; padding: 8px; border-radius: 12px; font-weight: 900; border: none; cursor: pointer;
      font-family: 'Nunito', sans-serif; text-transform: uppercase; font-size: 0.75rem;
      transition: all 0.1s; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }
    .confirm-btn-yes {
      background: linear-gradient(135deg, var(--pastel-green), #6bd687); 
      border: 2px solid var(--pastel-green-dark); box-shadow: 0 3px 0 var(--pastel-green-dark); color: #004d1a;
    }
    .confirm-btn-no {
      background: linear-gradient(135deg, var(--pastel-pink), #ff8c99);
      border: 2px solid var(--pastel-pink-dark); box-shadow: 0 3px 0 var(--pastel-pink-dark); color: #660011;
    }
    .confirm-btn-yes:active { transform: translateY(3px); box-shadow: 0 0 0 !important; }
    .confirm-btn-no:active { transform: translateY(3px); box-shadow: 0 0 0 !important; }

    /* --- MOBILE LAYOUT & LOW-SPEC PERFORMANCE OPTIMIZATIONS --- */
    body.is-mobile-view .pcma-photo-grid { 
      grid-template-columns: 1fr; 
    }
    body.is-mobile-view .pcma-action-buttons {
      gap: 8px;
    }
    body.is-mobile-view .modal-btn-3d { 
      padding: 8px 10px; font-size: 0.75rem; gap: 8px; border-radius: 12px; 
    }
    body.is-mobile-view .modal-btn-3d svg { 
      width: 28px; height: 28px; 
    }
    body.is-mobile-view .pcma-mini-label { 
      width: 80px; font-size: 0.65rem; 
    }

    /* Disable heavy GPU tasks on mobile devices to prevent lag */
    body.is-mobile-view * {
      backdrop-filter: none !important; /* Disables heavy glass blur recalculations */
    }
    body.is-mobile-view .pcma-mini-fill,
    body.is-mobile-view .pcma-progress-fill {
      animation: none !important; /* Stops the constant background repaints */
      box-shadow: none !important; /* Removes the glowing shadow which eats GPU */
    }
    body.is-mobile-view .pcma-mini-bar,
    body.is-mobile-view .pcma-progress-bar {
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.5) !important; /* Lighter inset shadow for mobile */
      background: #1e293b !important; /* Solid dark background */
    }
    body.is-mobile-view .btn-docs-3d svg,
    body.is-mobile-view .btn-upload-3d svg,
    body.is-mobile-view .btn-mini-icon svg,
    body.is-mobile-view .btn-main-photo svg {
      animation: none !important; /* Stops SVGs from continuously floating/pulsing */
    }
  </style>
</head>
<body>

  <div class="pcma-modal-top">
    <div id="pcmaModalCID" class="pcma-modal-top-cid">—</div>
    <button id="viewToggleBtn" class="view-toggle-btn" onclick="toggleViewMode()" title="Toggle PC/Mobile View">
      <svg id="viewModeIcon" viewBox="0 0 24 24" fill="currentColor"></svg>
    </button>
  </div>
  
  <div id="pcmaModalBody">
    <div id="pcmaModalContent"></div>
    <div id="pcmaModalPhotos"></div>
  </div>

  <!-- Custom 3D Confirm Modal -->
  <div id="customConfirmOverlay" class="confirm-overlay">
    <div class="confirm-modal-3d">
      <div id="customConfirmMessage" class="confirm-msg"></div>
      <div class="confirm-btns">
        <button id="customConfirmNo" class="confirm-btn-no">Cancel</button>
        <button id="customConfirmYes" class="confirm-btn-yes">Yes, Set It!</button>
      </div>
    </div>
  </div>

  <!-- Hidden SVGs -->
  <template id="svg-details">
    <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="detGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#FFD166" />
          <stop offset="100%" stop-color="#FF9F1C" />
        </linearGradient>
        <linearGradient id="detGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#4facfe" />
          <stop offset="100%" stop-color="#00f2fe" />
        </linearGradient>
      </defs>
      <!-- Document Base -->
      <rect x="15" y="15" width="55" height="70" rx="8" fill="url(#detGrad1)"/>
      <rect x="25" y="30" width="35" height="6" rx="3" fill="#ffffff" opacity="0.8"/>
      <rect x="25" y="45" width="25" height="6" rx="3" fill="#ffffff" opacity="0.8"/>
      <rect x="25" y="60" width="30" height="6" rx="3" fill="#ffffff" opacity="0.8"/>
      <!-- Magnifying Glass -->
      <circle cx="70" cy="65" r="22" fill="url(#detGrad2)" stroke="#ffffff" stroke-width="5"/>
      <path d="M85 80 L98 93" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
      <!-- Inner Glass Reflection -->
      <circle cx="65" cy="60" r="8" fill="#ffffff" opacity="0.4"/>
    </svg>
  </template>

  <template id="svg-upload">
    <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#FFFFFF" />
          <stop offset="100%" stop-color="#bae1ff" />
        </linearGradient>
      </defs>
      <path d="M75 65 A 15 15 0 0 0 75 35 A 25 25 0 0 0 35 30 A 20 20 0 0 0 25 65 Z" fill="url(#cloudGrad)"/>
      <path d="M50 70 L50 40 M40 50 L50 40 L60 50" stroke="#00569f" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </template>

  <template id="svg-wand">
    <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="wandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#F48FB1" />
          <stop offset="100%" stop-color="#BA68C8" />
        </linearGradient>
      </defs>
      <path d="M30 70 L70 30" stroke="url(#wandGrad)" stroke-width="12" stroke-linecap="round"/>
      <circle cx="75" cy="25" r="8" fill="#FFF59D"/>
      <path d="M80 15 L85 10 M85 30 L90 35 M65 15 L60 10 M65 35 L60 40" stroke="#FFF59D" stroke-width="4" stroke-linecap="round"/>
    </svg>
  </template>

  <template id="svg-star">
    <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#FFE082" />
          <stop offset="100%" stop-color="#FF8F00" />
        </linearGradient>
      </defs>
      <path d="M50 15 L60 40 L85 40 L65 55 L75 80 L50 65 L25 80 L35 55 L15 40 L40 40 Z" fill="url(#starGrad)"/>
    </svg>
  </template>

  <script>
    const LOGO_FALLBACK = "https://drive.google.com/thumbnail?id=1VanVX82ANGfKA8jcGZL8cVDQh4EuN8-r&sz=s800";
    const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbwE2zVf654nTieExX174j6eTPG5-BaVINGQIszgfe5sLvDvJARL-u2k0vQk_DlYukExNg/exec";

    const svgMobile = `<path d="M17 1.01L7 1c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14z"/>`;
    const svgPC = `<path d="M21 2H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h7l-2 3v1h8v-1l-2-3h7c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H3V4h18v12z"/>`;

    function checkInitialView() {
      if (window.innerWidth <= 600) {
          document.body.classList.add('is-mobile-view');
      } else {
          document.body.classList.remove('is-mobile-view');
      }
      updateViewIcon();
    }

    function toggleViewMode() {
        document.body.classList.toggle('is-mobile-view');
        updateViewIcon();
        
        const meta = document.querySelector('meta[name="viewport"]');
        if (document.body.classList.contains('is-mobile-view')) {
            meta.setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no');
        } else {
            // Force viewport to zoom out simulating a desktop view on mobile phones
            meta.setAttribute('content', 'width=1024, initial-scale=1.0');
        }
    }

    function updateViewIcon() {
        const icon = document.getElementById('viewModeIcon');
        if (document.body.classList.contains('is-mobile-view')) {
            // If in mobile mode, display PC icon to suggest switching back
            icon.innerHTML = svgPC;
        } else {
            // If in PC mode, display Mobile icon to suggest switching back
            icon.innerHTML = svgMobile;
        }
    }

    let currentHeaders = [];

    function init() {
      checkInitialView();
      const rowStr = localStorage.getItem('pcma_modal_row');
      const headersStr = localStorage.getItem('pcma_modal_headers');
      if (rowStr && headersStr) {
          const row = JSON.parse(rowStr);
          currentHeaders = JSON.parse(headersStr);
          renderModal(row);
      }
    }

    window.addEventListener('message', (e) => {
      if (e.data && e.data.type === 'RENDER') {
          currentHeaders = e.data.headers || [];
          renderModal(e.data.row);
          window.scrollTo(0, 0);
      }
    });

    window.onload = init;

    // UPGRADED FINDCOL: Prioritizes exact matches to prevent grabbing "Actual Start" when looking for "Actual"
    function findCol(...keys) {
      const lowerKeys = keys.map(k => String(k).toLowerCase().trim());
      
      // 1. Exact Match Priority
      let exactIdx = currentHeaders.findIndex(h => {
        const headerTrimmed = String(h || '').toLowerCase().trim();
        return lowerKeys.includes(headerTrimmed);
      });
      if (exactIdx !== -1) return exactIdx;
      
      // 2. Starts With/Includes Match & Filter false positives (dates/targets)
      let robustIdx = currentHeaders.findIndex(h => {
        const headerStr = String(h || '').toLowerCase().trim();
        const isDateCol = ['date', 'start', 'end', 'finish', 'target'].some(w => headerStr.includes(w));
        const searchingDate = lowerKeys.some(k => ['date', 'start', 'end', 'finish', 'target'].some(w => k.includes(w)));
        
        // Prevent grabbing "Actual Start Date" when looking for just "Actual"
        if (isDateCol && !searchingDate) return false;
        
        return lowerKeys.some(k => headerStr.includes(k));
      });
      if (robustIdx !== -1) return robustIdx;

      // 3. Absolute fallback
      return currentHeaders.findIndex(h => {
        const headerStr = String(h || '').toLowerCase();
        return lowerKeys.some(k => headerStr.includes(k));
      });
    }

    function createPrimaryRow(label, value, isStatus, emoji) {
      const r = document.createElement('div');
      r.className = 'pcma-primary-row';
      
      const l = document.createElement('div');
      l.className = 'pcma-primary-label';
      
      if (emoji) {
        const iconSpan = document.createElement('span');
        iconSpan.className = 'icon-3d-wrapper';
        iconSpan.textContent = emoji;
        l.appendChild(iconSpan);
      }
      
      const textSpan = document.createElement('span');
      textSpan.textContent = label;
      l.appendChild(textSpan);
      
      const v = document.createElement('div');
      v.className = 'pcma-primary-value';
      if (isStatus) v.classList.add('pcma-status');
      v.textContent = value;
      
      r.append(l, v);
      return r;
    }

    function toMoney(n) {
      if (n == null || n === '') return null;
      const s = String(n).replace(/[^0-9.\-]/g, '');
      const f = parseFloat(s);
      if (Number.isNaN(f)) return null;
      try { return '₱ ' + f.toLocaleString('en-PH', { minimumFractionDigits: 2 }); } catch { return '₱ ' + f; }
    }

    function toDate(v) {
      if (!v) return '';
      const d = new Date(v);
      return isNaN(d) ? String(v) : d.toLocaleDateString('en-PH', { year:'numeric', month:'short', day:'2-digit' });
    }

    function animateBar(fillEl, value, duration, formatter) {
      const sign = value < 0 ? -1 : 1;
      const endAbs = Math.min(Math.abs(value), 100);
      const start = performance.now();
      function step(now) {
        const t = Math.min(1, (now - start) / duration);
        const cur = endAbs * t;
        fillEl.style.width = cur + '%';
        const disp = sign * cur;
        fillEl.textContent = formatter ? formatter(disp) : `${disp.toFixed(2)}%`
        if (t < 1) requestAnimationFrame(step);
        else {
          fillEl.style.width = endAbs + '%';
          fillEl.textContent = formatter ? formatter(sign * endAbs) : `${(sign * endAbs).toFixed(2)}%`;
        }
      }
      requestAnimationFrame(step);
    }

    // New configuration for energetic 3D glowing bars
    const slipColor = (num) => {
      if (num > 0) return { bg: 'linear-gradient(90deg, #0ba360, #3cb0fd)', text: '#fff', glow: '#0ba360', sad: false };
      if (num <= 0 && num > -5)  return { bg: 'linear-gradient(90deg, #f6d365, #fda085)', text: '#fff', glow: '#f6d365', sad: false };
      if (num <= -5 && num > -10) return { bg: 'linear-gradient(90deg, #ff0844, #ffb199)', text: '#fff', glow: '#ff0844', sad: true };
      if (num <= -10) return { bg: 'linear-gradient(90deg, #b224ef, #7579ff)', text: '#fff', glow: '#b224ef', sad: true };
      return { bg: 'linear-gradient(90deg, #cbd5e1, #94a3b8)', text: '#fff', glow: '#cbd5e1', sad: false };
    };

    function isValidUrl(u) { try { const x = new URL(u); return x.protocol === "http:" || x.protocol === "https:"; } catch { return false; } }

    function toPct(val, fallback = 0) { 
        if (val == null) return fallback; 
        const m = String(val).replace(",", ".").match(/-?\d+(\.\d+)?/); 
        return m ? parseFloat(m[0]) : fallback; 
    }

    function show3DConfirm(message) {
      return new Promise((resolve) => {
        const overlay = document.getElementById('customConfirmOverlay');
        const msgEl = document.getElementById('customConfirmMessage');
        const btnYes = document.getElementById('customConfirmYes');
        const btnNo = document.getElementById('customConfirmNo');

        msgEl.textContent = message;
        overlay.style.display = 'flex';

        btnYes.onclick = () => { overlay.style.display = 'none'; resolve(true); };
        btnNo.onclick = () => { overlay.style.display = 'none'; resolve(false); };
      });
    }

    async function setPhotoToSheet(contractId, column, fileId, btn) {
        let msg = column === 'Image 1' ? "Set as Mini Icon?" : "Set as Top Main Photo?";
        const isConfirmed = await show3DConfirm(msg);
        
        if (!isConfirmed) return;

        const originalHTML = btn.innerHTML;
        btn.innerHTML = "<span>Saving...</span>";
        btn.disabled = true;

        try {
            const res = await fetch(GAS_WEBAPP_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: `action=setImage&contractId=${encodeURIComponent(contractId)}&columnName=${encodeURIComponent(column)}&fileId=${encodeURIComponent(fileId)}`
            });
            const data = await res.json();
            if (data.status === 'success') {
                alert(`${column} updated successfully! Reloading data...`);
                window.parent.postMessage({ type: 'RELOAD_APP' }, '*');
            } else {
                alert(`Failed to update image: ${data.message}`);
            }
        } catch (err) {
            alert(`Network error: ${err.message}`);
        } finally {
            btn.innerHTML = originalHTML;
            btn.disabled = false;
        }
    }

    function renderModal(row) {
      if (!row) return;

      const modalContent   = document.getElementById('pcmaModalContent');
      const modalPhotos    = document.getElementById('pcmaModalPhotos');
      const modalCID       = document.getElementById('pcmaModalCID');

      modalContent.innerHTML = '';
      modalPhotos.innerHTML = '';

      const cidIdx     = findCol('contract id');
      const projIdx    = findCol('project name');
      const locIdx     = findCol('location');
      const contIdx    = findCol('contractor');
      const amtIdx     = findCol('contract amount','amount');
      const revAmtIdx  = findCol('rev. contract amount','revised contract amount','rev contract amount');
      const ntpIdx     = findCol('notice to proceed','ntp');
      const expIdx     = findCol('expiry date','original expiry date');
      const revExpIdx  = findCol('rev. expiry date','revised expiry date','rev expiry date');
      const statIdx    = findCol('status');
      const remIdx     = findCol('remarks');
      const lastBillIdx= findCol('last billing');
      const projIdIdx  = findCol('Project ID', 'proj id', 'projectid');
      const uploadCol  = findCol('upload pictures');

      const peIdx = findCol('project engineer');
      const piIdx = findCol('project inspector');
      const reIdx = findCol('resident engineer');
      const qeIdx = findCol('quantity engineer');
      const meIdx = findCol('materials engineer');

      // Enhanced search targets
      const schedIdx = findCol('sched', 'schedule');
      const actualIdx= findCol('actual', 'actual %', 'actual accomplishment', 'accomp', 'accomplishment'); 
      const slipIdx  = findCol('slip', 'slippage');
      const delayIdx = findCol('delay');
      let   progIdx  = findCol('progress');
      
      if (progIdx < 0 && currentHeaders.length > 18) progIdx = 18;

      const currentCid = (cidIdx >= 0 ? String(row[cidIdx]).trim() : '');
      modalCID.textContent = currentCid || '—';

      const img2Idx = findCol('image 2');
      let rawImg2 = (img2Idx > -1 && row[img2Idx]) ? String(row[img2Idx]).trim() : '';
      
      let heroImgUrl = rawImg2;
      if (rawImg2 && !rawImg2.startsWith('http')) {
          heroImgUrl = `https://drive.google.com/thumbnail?id=${rawImg2}&sz=s800`;
      }

      if (heroImgUrl) {
        const wrap = document.createElement('div');
        wrap.className = 'pcma-hero';
        const im = document.createElement('img');
        im.src = heroImgUrl;
        im.onerror = () => { im.src = LOGO_FALLBACK; };
        wrap.appendChild(im);
        modalContent.appendChild(wrap);
      }

      // --- Buttons (More Details & Upload Photos) placed AFTER hero image ---
      const actionBtns = document.createElement('div');
      actionBtns.className = 'pcma-action-buttons';

      let docsBtn = document.createElement('button');
      docsBtn.id = 'projectDocsBtn';
      docsBtn.type = 'button';
      docsBtn.innerHTML = document.getElementById('svg-details').innerHTML + '<span>More Details</span>';
      docsBtn.className = 'modal-btn-3d btn-docs-3d';
      docsBtn.onclick = () => {
        window.parent.postMessage({ type: 'OPEN_DOCS', cid: currentCid }, '*');
      };
      actionBtns.appendChild(docsBtn);
      
      if (uploadCol > -1) {
        const link = String(row[uploadCol] || '').trim();
        if (link && isValidUrl(link)) {
          let uploadBtn = document.createElement('button');
          uploadBtn.id = 'pcmaUploadBtn';
          uploadBtn.type = 'button';
          uploadBtn.innerHTML = document.getElementById('svg-upload').innerHTML + '<span>Upload Photos</span>';
          uploadBtn.className = 'modal-btn-3d btn-upload-3d';
          uploadBtn.onclick = () => { 
            window.parent.postMessage({ type: 'OPEN_UPLOAD', cid: currentCid, link: link }, '*');
          };
          actionBtns.appendChild(uploadBtn);
        }
      }
      modalContent.appendChild(actionBtns);

      // --- Primary Data Container placed AFTER action buttons ---
      const primary = document.createElement('div');
      primary.className = 'pcma-primary';

      const colA = document.createElement('div');
      colA.className = 'pcma-primary-col';
      if (projIdx > -1 && row[projIdx]) colA.appendChild(createPrimaryRow('Project', row[projIdx], false, '🏗️'));
      if (locIdx  > -1 && row[locIdx])  colA.appendChild(createPrimaryRow('Location', row[locIdx], false, '📍'));
      if (contIdx > -1 && row[contIdx]) colA.appendChild(createPrimaryRow('Contractor', row[contIdx], false, '👷'));

      const colB = document.createElement('div');
      colB.className = 'pcma-primary-col';
      if (amtIdx > -1 && row[amtIdx])     colB.appendChild(createPrimaryRow('Amount', toMoney(row[amtIdx]) ?? row[amtIdx], false, '💰'));
      if (revAmtIdx > -1 && row[revAmtIdx]) colB.appendChild(createPrimaryRow('Rev. Amt', toMoney(row[revAmtIdx]) ?? row[revAmtIdx], false, '🪙'));

      const colC = document.createElement('div');
      colC.className = 'pcma-primary-col';
      if (ntpIdx > -1 && row[ntpIdx])  colC.appendChild(createPrimaryRow('NTP', toDate(row[ntpIdx]), false, '🚀'));
      if (expIdx > -1 && row[expIdx])  colC.appendChild(createPrimaryRow('Expiry', toDate(row[expIdx]), false, '⏳'));
      if (revExpIdx > -1 && row[revExpIdx]) colC.appendChild(createPrimaryRow('Rev. Expiry', toDate(row[revExpIdx]), false, '⏱️'));
      if (statIdx > -1 && row[statIdx]) colC.appendChild(createPrimaryRow('Status', row[statIdx], true, '📊'));

      const colD = document.createElement('div');
      colD.className = 'pcma-primary-col';
      if (remIdx > -1 && row[remIdx])        colD.appendChild(createPrimaryRow('Remarks', row[remIdx], false, '📝'));
      if (lastBillIdx > -1 && row[lastBillIdx]) colD.appendChild(createPrimaryRow('Last Bill', row[lastBillIdx], false, '🧾'));
      if (projIdIdx > -1 && row[projIdIdx])      colD.appendChild(createPrimaryRow('Proj ID', row[projIdIdx], false, '🏷️'));

      if (colA.children.length) primary.appendChild(colA);
      if (colB.children.length) primary.appendChild(colB);
      if (colC.children.length) primary.appendChild(colC);
      if (colD.children.length) primary.appendChild(colD);
      modalContent.appendChild(primary);

      // Photos Gallery
      const compIdx = findCol('completed');
      const onGoingIdx = findCol('on-going', 'ongoing');
      const mobIdx = findCol('mobilization');

      const photosData = [
        { label: 'Completed', val: compIdx > -1 ? row[compIdx] : '' },
        { label: 'On-Going', val: onGoingIdx > -1 ? row[onGoingIdx] : '' },
        { label: 'Mobilization', val: mobIdx > -1 ? row[mobIdx] : '' }
      ];

      let hasPhotos = false;
      let html = '';

      const wandSvg = document.getElementById('svg-wand').innerHTML;
      const starSvg = document.getElementById('svg-star').innerHTML;

      photosData.forEach(p => {
        if (!p.val) return;
        const rawString = String(p.val).trim();
        if (!rawString) return;
        
        const parts = rawString.split('|');
        let ids = [];
        parts.forEach(part => {
           const match = part.match(/[-\w]{25,}/);
           if (match) ids.push(match[0]);
        });

        if (ids.length > 0) {
            hasPhotos = true;
            html += `<div style="margin-top: 6px;">`;
            html += `<div class="photo-section-title">${p.label}</div>`;
            html += `<div class="pcma-photo-grid">`;
            ids.forEach(id => {
                const thumbUrl = `https://drive.google.com/thumbnail?id=${id}&sz=s800`;
                const fullUrl = `https://drive.google.com/file/d/${id}/view`;
                html += `
                  <div class="pcma-photo-card">
                    <img src="${thumbUrl}" loading="lazy" onerror="this.src='${LOGO_FALLBACK}'" onclick="window.open('${fullUrl}', '_blank', 'noopener')" />
                    <div class="pcma-photo-set-btns">
                      <button class="action-btn-3d btn-mini-icon" onclick="setPhotoToSheet('${currentCid}', 'Image 1', '${id}', this)">
                        ${wandSvg}
                        <span>Mini Icon</span>
                      </button>
                      <button class="action-btn-3d btn-main-photo" onclick="setPhotoToSheet('${currentCid}', 'Image 2', '${id}', this)">
                        ${starSvg}
                        <span>Main Photo</span>
                      </button>
                    </div>
                  </div>
                `;
            });
            html += `</div></div>`;
        }
      });

      if (!hasPhotos) {
          modalPhotos.innerHTML = '<div style="text-align:center; padding:20px; color:#94a3b8; font-weight:800; font-size:0.9rem; border:3px dashed #ffffff; border-radius:16px; background:linear-gradient(135deg, var(--dpwh-pastel-orange), var(--dpwh-pastel-blue)); backdrop-filter:blur(5px);">No photos uploaded yet.</div>';
      } else {
          modalPhotos.innerHTML = html;
      }

      // Progress & 3D Glowing Neon Energy Bars
      
      // Fixed conditionals to not skip the value if it's technically a "0" or "0.00"
      const hasSched = schedIdx > -1 && row[schedIdx] !== undefined && row[schedIdx] !== null && String(row[schedIdx]).trim() !== '';
      const hasActual= actualIdx > -1 && row[actualIdx] !== undefined && row[actualIdx] !== null && String(row[actualIdx]).trim() !== '';
      const hasSlip  = slipIdx > -1 && row[slipIdx] !== undefined && row[slipIdx] !== null && String(row[slipIdx]).trim() !== '';

      if (hasSched || hasActual || hasSlip) {
        const mini = document.createElement('div');
        mini.className = 'pcma-mini-bars';

        function addMini(label, val, config, isSlippage){
          const r = document.createElement('div'); r.className = 'pcma-mini-row';
          const lab = document.createElement('div'); lab.className = 'pcma-mini-label'; lab.textContent = label;
          const bar = document.createElement('div'); bar.className = 'pcma-mini-bar';
          const fill= document.createElement('div'); fill.className = 'pcma-mini-fill';
          bar.appendChild(fill); r.append(lab, bar); mini.appendChild(r);

          const num = toPct(val);
          let cfg = config;
          if (isSlippage){
            cfg = slipColor(num);
          }
          
          fill.style.background = cfg.bg;
          // Apply vibrant inner glow & box-shadow matching the custom energy gradient color
          fill.style.boxShadow = `inset 0 2px 4px rgba(255,255,255,0.5), 0 0 10px ${cfg.glow}`;

          animateBar(fill, num, 800, v => `${v.toFixed(2)}%${isSlippage && cfg.sad && v <= -10 ? ' ☹️' : ''}`);
        }

        if (hasSched)  addMini('🗓️ SCHED',    row[schedIdx],  {bg: 'linear-gradient(90deg, #00c6ff, #0072ff)', glow: '#00c6ff'}, false);
        if (hasActual) addMini('⚡ ACTUAL',   row[actualIdx], {bg: 'linear-gradient(90deg, #11998e, #38ef7d)', glow: '#38ef7d'}, false);
        if (hasSlip)   addMini('⚠️ SLIPPAGE', row[slipIdx],   null,      true);

        const progRaw  = (progIdx > -1 && row[progIdx] !== undefined && row[progIdx] !== null) ? String(row[progIdx]).trim() : '';
        const delayRaw = (delayIdx > -1 && row[delayIdx] !== undefined && row[delayIdx] !== null) ? String(row[delayIdx]).trim() : '';

        if (progRaw) {
          const wrap  = document.createElement('div'); wrap.className = 'pcma-progress';
          const label = document.createElement('div'); label.className = 'pcma-progress-label'; label.textContent = '⏳ Time Lapsed';
          const bar   = document.createElement('div'); bar.className   = 'pcma-progress-bar';
          const fill  = document.createElement('div'); fill.className  = 'pcma-progress-fill'; fill.textContent = '0%';
          bar.appendChild(fill); wrap.append(label, bar); mini.appendChild(wrap);

          const pctNum = Math.max(0, toPct(progRaw));
          const colorFor = (v) => {
            if(v > 100) return {bg: 'linear-gradient(90deg, #ff0844, #ffb199)', glow: '#ff0844'};
            if(v >= 100) return {bg: 'linear-gradient(90deg, #11998e, #38ef7d)', glow: '#38ef7d'};
            if(v > 80) return {bg: 'linear-gradient(90deg, #f6d365, #fda085)', glow: '#f6d365'};
            return {bg: 'linear-gradient(90deg, #b224ef, #7579ff)', glow: '#b224ef'};
          };
          
          const c = colorFor(pctNum);
          fill.style.background = c.bg;
          fill.style.boxShadow = `inset 0 2px 4px rgba(255,255,255,0.5), 0 0 12px ${c.glow}`;

          requestAnimationFrame(() => {
            const start = performance.now(); const duration = 1200;
            (function step(now){
              const t = Math.min(1, (now - start) / duration);
              const curr = pctNum * t;
              const width = Math.min(curr, 100);
              fill.style.width = width + '%';
              fill.textContent = `${Math.round(curr)}%${delayRaw ? ' ('+delayRaw+')' : ''}`;
              if (t < 1) requestAnimationFrame(step);
              else {
                fill.style.width = Math.min(pctNum, 100) + '%';
                fill.textContent = `${Math.round(pctNum)}%${delayRaw ? ' ('+delayRaw+')' : ''}`;
              }
            })(start);
          });
        }
        modalContent.appendChild(mini);
      }

      // Team Cards
      const teamData = [
        { key: 'PE', val: peIdx > -1 ? row[peIdx] : '', bg: 'var(--pastel-blue)', border: 'var(--pastel-blue-dark)' },
        { key: 'PI', val: piIdx > -1 ? row[piIdx] : '', bg: 'var(--pastel-green)', border: 'var(--pastel-green-dark)' },
        { key: 'RE', val: reIdx > -1 ? row[reIdx] : '', bg: 'var(--pastel-purple)', border: 'var(--pastel-purple-dark)' },
        { key: 'QE', val: qeIdx > -1 ? row[qeIdx] : '', bg: 'var(--pastel-pink)', border: 'var(--pastel-pink-dark)' },
        { key: 'ME', val: meIdx > -1 ? row[meIdx] : '', bg: 'var(--pastel-orange)', border: 'var(--pastel-orange-dark)' },
      ];

      const activeMembers = teamData.filter(m => m.val && String(m.val).trim() !== '');

      if (activeMembers.length > 0) {
        const team = document.createElement('div');
        team.className = 'pcma-team';
        
        let gridHtml = `<span class="pcma-team-label">The Team</span><div class="team-grid">`;
        
        activeMembers.forEach(m => {
          gridHtml += `
            <div class="team-member" style="border-color: ${m.border}; box-shadow: 0 3px 0 ${m.border};">
              <div class="team-role" style="background: ${m.bg}; border: 1px solid ${m.border}; box-shadow: inset 0 1px 2px rgba(255,255,255,0.8), 0 1px 0 ${m.border}; color: #334155;">${m.key}</div>
              <div class="team-name">${m.val}</div>
            </div>
          `;
        });
        
        gridHtml += `</div>`;
        team.innerHTML = gridHtml;
        modalContent.appendChild(team);
      }
    }
  </script>
</body>
</html>
