<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Auto-Crop Scanner</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- jsPDF library for creating PDF files -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- OpenCV.js for document edge detection and cropping -->
    <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvReady();" type="text/javascript"></script>
    <style>
        /* Ensure the video and canvas stack perfectly */
        .video-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            background: #000;
            overflow: hidden;
            border-radius: 0.75rem;
        }
        #videoElement {
            width: 100%;
            display: block;
        }
        #overlayCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Let clicks pass through */
        }
        /* Custom thin scrollbar for thumbnails */
        .thumbnails-scroll::-webkit-scrollbar {
            height: 6px;
        }
        .thumbnails-scroll::-webkit-scrollbar-track {
            background: #1e293b;
            border-radius: 4px;
        }
        .thumbnails-scroll::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-slate-900 min-h-screen font-sans text-slate-100 selection:bg-blue-500 overflow-x-hidden">

    <main class="w-full max-w-md mx-auto p-4 flex flex-col h-screen">
        
        <!-- Header -->
        <header class="text-center py-4 shrink-0">
            <h1 class="text-xl font-bold text-white">Multi-Page Scanner</h1>
            <p id="statusText" class="text-slate-400 mt-1 text-sm h-5">Downloading AI vision models...</p>
        </header>

        <!-- Main Interaction Area -->
        <div class="flex-grow flex flex-col items-center justify-center w-full space-y-4 relative">
            
            <!-- Hidden Fallback Input -->
            <input type="file" id="fallbackCameraInput" accept="image/*" capture="environment" class="hidden">

            <!-- Start Screen -->
            <div id="startScreen" class="w-full flex flex-col items-center">
                <div class="mb-8 text-center text-slate-400">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-24 h-24 mx-auto mb-4 opacity-50" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                    <p>Make sure you have good lighting.</p>
                </div>
                
                <button id="startBtn" disabled class="w-full bg-slate-600 text-white font-semibold py-4 px-6 rounded-2xl shadow-md transition-all flex items-center justify-center space-x-2">
                    <svg id="loadingSpinner" class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span id="startBtnText">Loading AI...</span>
                </button>

                <!-- Fallback Start Label (Hidden initially) -->
                <label for="fallbackCameraInput" id="fallbackStartBtn" class="hidden w-full bg-slate-600 text-white font-semibold py-4 px-6 rounded-2xl shadow-md transition-all flex items-center justify-center space-x-2 cursor-pointer">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                    <span>Open Native Camera</span>
                </label>
            </div>

            <!-- Live Camera Screen -->
            <div id="cameraScreen" class="hidden w-full flex flex-col items-center h-full">
                <div class="video-container shadow-2xl ring-1 ring-slate-800">
                    <video id="videoElement" autoplay playsinline></video>
                    <canvas id="overlayCanvas"></canvas>
                    
                    <!-- Page Counter Overlay on Camera -->
                    <div id="cameraPageBadge" class="absolute top-4 right-4 bg-blue-600 text-white text-xs font-bold px-3 py-1 rounded-full hidden shadow-md">
                        Pages: 1
                    </div>
                </div>
                
                <!-- Bottom Controls -->
                <div class="mt-auto py-6 w-full flex justify-center items-center relative">
                    <button id="cancelCameraBtn" class="absolute left-0 text-slate-300 hover:text-white p-2">Cancel</button>
                    
                    <!-- Shutter Button -->
                    <button id="captureBtn" class="w-16 h-16 rounded-full border-4 border-white bg-slate-200 hover:bg-white active:scale-95 transition-all focus:outline-none shadow-lg"></button>
                </div>
            </div>

            <!-- Preview Screen -->
            <div id="previewScreen" class="hidden w-full flex flex-col items-center h-full space-y-4">
                <div class="w-full bg-slate-800 p-2 rounded-xl shadow-sm border border-slate-700 flex-grow flex items-center justify-center overflow-hidden">
                    <img id="previewImage" src="" alt="Captured Image" class="max-w-full max-h-[50vh] object-contain rounded">
                </div>
                
                <div class="grid grid-cols-2 gap-3 w-full shrink-0">
                    <button id="retakeBtn" class="bg-slate-700 hover:bg-slate-600 active:bg-slate-500 text-white font-semibold py-3 px-2 rounded-xl shadow-md transition-all text-sm">
                        Retake
                    </button>
                    <!-- Fallback Retake Label -->
                    <label for="fallbackCameraInput" id="fallbackRetakeBtn" class="hidden bg-slate-700 hover:bg-slate-600 active:bg-slate-500 text-white font-semibold py-3 px-2 rounded-xl shadow-md transition-all text-sm text-center cursor-pointer flex items-center justify-center">
                        Retake
                    </label>
                    
                    <button id="addPageBtn" class="bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white font-semibold py-3 px-2 rounded-xl shadow-md transition-all flex items-center justify-center space-x-1 text-sm">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                        <span>Add Page</span>
                    </button>
                    <!-- Fallback Add Page Label -->
                    <label for="fallbackCameraInput" id="fallbackAddPageBtn" class="hidden bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white font-semibold py-3 px-2 rounded-xl shadow-md transition-all flex items-center justify-center space-x-1 text-sm cursor-pointer">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                        <span>Add Page</span>
                    </label>

                    <button id="reviewSaveBtn" class="col-span-2 bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white font-semibold py-4 px-4 rounded-xl shadow-md transition-all flex items-center justify-center space-x-2">
                        <span>Review & Save PDF</span>
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5l10 -10"/></svg>
                    </button>
                </div>
            </div>

            <!-- Save / Finalize Screen -->
            <div id="saveScreen" class="hidden w-full flex flex-col items-center h-full justify-center space-y-6">
                <div class="w-full bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700 text-center flex flex-col max-h-full">
                    
                    <div class="shrink-0">
                        <h2 class="text-2xl font-bold text-white mb-1">Save Document</h2>
                        <p id="pageCountText" class="text-slate-400 mb-4 font-medium">1 Page Captured</p>
                    </div>

                    <!-- Thumbnails Gallery Area -->
                    <div id="thumbnailsContainer" class="flex overflow-x-auto space-x-3 mb-6 pb-3 w-full snap-x thumbnails-scroll shrink-0 min-h-[140px] items-center">
                        <!-- Thumbnails injected via JS -->
                    </div>

                    <div class="text-left w-full mb-6 shrink-0">
                        <label for="filenameInput" class="block text-sm font-medium text-slate-300 mb-2">File Name</label>
                        <input type="text" id="filenameInput" value="Scanned_Document" placeholder="Enter file name..." class="w-full bg-slate-900 border border-slate-600 rounded-lg px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>

                    <div class="flex flex-col space-y-3 shrink-0">
                        <button id="downloadPdfBtn" class="w-full bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white font-semibold py-4 px-4 rounded-xl shadow-md transition-all flex items-center justify-center space-x-2 disabled:opacity-50 disabled:cursor-not-allowed">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                            <span id="downloadBtnText">Download PDF</span>
                        </button>
                        
                        <div class="grid grid-cols-2 gap-3 mt-2">
                            <button id="addMoreFromSaveBtn" class="bg-slate-700 text-white hover:bg-slate-600 py-3 rounded-xl transition-all text-sm font-medium">
                                Add Page
                            </button>
                            <!-- Fallback Add Page from Save Label -->
                            <label for="fallbackCameraInput" id="fallbackAddMoreFromSaveBtn" class="hidden bg-slate-700 text-white hover:bg-slate-600 py-3 rounded-xl transition-all text-sm font-medium text-center cursor-pointer flex items-center justify-center">
                                Add Page
                            </label>
                            <button id="discardAllBtn" class="bg-transparent text-red-400 border border-red-400/30 hover:bg-red-400/10 py-3 rounded-xl transition-all text-sm font-medium">
                                Discard All
                            </button>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Hidden canvas used for processing frames -->
    <canvas id="processingCanvas" class="hidden"></canvas>

    <script>
        // --- State Variables ---
        let isOpenCvLoaded = false;
        let videoStream = null;
        let isStreaming = false;
        let currentDocumentCorners = null; 
        
        // Multi-page State
        let capturedPages = [];
        let currentScannedPage = null; // Holds { dataUrl, width, height } temporarily
        let isFallbackMode = false; // Tracks if we should use native camera

        // --- DOM Elements ---
        const startScreen = document.getElementById('startScreen');
        const cameraScreen = document.getElementById('cameraScreen');
        const previewScreen = document.getElementById('previewScreen');
        const saveScreen = document.getElementById('saveScreen');
        
        const videoElement = document.getElementById('videoElement');
        const overlayCanvas = document.getElementById('overlayCanvas');
        const processingCanvas = document.getElementById('processingCanvas');
        const previewImage = document.getElementById('previewImage');
        
        const fallbackCameraInput = document.getElementById('fallbackCameraInput');
        const startBtn = document.getElementById('startBtn');
        const fallbackStartBtn = document.getElementById('fallbackStartBtn');
        const captureBtn = document.getElementById('captureBtn');
        const cancelCameraBtn = document.getElementById('cancelCameraBtn');
        
        const retakeBtn = document.getElementById('retakeBtn');
        const fallbackRetakeBtn = document.getElementById('fallbackRetakeBtn');
        const addPageBtn = document.getElementById('addPageBtn');
        const fallbackAddPageBtn = document.getElementById('fallbackAddPageBtn');
        const reviewSaveBtn = document.getElementById('reviewSaveBtn');
        
        const thumbnailsContainer = document.getElementById('thumbnailsContainer');
        const filenameInput = document.getElementById('filenameInput');
        const downloadPdfBtn = document.getElementById('downloadPdfBtn');
        const discardAllBtn = document.getElementById('discardAllBtn');
        const addMoreFromSaveBtn = document.getElementById('addMoreFromSaveBtn');
        const fallbackAddMoreFromSaveBtn = document.getElementById('fallbackAddMoreFromSaveBtn');
        
        const statusText = document.getElementById('statusText');
        const cameraPageBadge = document.getElementById('cameraPageBadge');
        const pageCountText = document.getElementById('pageCountText');
        const downloadBtnText = document.getElementById('downloadBtnText');

        // Called automatically when OpenCV.js finishes loading
        function onOpenCvReady() {
            isOpenCvLoaded = true;
            document.getElementById('loadingSpinner').classList.add('hidden');
            document.getElementById('startBtnText').textContent = 'Open Scanner';
            
            startBtn.classList.remove('bg-slate-600');
            startBtn.classList.add('bg-blue-600', 'hover:bg-blue-500');
            startBtn.disabled = false;

            fallbackStartBtn.classList.remove('bg-slate-600');
            fallbackStartBtn.classList.add('bg-blue-600', 'hover:bg-blue-500');
            
            statusText.textContent = 'Ready. Press Open Scanner.';
        }

        window.addEventListener('DOMContentLoaded', () => {
            const { jsPDF } = window.jspdf;

            // --- 1. Start Scanner Function ---
            async function startScanner() {
                if (!isOpenCvLoaded) return;
                
                // Show page badge if we already have pages
                if (capturedPages.length > 0) {
                    cameraPageBadge.textContent = `Pages: ${capturedPages.length}`;
                    cameraPageBadge.classList.remove('hidden');
                } else {
                    cameraPageBadge.classList.add('hidden');
                }

                try {
                    statusText.textContent = "Starting camera...";
                    
                    videoStream = await navigator.mediaDevices.getUserMedia({ 
                        video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } },
                        audio: false 
                    });
                    
                    videoElement.srcObject = videoStream;
                    
                    videoElement.onplaying = () => {
                        isStreaming = true;
                        overlayCanvas.width = videoElement.clientWidth;
                        overlayCanvas.height = videoElement.clientHeight;
                        
                        startScreen.classList.add('hidden');
                        previewScreen.classList.add('hidden');
                        saveScreen.classList.add('hidden');
                        cameraScreen.classList.remove('hidden');
                        statusText.textContent = `Scanning Page ${capturedPages.length + 1}... Align document`;
                        
                        requestAnimationFrame(processVideoFrame);
                    };
                } catch (err) {
                    console.error("Camera blocked. Triggering fallback:", err);
                    statusText.textContent = "Live view blocked. Please tap 'Open Native Camera' below.";
                    enableFallbackUI();
                }
            }

            startBtn.addEventListener('click', startScanner);
            addMoreFromSaveBtn.addEventListener('click', () => {
                fallbackCameraInput.value = '';
                startScanner();
            });

            // --- Fallback UI Logic ---
            function enableFallbackUI() {
                isFallbackMode = true;
                
                // Hide programmatic buttons
                startBtn.classList.add('hidden');
                retakeBtn.classList.add('hidden');
                addPageBtn.classList.add('hidden');
                addMoreFromSaveBtn.classList.add('hidden');

                // Show physical HTML labels to trick mobile OS into allowing camera
                fallbackStartBtn.classList.remove('hidden');
                fallbackRetakeBtn.classList.remove('hidden');
                fallbackAddPageBtn.classList.remove('hidden');
                fallbackAddMoreFromSaveBtn.classList.remove('hidden');
            }

            // Handles clearing states just before the native camera opens via the Labels
            fallbackRetakeBtn.addEventListener('click', () => {
                currentScannedPage = null; 
                fallbackCameraInput.value = ''; 
            });

            fallbackAddPageBtn.addEventListener('click', () => {
                if(currentScannedPage) {
                    capturedPages.push(currentScannedPage);
                    currentScannedPage = null;
                }
                fallbackCameraInput.value = ''; 
            });

            fallbackAddMoreFromSaveBtn.addEventListener('click', () => {
                fallbackCameraInput.value = '';
            });

            // --- 2. Live Frame Processing (OpenCV) ---
            function processVideoFrame() {
                if (!isStreaming) return;

                const videoWidth = videoElement.videoWidth;
                const videoHeight = videoElement.videoHeight;
                
                const procMaxWidth = 400;
                let procWidth = videoWidth;
                let procHeight = videoHeight;
                
                if (videoWidth > procMaxWidth) {
                    procWidth = procMaxWidth;
                    procHeight = Math.round(videoHeight * (procMaxWidth / videoWidth));
                }

                processingCanvas.width = procWidth;
                processingCanvas.height = procHeight;
                const ctx = processingCanvas.getContext('2d', { willReadFrequently: true });
                ctx.drawImage(videoElement, 0, 0, procWidth, procHeight);

                try {
                    let src = cv.imread(processingCanvas);
                    let gray = new cv.Mat();
                    
                    cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY, 0);
                    cv.GaussianBlur(gray, gray, new cv.Size(5, 5), 0, 0, cv.BORDER_DEFAULT);
                    cv.Canny(gray, gray, 75, 200, 3, false);

                    let kernel = cv.Mat.ones(3, 3, cv.CV_8U);
                    cv.dilate(gray, gray, kernel, new cv.Point(-1, -1), 1, cv.BORDER_CONSTANT, cv.morphologyDefaultBorderValue());
                    cv.erode(gray, gray, kernel, new cv.Point(-1, -1), 1, cv.BORDER_CONSTANT, cv.morphologyDefaultBorderValue());
                    kernel.delete();

                    let contours = new cv.MatVector();
                    let hierarchy = new cv.Mat();
                    cv.findContours(gray, contours, hierarchy, cv.RETR_LIST, cv.CHAIN_APPROX_SIMPLE);

                    let maxArea = 0;
                    let bestApprox = null;

                    for (let i = 0; i < contours.size(); ++i) {
                        let cnt = contours.get(i);
                        let area = cv.contourArea(cnt);
                        
                        if (area > (procWidth * procHeight * 0.05)) { 
                            let hull = new cv.Mat();
                            cv.convexHull(cnt, hull, false, true);

                            let approx = new cv.Mat();
                            let perimeter = cv.arcLength(hull, true);
                            
                            for (let eps = 0.02; eps <= 0.08; eps += 0.02) {
                                cv.approxPolyDP(hull, approx, eps * perimeter, true);
                                if (approx.rows === 4) break;
                            }

                            if (approx.rows === 4 && area > maxArea) {
                                maxArea = area;
                                if (bestApprox) bestApprox.delete();
                                bestApprox = approx.clone();
                            }
                            hull.delete();
                            approx.delete();
                        }
                        cnt.delete();
                    }

                    const overlayCtx = overlayCanvas.getContext('2d');
                    overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);

                    if (bestApprox) {
                        currentDocumentCorners = [];
                        const scaleX = overlayCanvas.width / procWidth;
                        const scaleY = overlayCanvas.height / procHeight;

                        overlayCtx.beginPath();
                        overlayCtx.strokeStyle = 'yellow';
                        overlayCtx.lineWidth = 4;
                        overlayCtx.lineJoin = 'round';

                        for (let j = 0; j < 4; j++) {
                            let x = bestApprox.data32S[j * 2];
                            let y = bestApprox.data32S[j * 2 + 1];
                            
                            currentDocumentCorners.push({ x: x, y: y, procWidth: procWidth, procHeight: procHeight });

                            x = x * scaleX;
                            y = y * scaleY;

                            if (j === 0) overlayCtx.moveTo(x, y);
                            else overlayCtx.lineTo(x, y);
                        }
                        overlayCtx.closePath();
                        overlayCtx.fillStyle = 'rgba(255, 255, 0, 0.15)';
                        overlayCtx.fill();
                        overlayCtx.stroke();
                        
                        bestApprox.delete();
                    } else {
                        currentDocumentCorners = null;
                    }

                    src.delete(); gray.delete(); contours.delete(); hierarchy.delete();

                } catch (err) { }

                setTimeout(() => requestAnimationFrame(processVideoFrame), 100); 
            }

            // --- 3A. Capture & Crop (Live Stream) ---
            captureBtn.addEventListener('click', () => {
                if (!isStreaming) return;
                statusText.textContent = "Processing capture...";
                
                const fullCanvas = document.createElement('canvas');
                fullCanvas.width = videoElement.videoWidth;
                fullCanvas.height = videoElement.videoHeight;
                const fullCtx = fullCanvas.getContext('2d');
                fullCtx.drawImage(videoElement, 0, 0, fullCanvas.width, fullCanvas.height);

                processAndWarpDocument(fullCanvas, currentDocumentCorners, true);
            });

            // --- 3B. Capture & Crop (Fallback Image) ---
            fallbackCameraInput.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file) {
                    if (capturedPages.length > 0) {
                        showSaveScreen(); 
                    } else {
                        resetToStart();
                    }
                    return;
                }

                statusText.textContent = "Analyzing document structure...";
                startScreen.classList.add('hidden');
                saveScreen.classList.add('hidden');
                previewScreen.classList.remove('hidden');

                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        const maxDim = 1600;
                        let w = img.width, h = img.height;
                        if (w > h && w > maxDim) { h = Math.round(h * maxDim/w); w = maxDim; }
                        else if (h > maxDim) { w = Math.round(w * maxDim/h); h = maxDim; }

                        const canvas = document.createElement('canvas');
                        canvas.width = w; canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, w, h);

                        try {
                            let src = cv.imread(canvas);
                            let gray = new cv.Mat();
                            cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY, 0);
                            cv.GaussianBlur(gray, gray, new cv.Size(5, 5), 0, 0, cv.BORDER_DEFAULT);
                            cv.Canny(gray, gray, 75, 200, 3, false);

                            let kernel = cv.Mat.ones(5, 5, cv.CV_8U);
                            cv.dilate(gray, gray, kernel, new cv.Point(-1, -1), 1, cv.BORDER_CONSTANT, cv.morphologyDefaultBorderValue());
                            cv.erode(gray, gray, kernel, new cv.Point(-1, -1), 1, cv.BORDER_CONSTANT, cv.morphologyDefaultBorderValue());
                            kernel.delete();

                            let contours = new cv.MatVector();
                            let hierarchy = new cv.Mat();
                            cv.findContours(gray, contours, hierarchy, cv.RETR_LIST, cv.CHAIN_APPROX_SIMPLE);

                            let maxArea = 0;
                            let detectedCorners = null;

                            for (let i = 0; i < contours.size(); ++i) {
                                let cnt = contours.get(i);
                                let area = cv.contourArea(cnt);
                                if (area > (w * h * 0.05)) { 
                                    let hull = new cv.Mat();
                                    cv.convexHull(cnt, hull, false, true);

                                    let approx = new cv.Mat();
                                    let perimeter = cv.arcLength(hull, true);
                                    
                                    for (let eps = 0.02; eps <= 0.08; eps += 0.02) {
                                        cv.approxPolyDP(hull, approx, eps * perimeter, true);
                                        if (approx.rows === 4) break;
                                    }

                                    if (approx.rows === 4 && area > maxArea) {
                                        maxArea = area;
                                        detectedCorners = [];
                                        for (let j = 0; j < 4; j++) {
                                            detectedCorners.push({ x: approx.data32S[j * 2], y: approx.data32S[j * 2 + 1], procWidth: w, procHeight: h });
                                        }
                                    }
                                    hull.delete();
                                    approx.delete();
                                }
                                cnt.delete();
                            }
                            src.delete(); gray.delete(); contours.delete(); hierarchy.delete();

                            processAndWarpDocument(canvas, detectedCorners, false);

                        } catch(err) {
                            statusText.textContent = "Failed to auto-crop image.";
                        }
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });

            // --- Unified Document Cropping Logic ---
            function processAndWarpDocument(sourceCanvas, cornersToUse, isFromLiveVideo) {
                try {
                    let src = cv.imread(sourceCanvas);
                    let dst = new cv.Mat();

                    if (cornersToUse) {
                        let scaleX = sourceCanvas.width / cornersToUse[0].procWidth;
                        let scaleY = sourceCanvas.height / cornersToUse[0].procHeight;

                        let scaledCorners = cornersToUse.map(pt => ({ x: pt.x * scaleX, y: pt.y * scaleY }));
                        let ordered = orderCorners(scaledCorners);

                        let w1 = Math.hypot(ordered[2].x - ordered[3].x, ordered[2].y - ordered[3].y);
                        let w2 = Math.hypot(ordered[1].x - ordered[0].x, ordered[1].y - ordered[0].y);
                        let maxWidth = Math.max(w1, w2);

                        let h1 = Math.hypot(ordered[1].x - ordered[2].x, ordered[1].y - ordered[2].y);
                        let h2 = Math.hypot(ordered[0].x - ordered[3].x, ordered[0].y - ordered[3].y);
                        let maxHeight = Math.max(h1, h2);

                        let srcTri = cv.matFromArray(4, 1, cv.CV_32FC2, [
                            ordered[0].x, ordered[0].y, ordered[1].x, ordered[1].y,
                            ordered[2].x, ordered[2].y, ordered[3].x, ordered[3].y
                        ]);
                        let dstTri = cv.matFromArray(4, 1, cv.CV_32FC2, [
                            0, 0, maxWidth, 0, maxWidth, maxHeight, 0, maxHeight
                        ]);

                        let M = cv.getPerspectiveTransform(srcTri, dstTri);
                        let dsize = new cv.Size(maxWidth, maxHeight);
                        
                        cv.warpPerspective(src, dst, M, dsize, cv.INTER_LINEAR, cv.BORDER_CONSTANT, new cv.Scalar());
                        
                        srcTri.delete(); dstTri.delete(); M.delete();
                    } else {
                        dst = src.clone();
                    }

                    let outCanvas = document.createElement('canvas');
                    cv.imshow(outCanvas, dst);
                    
                    // Store current page temporarily in memory
                    currentScannedPage = {
                        dataUrl: outCanvas.toDataURL('image/jpeg', 0.85),
                        width: outCanvas.width,
                        height: outCanvas.height
                    };
                    previewImage.src = currentScannedPage.dataUrl;
                    
                    if (isFromLiveVideo) {
                        stopCamera();
                        cameraScreen.classList.add('hidden');
                        previewScreen.classList.remove('hidden');
                    }
                    
                    statusText.textContent = cornersToUse ? "Page cropped! Add another, or finish." : "No edges found. Used original.";
                    src.delete(); dst.delete();
                } catch (err) {
                    statusText.textContent = "Error cropping image.";
                }
            }

            // --- Preview Screen Actions ---
            
            // Retake current frame
            retakeBtn.addEventListener('click', () => {
                currentScannedPage = null; // discard
                fallbackCameraInput.value = ''; 
                startScanner();
            });

            // Add to array and take another
            addPageBtn.addEventListener('click', () => {
                if(currentScannedPage) {
                    capturedPages.push(currentScannedPage);
                    currentScannedPage = null;
                }
                fallbackCameraInput.value = ''; 
                startScanner();
            });

            // Add to array and move to Save Screen
            reviewSaveBtn.addEventListener('click', () => {
                if(currentScannedPage) {
                    capturedPages.push(currentScannedPage);
                    currentScannedPage = null;
                }
                showSaveScreen();
            });

            // --- Render & Handle the Save Gallery ---

            function showSaveScreen() {
                cameraScreen.classList.add('hidden');
                previewScreen.classList.add('hidden');
                startScreen.classList.add('hidden');
                
                renderCapturedGallery();
                
                statusText.textContent = "Review pages and save to PDF.";
                saveScreen.classList.remove('hidden');
            }

            function renderCapturedGallery() {
                thumbnailsContainer.innerHTML = '';
                
                const count = capturedPages.length;
                
                if (count === 0) {
                    pageCountText.textContent = 'No Pages Captured';
                    downloadBtnText.textContent = 'Download PDF';
                    downloadPdfBtn.disabled = true;
                    // Provide an empty state visual
                    const emptyState = document.createElement('div');
                    emptyState.className = 'w-full text-slate-500 text-sm italic text-center py-8';
                    emptyState.textContent = 'All pages deleted. Add a page to continue.';
                    thumbnailsContainer.appendChild(emptyState);
                    return;
                }

                downloadPdfBtn.disabled = false;
                pageCountText.textContent = count === 1 ? '1 Page Ready' : `${count} Pages Ready`;
                downloadBtnText.textContent = `Download PDF (${count} ${count === 1 ? 'page' : 'pages'})`;

                // Build thumbnails
                capturedPages.forEach((page, index) => {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'relative shrink-0 w-24 h-32 snap-center rounded-lg border border-slate-600 overflow-hidden bg-slate-700 flex items-center justify-center';
                    
                    const img = document.createElement('img');
                    img.src = page.dataUrl;
                    img.className = 'max-w-full max-h-full object-contain';
                    
                    // Trash / Delete button
                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'absolute top-1 right-1 bg-red-600 bg-opacity-80 hover:bg-opacity-100 text-white rounded p-1.5 transition-all shadow-sm focus:outline-none';
                    deleteBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path></svg>`;
                    
                    deleteBtn.onclick = () => {
                        if (confirm(`Remove Page ${index + 1}?`)) {
                            capturedPages.splice(index, 1);
                            renderCapturedGallery(); // Re-render gallery after deletion
                            
                            if (capturedPages.length === 0) {
                                // If they deleted the very last page, auto-return to camera
                                resetToStart();
                            }
                        }
                    };
                    
                    // Page Number Badge
                    const pageNumBadge = document.createElement('div');
                    pageNumBadge.className = 'absolute bottom-1 left-1 bg-slate-900 bg-opacity-80 text-[10px] font-bold px-1.5 py-0.5 rounded text-white';
                    pageNumBadge.textContent = `${index + 1}`;

                    wrapper.appendChild(img);
                    wrapper.appendChild(deleteBtn);
                    wrapper.appendChild(pageNumBadge);
                    thumbnailsContainer.appendChild(wrapper);
                });
            }

            // --- Final Save Screen Actions ---

            downloadPdfBtn.addEventListener('click', () => {
                if (capturedPages.length === 0) return;
                statusText.textContent = "Generating Multi-page PDF...";
                downloadPdfBtn.disabled = true;
                
                try {
                    let doc = null;

                    capturedPages.forEach((page, index) => {
                        const orientation = page.width > page.height ? 'l' : 'p';
                        
                        if (index === 0) {
                            // First page initialization
                            doc = new jsPDF({
                                orientation: orientation,
                                unit: 'px',
                                format: [page.width, page.height]
                            });
                        } else {
                            // Add subsequent pages
                            doc.addPage([page.width, page.height], orientation);
                            doc.setPage(index + 1);
                        }

                        // Add image to the current page
                        doc.addImage(page.dataUrl, 'JPEG', 0, 0, page.width, page.height);
                    });

                    // Get Filename
                    let name = filenameInput.value.trim();
                    if (!name) name = `Scanned_Document_${Date.now()}`;
                    
                    doc.save(`${name}.pdf`);
                    statusText.textContent = "PDF Saved Successfully!";
                    
                    // Reset everything after save
                    setTimeout(() => {
                        resetToStart();
                        downloadPdfBtn.disabled = false;
                    }, 2000);
                } catch (error) {
                    console.error("PDF Error:", error);
                    statusText.textContent = "Error making PDF.";
                    downloadPdfBtn.disabled = false;
                }
            });

            discardAllBtn.addEventListener('click', () => {
                if(confirm("Are you sure you want to discard all scanned pages?")) {
                    resetToStart();
                }
            });

            // --- Utilities ---
            cancelCameraBtn.addEventListener('click', () => {
                stopCamera();
                if (capturedPages.length > 0) {
                    showSaveScreen();
                } else {
                    resetToStart();
                }
            });

            function resetToStart() {
                stopCamera();
                capturedPages = [];
                currentScannedPage = null;
                filenameInput.value = "Scanned_Document";
                
                cameraScreen.classList.add('hidden');
                previewScreen.classList.add('hidden');
                saveScreen.classList.add('hidden');
                startScreen.classList.remove('hidden');
                
                if (isFallbackMode) {
                    statusText.textContent = "Ready. Tap Open Native Camera.";
                } else {
                    statusText.textContent = "Ready. Press Open Scanner.";
                }
                fallbackCameraInput.value = ''; 
            }

            function stopCamera() {
                isStreaming = false;
                if (videoStream) {
                    videoStream.getTracks().forEach(track => track.stop());
                }
            }

            function orderCorners(pts) {
                let rect = new Array(4);
                pts.sort((a, b) => (a.x + a.y) - (b.x + b.y));
                rect[0] = pts[0];
                rect[2] = pts[3];
                let rem = [pts[1], pts[2]];
                rem.sort((a, b) => (a.y - a.x) - (b.y - b.x));
                rect[1] = rem[0]; 
                rect[3] = rem[1]; 
                return rect;
            }
        });
    </script>
</body>
</html>
